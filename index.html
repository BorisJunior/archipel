/* =========================================================================
   GRAIN : une texture procédurale douce sur les matériaux (bruit en
   coordonnées monde). Des taches larges (herbe plus ou moins verte,
   façades patinées) et un grain fin qui s'efface avec la distance.
   ========================================================================= */
const GRAIN = { on: true, mats: new Set() };
const GRAIN_GLSL = `
varying vec3 vGrainP;
float grH(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float grN(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(grH(i), grH(i + vec3(1, 0, 0)), f.x), mix(grH(i + vec3(0, 1, 0)), grH(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(grH(i + vec3(0, 0, 1)), grH(i + vec3(1, 0, 1)), f.x), mix(grH(i + vec3(0, 1, 1)), grH(i + vec3(1, 1, 1)), f.x), f.y), f.z); }
float grN2(vec2 x){ vec2 i = floor(x); vec2 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(grH(vec3(i, 0.0)), grH(vec3(i + vec2(1.0, 0.0), 0.0)), f.x), mix(grH(vec3(i + vec2(0.0, 1.0), 0.0)), grH(vec3(i + vec2(1.0, 1.0), 0.0)), f.x), f.y); }`;
function addGrain(m, { fine = 0.06, coarse = 0.07, fs = 6.5, cs = 0.55 } = {}) {
  if (!m || GRAIN.mats.has(m) || !m.isMeshStandardMaterial) return;
  GRAIN.mats.add(m);
  const prev = m.onBeforeCompile;
  // mémorisé pour la fusion en couleurs de sommets (même grain sur le matériau fusionné)
  m.userData.grain = { fine, coarse, fs, cs };
  m.userData.grainOnly = prev === THREE.Material.prototype.onBeforeCompile;
  m.onBeforeCompile = (sh, r) => {
    if (prev) prev(sh, r);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vGrainP;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vGrainP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vGrainP = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + GRAIN_GLSL)
      .replace('#include <color_fragment>', DIRECT ? `#include <color_fragment>
      {
        // téléphone : bruit 2D (moitié moins de calcul), grain fin seulement de près
        float grFade = clamp(1.0 - (length(vViewPosition) - 22.0) / 30.0, 0.0, 1.0);
        vec2 gp = vec2(vGrainP.x + vGrainP.y * 0.61, vGrainP.z - vGrainP.y * 0.37);
        float g1 = 0.5;
        if (grFade > 0.0) g1 = grN2(gp * ${fs.toFixed(2)});
        float g2 = grN2(gp * ${cs.toFixed(2)} + vec2(7.1, 3.3));
        diffuseColor.rgb *= 1.0 + (g1 - 0.5) * ${fine.toFixed(3)} * grFade + (g2 - 0.5) * ${coarse.toFixed(3)};
      }` : `#include <color_fragment>
      {
        float grFade = clamp(1.0 - (length(vViewPosition) - 26.0) / 40.0, 0.0, 1.0);
        float g1 = grN(vGrainP * ${fs.toFixed(2)});
        float g2 = grN(vGrainP * ${cs.toFixed(2)} + vec3(7.1, 3.3, 1.7));
        diffuseColor.rgb *= 1.0 + (g1 - 0.5) * ${fine.toFixed(3)} * grFade + (g2 - 0.5) * ${coarse.toFixed(3)};
      }`);
  };
  const prevKey = m.customProgramCacheKey ? m.customProgramCacheKey() : '';
  m.customProgramCacheKey = () => `grain|${fine}|${coarse}|${fs}|${cs}|${prevKey}`;
  m.needsUpdate = true;
}
// applique le grain à tous les matériaux opaques du décor
function grainWorld() {
  if (!GRAIN.on) return;
  const seen = new Set();
  scene.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
      if (seen.has(m)) continue;
      seen.add(m);
      if (!m.isMeshStandardMaterial || m.transparent || m.map || m.userData.noGrain) continue;
      if (m.emissive && m.emissiveIntensity > 0.5 && (m.emissive.r + m.emissive.g + m.emissive.b) > 0.3) continue;
      const big = o.userData.ground || m === rockMat;
      addGrain(m, big ? { fine: 0.07, coarse: 0.1, fs: 5.5, cs: 0.35 } : undefined);
    }
  });
}

function audioInit() {
  if (AUDIO.ctx) return;

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  const makeup = ctx.createGain(); makeup.gain.value = 1.25;
  comp.connect(makeup); makeup.connect(ctx.destination);
  AUDIO.master = ctx.createGain(); AUDIO.master.gain.value = AUDIO.on ? MASTER_VOL : 0; AUDIO.master.connect(comp);
  AUDIO.music = ctx.createGain(); AUDIO.music.gain.value = 0; AUDIO.music.connect(AUDIO.master);
  AUDIO.sfx = ctx.createGain(); AUDIO.sfx.gain.value = 0.8; AUDIO.sfx.connect(AUDIO.master);
  AUDIO.amb = ctx.createGain(); AUDIO.amb.gain.value = 0.0; AUDIO.amb.connect(AUDIO.master);
  // réverbération (réponse impulsionnelle générée)
  AUDIO.verb = ctx.createConvolver();
  AUDIO.verb.buffer = makeImpulse(ctx, 2.8, 2.2);
  AUDIO.verbIn = ctx.createGain(); AUDIO.verbIn.gain.value = 0.9;
  AUDIO.verbIn.connect(AUDIO.verb);
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;
  AUDIO.verb.connect(verbOut); verbOut.connect(AUDIO.master);
  // écho doux pour les mélodies
  AUDIO.delay = ctx.createDelay(1.5);
  const fb = ctx.createGain(); fb.gain.value = 0.28;
  const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  AUDIO.delay.connect(dlp); dlp.connect(fb); fb.connect(AUDIO.delay);
  AUDIO.delayIn = ctx.createGain(); AUDIO.delayIn.gain.value = 0.35;
  AUDIO.delayIn.connect(AUDIO.delay);
  const dOut = ctx.createGain(); dOut.gain.value = 0.5;
  dlp.connect(dOut); dOut.connect(AUDIO.music); dOut.connect(AUDIO.verbIn);

  for (let i = 0; i < cs.length; i++) { const d = Math.hypot(x - cs[i].x, z - cs[i].z) - cs[i].r; if (d < bd) { bd = d; best = i; } }

function vegBuild(kind, geo, material, list, xz, fill, { cast = false, receive = true, click = null } = {}) {
  const groups = new Map();
  for (const it of list) { const [x, z] = xz(it); const k = vegChunkIndex(x, z); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  for (const [k, items] of groups) {
    const im = new THREE.InstancedMesh(geo, material, items.length);
    items.forEach((it, i) => fill(im, i, it, dummy, col));
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.castShadow = cast; im.receiveShadow = receive;
    im.name = kind;
    im.computeBoundingSphere();
    if (click) im.userData.click = click;
    world.add(im);
    const c = VEG.centers[k];
    const ch = VEG.chunks[k] || (VEG.chunks[k] = { c: V3(c.x, 0, c.z), m: {}, lvl: -1 });
    ch.m[kind] = im;

}
function updateVegLOD(force = false) {
  if (!force && clock.frame % 6) return;
  const map = typeof UI !== 'undefined' && UI.mode === 'map';
  for (const ch of VEG.chunks) {
    if (!ch) continue;
    const d = camera.position.distanceTo(ch.c);
    const lvl = map || d > VEG_FAR ? 2 : d > VEG_NEAR ? 1 : 0;
    if (lvl === ch.lvl && !force) continue;
    ch.lvl = lvl;
    if (ch.m.tuft) ch.m.tuft.visible = lvl === 0;
    if (ch.m.flower) ch.m.flower.visible = lvl === 0;
    if (ch.m.blob) ch.m.blob.geometry = lvl === 0 ? VEG.blobHi : VEG.blobLo;
  }
  // mer de nuages : les secteurs noyés dans la brume ne sont plus dessinés
  const fogFar = scene.fog ? scene.fog.far : 1e9;
  for (const c of VEG.clouds) c.m.visible = camera.position.distanceTo(c.c) - c.r < fogFar + 10;
}
function buildInstanced() {
  VEG.centers = [{ x: 0, z: 0, r: 16 }, ...Object.values(ISLE_POS).map((p) => ({ x: p.x, z: p.z, r: p.rad || 12 }))];
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  // troncs et pins : peu de triangles, un seul lot pour tout l'archipel

  TREES.trunks.forEach(([x, y, z, s], i) => { dummy.position.set(x, y, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(s, s * 1.15, s); dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix); });
  trunks.castShadow = true; trunks.receiveShadow = true;

  world.add(trunks);
  // feuillages : par île, deux niveaux de détail

    d.position.set(x, y, z); d.rotation.set(0, 0, 0); d.scale.set(s, s * 0.92, s); d.updateMatrix(); im.setMatrixAt(i, d.matrix); im.setColorAt(i, cl.set(c));
  }, { cast: true, click: { tree: true } });

  }
  // lampadaires : le corps (mât, socle, chapeau) en une pièce, la lanterne lumineuse à part

    const n = LAMPS.length;
    const body = mergeGeometries([
      new THREE.CylinderGeometry(0.035, 0.045, 1.55, 6, 1, true).translate(0, 0.78, 0),
      new THREE.CylinderGeometry(0.09, 0.12, 0.14, 6).translate(0, 0.07, 0),
      G.cone(0.17, 0.16, 4).rotateY(Math.PI / 4).translate(0, 1.87, 0),
    ].map((g) => { g.deleteAttribute('uv'); return g; }));
    const head = G.box(0.2, 0.25, 0.2).translate(0, 1.66, 0);
    for (const [geo, m, name] of [[body, mat(C.navy, { r: 0.6 }), 'lampBody'], [head, mat(0xfff0c9, { e: 0xffcf7a, ei: 0.9, r: 0.4 }), 'lampHead']]) {
      const im = new THREE.InstancedMesh(geo, m, n);
      LAMPS.forEach(([x, y, z, s = 1], i) => { dummy.position.set(x, y, z); dummy.scale.setScalar(s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
      im.castShadow = name === 'lampBody';
      im.name = name;
      world.add(im);
    }
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.Float32BufferAttribute(LAMPS.flatMap(([x, y, z, s = 1]) => [x, y + 1.66 * s, z]), 3));
    const pts = new THREE.Points(pg, new THREE.PointsMaterial({ size: 1.3, map: radialTex, color: 0xffd08a, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true }));

  // touffes d'herbe et fleurs : par île, masquées de loin
  if (TUFTS.length) {

      G.cone(0.05, 0.2, 4).translate(0, 0.1, 0),
      G.cone(0.04, 0.15, 4).rotateZ(0.35).translate(0.05, 0.07, 0.01),

}

/* ---------- île ---------- */
function buildIsland({ id, cx, cz, outline, holes = [], topMat = null, sideMat = null, thickness = 0.7, depth = 11, seed = 1, extraRocks = 1 }) {
  const r = mulberry32(seed);
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  world.add(g);
  const shape = new THREE.Shape(outline.map(([x, z]) => new THREE.Vector2(x, -z)));
  for (const h of holes) shape.holes.push(new THREE.Path(h.map(([x, z]) => new THREE.Vector2(x, -z))));
  const bev = 0.16;
  const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: true, bevelThickness: bev, bevelSize: 0.2, bevelSegments: 3, curveSegments: 6 });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, -(thickness + bev), 0);
  const slab = new THREE.Mesh(geo, [topMat || mat(C.grass), sideMat || mat(C.grassSide)]);
  slab.receiveShadow = true;
  slab.userData.ground = true;
  slab.userData.keep = true;
  g.add(slab);
  const rockTop = -(thickness + bev * 2) + 0.06;
  let area = 0;
  outline.forEach(([x, z]) => { area = Math.max(area, Math.hypot(x, z)); });
  const rock = new THREE.Mesh(rockGeometry(outline, { top: rockTop, depth, r, N: Math.min(36, Math.max(18, Math.round(area * 2.2))) }), rockMat);
  rock.receiveShadow = true;
  rock.userData.keep = true;
  g.add(rock);
  for (let i = 0; i < extraRocks; i++) {
    const a = r() * TAU, d = area * rr(0.25, 0.45, r);
    const small = outlineBlob(area * rr(0.18, 0.28, r), area * rr(0.18, 0.28, r), 12, r, 0.15);
    const rg = rockGeometry(small, { top: rockTop - depth * rr(0.2, 0.35, r), depth: depth * rr(0.45, 0.65, r), rings: 4, r, N: 12, tipJitter: 0.4 });
    const m = new THREE.Mesh(rg, rockMat);
    m.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    m.userData.keep = true;
    g.add(m);
  }
  g.updateMatrixWorld(true);
  const isl = { id, group: g, outline, cx, cz, holes, obstacles: [] };
  ISLANDS[id] = isl;
  return isl;
}
// Obstacles (repère local de l'île) : cercles et rectangles
function obstacleCircle(isl, x, z, r) { isl.obstacles.push({ c: 1, x, z, r }); }
function obstacleRect(isl, x0, z0, x1, z1) { isl.obstacles.push({ c: 0, x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1) }); }

/* ---------- dalles de pierre posées sur l'herbe ---------- */
function flatShape(parent, pts, material, y = 0.015, holes = []) {
  const shape = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  for (const h of holes) shape.holes.push(new THREE.Path(h.map(([x, z]) => new THREE.Vector2(x, -z))));
  const geo = new THREE.ShapeGeometry(shape, 8);
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, material);
  m.position.y = y;
  m.receiveShadow = true;
  m.userData.keep = true;
  parent.add(m);
  return m;
}
function pathStrip(parent, ax, az, bx, bz, w, material, y = 0.02) {
  const dx = bx - ax, dz = bz - az, l = Math.hypot(dx, dz);
  const nx = -dz / l, nz = dx / l;
  const pts = [[ax + nx * w / 2, az + nz * w / 2], [bx + nx * w / 2, bz + nz * w / 2], [bx - nx * w / 2, bz - nz * w / 2], [ax - nx * w / 2, az - nz * w / 2]];
  return flatShape(parent, pts, material, y);
}

/* ---------- ponts ---------- */
const BRIDGES = [];
// tous les ponts finissent en deux maillages (tablier, garde-corps) : deux appels pour l'archipel
const BRIDGE_PARTS = { deck: [], rails: [] };
function flushBridges() {
  const out = [];
  if (BRIDGE_PARTS.deck.length) {
    const deck = new THREE.Mesh(mergeGeometries(BRIDGE_PARTS.deck.map((g) => ensureIndexed(g))), mat(0xffffff, { vc: true, r: 0.9 }));
    deck.castShadow = true; deck.receiveShadow = true;
    deck.userData.ground = true;
    deck.name = 'bridgeDecks';
    world.add(deck); out.push(deck);
  }
  if (BRIDGE_PARTS.rails.length) {
    const rails = new THREE.Mesh(mergeGeometries(BRIDGE_PARTS.rails.map((g) => ensureIndexed(g))), mat(0xffffff, { vc: true, r: 0.85 }));
    rails.castShadow = true; rails.receiveShadow = true;
    rails.name = 'bridgeRails';
    world.add(rails); out.push(rails);
  }
  BRIDGE_PARTS.deck.length = 0; BRIDGE_PARTS.rails.length = 0;
  return out;
}
function buildBridge(a, b, { id, width = 2.0, arch = 0.55, bend = 0, open = true, rails = true, lampEnds = true, color = C.stone } = {}) {
  const dir = V3().subVectors(b, a);
  const len = dir.length();
  dir.normalize();
  const side = V3(-dir.z, 0, dir.x);
  const ctrl = V3().addVectors(a, b).multiplyScalar(0.5).addScaledVector(side, bend);
  const curve = new THREE.QuadraticBezierCurve3(a.clone(), ctrl, b.clone());
  const N = Math.max(10, Math.ceil(len * 2.4));
  const S = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t); tan.y = 0; tan.normalize();
    const sd = V3(-tan.z, 0, tan.x);
    S.push({ p, t, tan, sd, y: arch * Math.sin(Math.PI * t) });
  }
  const th = 0.34;
  const pos = [], col = [];
  const cTop = new THREE.Color(color), cSide = new THREE.Color(C.stone2);
  // quadrilatère orienté : la face regarde dans la direction voulue (un seul côté à dessiner)
  const _qa = new THREE.Vector3(), _qb = new THREE.Vector3(), _qn = new THREE.Vector3();
  const quad = (A, B, Cc, D, want, c) => {
    _qa.set(B[0] - A[0], B[1] - A[1], B[2] - A[2]); _qb.set(Cc[0] - A[0], Cc[1] - A[1], Cc[2] - A[2]);
    _qn.crossVectors(_qa, _qb);
    if (_qn.x * want[0] + _qn.y * want[1] + _qn.z * want[2] >= 0) pos.push(...A, ...B, ...Cc, ...B, ...D, ...Cc);
    else pos.push(...A, ...Cc, ...B, ...B, ...Cc, ...D);
    for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b);
  };
  const hw = width / 2;
  const P = S.map(({ p, sd, y, t }) => {
    const under = y - th - 0.5 * Math.pow(1 - Math.sin(Math.PI * t), 1.5);
    return {
      TL: [p.x + sd.x * hw, y, p.z + sd.z * hw], TR: [p.x - sd.x * hw, y, p.z - sd.z * hw],
      BL: [p.x + sd.x * hw, under, p.z + sd.z * hw], BR: [p.x - sd.x * hw, under, p.z - sd.z * hw],
    };
  });
  for (let i = 0; i < N; i++) {
    const sd = S[i].sd;
    quad(P[i].TL, P[i + 1].TL, P[i].TR, P[i + 1].TR, [0, 1, 0], cTop);
    quad(P[i].BL, P[i + 1].BL, P[i].TL, P[i + 1].TL, [sd.x, 0, sd.z], cSide);
    quad(P[i].TR, P[i + 1].TR, P[i].BR, P[i + 1].BR, [-sd.x, 0, -sd.z], cSide);
    quad(P[i].BR, P[i + 1].BR, P[i].BL, P[i + 1].BL, [0, -1, 0], cSide);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  BRIDGE_PARTS.deck.push(geo);
  if (rails) {
    const postGeo = G.box(0.13, 0.5, 0.13);
    const railCol = new THREE.Color(0xfaf1e4);
    const add = (g) => { g.deleteAttribute('uv'); BRIDGE_PARTS.rails.push(colored(g, railCol)); };
    for (const s of [-1, 1]) {
      const railPts = [];
      const steps = Math.max(3, Math.round(len / 1.1));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const idx = Math.round(t * N);
        const { p, sd, y } = S[idx];
        const x = p.x + sd.x * (hw - 0.1) * s, z = p.z + sd.z * (hw - 0.1) * s;
        add(postGeo.clone().translate(x, y + 0.25, z));
        railPts.push(V3(x, y + 0.52, z));
      }
      const rc = new THREE.CatmullRomCurve3(railPts);
      add(new THREE.TubeGeometry(rc, steps * 3, 0.045, 5, false));
    }
  }
  const grp3 = new THREE.Group();
  world.add(grp3);
  let bx0 = Infinity, bx1 = -Infinity, bz0 = Infinity, bz1 = -Infinity;
  for (const q of S) { bx0 = Math.min(bx0, q.p.x); bx1 = Math.max(bx1, q.p.x); bz0 = Math.min(bz0, q.p.z); bz1 = Math.max(bz1, q.p.z); }
  const br = { id, S, N, width, arch, open, len, a: a.clone(), b: b.clone(), barrierT: open ? 2 : 0.2, group: grp3, bb: [bx0 - width, bx1 + width, bz0 - width, bz1 + width] };
  if (lampEnds) {
    for (const t of [0.04, 0.96]) {
      const s = S[Math.round(t * N)];
      for (const k of [-1, 1]) LAMPS.push([s.p.x + s.sd.x * (hw + 0.18) * k, s.y, s.p.z + s.sd.z * (hw + 0.18) * k]);
    }
  }
  BRIDGES.push(br);
  return br;
}
// Position sur le pont la plus proche d'un point (x,z)
function bridgeQuery(br, x, z) {
  let best = { d: Infinity, t: 0, lat: 0 };
  const S = br.S;
  for (let i = 0; i < S.length - 1; i++) {
    const A = S[i].p, B = S[i + 1].p;
    const dx = B.x - A.x, dz = B.z - A.z;
    const l2 = dx * dx + dz * dz;
    const u = clamp(((x - A.x) * dx + (z - A.z) * dz) / l2, 0, 1);
    const px = A.x + dx * u, pz = A.z + dz * u;
    const d = Math.hypot(x - px, z - pz);
    if (d < best.d) best = { d, t: lerp(S[i].t, S[i + 1].t, u), y: lerp(S[i].y, S[i + 1].y, u) };
  }
  return best;
}

/* ---------- barrière « Bientôt » ---------- */
function signTexture(lines, { w = 512, h = 256, bg = '#FFF8EE', fg = '#27314D', border = '#E9D9C2', accent = null, sizes = null } = {}) {

    g.lineWidth = 10; g.strokeStyle = border; g.beginPath(); g.roundRect(5, 5, w - 10, h - 10, 24); g.stroke();
    if (accent) { g.fillStyle = accent; g.beginPath(); g.roundRect(24, 22, 60, 10, 5); g.fill(); }
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    const n = lines.length;
    lines.forEach((ln, i) => {
      const sz = sizes ? sizes[i] : (i === 0 ? 70 : 38);
      g.font = `${i === 0 ? 700 : 500} ${sz}px ${i === 0 ? "Unbounded, 'Trebuchet MS', sans-serif" : "Figtree, 'Segoe UI', sans-serif"}`;
      g.fillStyle = i === 0 ? fg : '#55607D';
      const y = h / 2 + (i - (n - 1) / 2) * (sizes ? sz * 1.35 : 72);
      g.fillText(ln, w / 2, y);
    });
  });
}
function buildBarrier(br) {
  const s = br.S[Math.round(br.barrierT * br.N)];
  const g = new THREE.Group();
  g.position.set(s.p.x, s.y, s.p.z);
  g.rotation.y = Math.atan2(-s.tan.x, -s.tan.z);
  world.add(g);
  const stripe = canvasTex(256, 64, (c, w, h) => {
    c.fillStyle = '#FFF4E6'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#FF8C7A';
    for (let i = -2; i < 10; i++) { c.beginPath(); c.moveTo(i * 40, h); c.lineTo(i * 40 + 20, h); c.lineTo(i * 40 + 44, 0); c.lineTo(i * 40 + 24, 0); c.fill(); }
  });
  const plankM = new THREE.MeshStandardMaterial({ map: stripe, roughness: 0.8 });
  mesh(G.rbox(br.width * 0.95, 0.2, 0.08, 0.03), plankM, g, 0, 0.72, 0);
  mesh(G.rbox(br.width * 0.95, 0.14, 0.08, 0.03), plankM, g, 0, 0.36, 0);
  for (const k of [-1, 1]) {
    const leg = mesh(G.rbox(0.08, 0.95, 0.08, 0.02), mat(0xfaf1e4), g, k * br.width * 0.4, 0.45, 0.12, { rx: -0.2 });
    mesh(G.rbox(0.08, 0.95, 0.08, 0.02), mat(0xfaf1e4), g, k * br.width * 0.4, 0.45, -0.12, { rx: 0.2 });
    leg.castShadow = true;
  }
  const tex = signTexture([_t('Bientôt'), _t('Chantier en cours')], { w: 512, h: 220, sizes: [64, 34] });
  const sign = mesh(G.rbox(1.25, 0.54, 0.05, 0.05), [mat(0xfaf1e4), mat(0xfaf1e4), mat(0xfaf1e4), mat(0xfaf1e4), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }), mat(0xfaf1e4)], g, 0, 1.2, 0.0);
  sign.material[5] = sign.material[4];
  mesh(G.cyl(0.03, 0.03, 0.4, 6), mat(0xfaf1e4), g, 0, 0.9, 0);
  return g;
}

/* ---------- cascades ---------- */
const waterfallMat = new THREE.ShaderMaterial({
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 } }]),
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: true,
  vertexShader: `
    #include <fog_pars_vertex>
    varying vec2 vUv;
    void main(){ vUv = uv; vec4 mvPosition = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform float uTime; varying vec2 vUv;
    #include <fog_pars_fragment>
    float hash(float n){ return fract(sin(n)*43758.5453); }
    void main(){
      float col = floor(vUv.x * 11.0);
      float sp = 0.8 + hash(col) * 0.7;
      float st = fract(vUv.y * 2.6 + uTime * sp + hash(col + 3.0));
      float s = smoothstep(0.0, 0.3, st) * (1.0 - smoothstep(0.5, 1.0, st));
      vec3 base = mix(vec3(0.55, 0.8, 0.95), vec3(1.0), 0.35 + 0.65 * s);
      float edge = smoothstep(0.0, 0.16, vUv.x) * smoothstep(1.0, 0.84, vUv.x);
      float fade = smoothstep(0.0, 0.55, vUv.y);
      gl_FragColor = vec4(base, (0.5 + 0.45 * s) * edge * fade);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`,
});
const FALL_PARTS = { sheets: [], foam: [] };
function buildWaterfall(isl, angle, width = 1.2, height = 7) {
  // point du bord dans la direction angle
  const s = isl.s || 1;
  const [ex, ez] = edgeToward(isl.outline, Math.cos(angle), Math.sin(angle), -0.12);
  const g = new THREE.Object3D();
  g.position.set(isl.cx + ex * s, -0.35 * s, isl.cz + ez * s);
  g.scale.setScalar(s);
  g.rotation.y = Math.atan2(Math.cos(angle), Math.sin(angle));
  g.updateMatrix();
  const geo = new THREE.PlaneGeometry(width, height, 1, 14);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    const v = (height / 2 - y) / height; // 0 en haut, 1 en bas
    p.setY(i, -v * height);
    p.setZ(i, 0.25 + Math.pow(v, 1.6) * 1.6);
    p.setX(i, p.getX(i) * (1 + v * 0.35));
  }
  geo.computeVertexNormals();
  FALL_PARTS.sheets.push(geo.applyMatrix4(g.matrix));
  const fg = G.sph(1, 10, 7).scale(width * 0.55, 0.16, 0.22).translate(0, -0.05, 0.28);
  fg.deleteAttribute('uv');
  FALL_PARTS.foam.push(fg.applyMatrix4(g.matrix));
  const mist = halo(0xffffff, width * 3.2 * s, 0.22);
  mist.position.set(0, -height * 0.95, 1.9).applyMatrix4(g.matrix);
  world.add(mist);
  return g;
}
function flushWaterfalls() {
  if (!FALL_PARTS.sheets.length) return;
  const sheets = new THREE.Mesh(mergeGeometries(FALL_PARTS.sheets), waterfallMat);
  sheets.renderOrder = 2;
  sheets.name = 'waterfalls';
  world.add(sheets);
  const foam = new THREE.Mesh(mergeGeometries(FALL_PARTS.foam), mat(0xffffff, { r: 0.6 }));
  foam.receiveShadow = true;
  foam.userData.keep = true;
  foam.name = 'foam';
  world.add(foam);
  FALL_PARTS.sheets.length = 0; FALL_PARTS.foam.length = 0;
}

/* ---------- nuages ---------- */
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xe4eef7, emissiveIntensity: 0.5 });
const DRIFT = [];
function buildClouds() {
  const geo = lowGeo(G.ico(1, 1));
  const geoNear = lowGeo(G.ico(1, 2));
  const R = mulberry32(77);
  const items = [];
  for (let c = 0; c < 120; c++) {
    const a = R() * TAU, d = 20 + Math.pow(R(), 0.75) * 190;
    const cx = Math.cos(a) * d, cz = Math.sin(a) * d - 6, cy = -24 - R() * 12;
    const n = 4 + Math.floor(R() * 5), s = 3 + R() * 5.5;
    // secteur : 8 directions × 2 anneaux (chaque secteur est écarté s'il est hors champ)
    const sec = (Math.floor(((a % TAU) / TAU) * 8) % 8) + (d > 100 ? 8 : 0);
    for (let i = 0; i < n; i++) items.push([cx + rr(-1.5, 1.5, R) * s, cy + rr(-0.2, 0.7, R) * s * 0.5, cz + rr(-1, 1, R) * s * 0.8, s * rr(0.55, 1.0, R), sec]);
  }
  const d = new THREE.Object3D();
  for (let sec = 0; sec < 16; sec++) {
    const part = items.filter((it) => it[4] === sec);
    if (!part.length) continue;
    const im = new THREE.InstancedMesh(geo, cloudMat, part.length);
    part.forEach(([x, y, z, s], i) => { d.position.set(x, y, z); d.scale.set(s, s * 0.7, s); d.updateMatrix(); im.setMatrixAt(i, d.matrix); });
    im.name = 'clouds';
    im.computeBoundingSphere();
    world.add(im);
    VEG.clouds.push({ m: im, c: im.boundingSphere.center.clone(), r: im.boundingSphere.radius });
  }
  // petits nuages qui dérivent entre les îles
  const drift = [];
  for (let c = 0; c < 16; c++) {
    const a = R() * TAU, dd = 18 + R() * 60;
    const base = [Math.cos(a) * dd, rr(-8.5, -3.6, R), Math.sin(a) * dd - 8];
    const n = 3 + Math.floor(R() * 3), s = 0.9 + R() * 1.3;
    const parts = [];
    for (let i = 0; i < n; i++) parts.push([rr(-1.3, 1.3, R) * s, rr(-0.1, 0.4, R) * s, rr(-0.6, 0.6, R) * s, s * rr(0.6, 1, R)]);
    drift.push({ base, parts, speed: rr(0.25, 0.6, R), phase: R() * 100 });
  }
  const count = drift.reduce((a, c) => a + c.parts.length, 0);
  const dm = new THREE.InstancedMesh(geoNear, cloudMat, count);
  dm.name = 'drift';
  world.add(dm);
  DRIFT.push({ mesh: dm, drift });
}
const _driftD = new THREE.Object3D();
function updateDrift(t) {
  const d = _driftD;
  for (const { mesh: m, drift } of DRIFT) {
    let i = 0;
    for (const c of drift) {
      const off = ((t * c.speed + c.phase) % 160) - 80;
      for (const [x, y, z, s] of c.parts) {
        d.position.set(c.base[0] + x + off, c.base[1] + y + Math.sin(t * 0.3 + c.phase) * 0.3, c.base[2] + z);
        d.scale.set(s, s * 0.7, s);
        d.updateMatrix();
        m.setMatrixAt(i++, d.matrix);
      }
    }
    m.instanceMatrix.needsUpdate = true;
    // la sphère englobante suit la dérive
    if (clock.frame % 30 === 0) m.boundingSphere = null;
  }
}

/* ---------- îlots décoratifs lointains ---------- */
const ISLETS = [];
function buildIslets() {
  const R = mulberry32(404);
  const spots = [];
  for (let i = 0; i < 18; i++) {
    let a, d, x, z, ok, guard = 0;
    do {
      a = R() * TAU; d = 88 + R() * 85; x = Math.cos(a) * d * 1.12; z = Math.sin(a) * d - 2;
      ok = spots.every(([sx, sz]) => Math.hypot(sx - x, sz - z) > 16) && Object.values(ISLE_POS).every((p) => Math.hypot(p.x - x, p.z - z) > (p.rad || 12) + 14);
    } while (!ok && guard++ < 30);
    spots.push([x, z]);
    const s = rr(1.6, 3.4, R);
    const isl = buildIsland({ id: 'islet' + i, cx: x, cz: z, outline: outlineBlob(s, s * rr(0.8, 1.1, R), 18, R, 0.14), thickness: 0.4, depth: s * 2.8, seed: 900 + i, extraRocks: 0 });
    isl.group.position.y = rr(-6, 8, R);
    const nt = 1 + Math.floor(R() * 3);
    for (let k = 0; k < nt; k++) {
      const tg = new THREE.Group();
      isl.group.add(tg);
      const tx = rr(-s * 0.4, s * 0.4, R), tz = rr(-s * 0.4, s * 0.4, R), ts = rr(0.7, 1.2, R);
      if (R() < 0.35) {
        mesh(G.cyl(0.08, 0.1, 0.7 * ts, 6), mat(C.trunk), tg, tx, 0.35 * ts, tz);
        for (let j = 0; j < 3; j++) mesh(G.cone(0.6 * ts * (1 - j * 0.22), 0.8 * ts, 7), mat(pick(C.pine, R), { flat: true }), tg, tx, 0.6 * ts + j * 0.38 * ts, tz);
      } else {
        mesh(G.cyl(0.08, 0.12, 1.0 * ts, 6), mat(C.trunk), tg, tx, 0.5 * ts, tz);
        mesh(G.ico(0.55 * ts, 2), mat(pick(C.leaf, R)), tg, tx, 1.2 * ts, tz);
        mesh(G.ico(0.4 * ts, 2), mat(pick(C.leaf, R)), tg, tx + 0.3 * ts, 1.05 * ts, tz + 0.1);
      }
    }
    bake(isl.group, { cast: false });
    ISLETS.push({ g: isl.group, y0: isl.group.position.y, ph: R() * TAU, sp: rr(0.25, 0.5, R) });
  }
}
function updateIslets(t) { for (const i of ISLETS) i.g.position.y = i.y0 + Math.sin(t * i.sp + i.ph) * 0.6; }

/* ---------- oiseaux ---------- */
const BIRDS = [];
function buildBirds() {
  // mouettes low-poly : un maillage articulé chacune (ailes qui battent), sans ombre (elles volent haut)
  const R = mulberry32(31);
  for (let f = 0; f < 3; f++) {
    const flock = { c: V3(rr(-40, 40, R), rr(9, 16, R), rr(-40, 10, R)), r: rr(25, 45, R), sp: rr(0.05, 0.09, R) * (R() < 0.5 ? -1 : 1), ph: R() * TAU, birds: [] };
    const n = 3 + Math.floor(R() * 3);
    for (let i = 0; i < n; i++) {
      const B = buildBird('gull');
      B.mesh.castShadow = false;
      const b = B.root;
      b.userData.off = V3(rr(-1.5, 1.5, R), rr(-0.4, 0.4, R), rr(-1.5, 1.5, R));
      b.userData.ph = R() * TAU;
      b.userData.B = B;
      b.scale.setScalar(2.1);
      world.add(b);
      flock.birds.push(b);
    }
    BIRDS.push(flock);
  }
}
function updateBirds(t) {
  for (const f of BIRDS) {
    const a = f.ph + t * f.sp;
    const cx = f.c.x + Math.cos(a) * f.r, cz = f.c.z + Math.sin(a) * f.r;
    const heading = Math.atan2(-Math.sin(a) * Math.sign(f.sp), Math.cos(a) * Math.sign(f.sp));
    for (const b of f.birds) {
      const o = b.userData.off;
      b.position.set(cx + o.x, f.c.y + o.y + Math.sin(t * 1.3 + b.userData.ph) * 0.3, cz + o.z);
      b.rotation.set(0.12, heading, Math.sin(t * 0.7 + b.userData.ph) * 0.12);
      b.visible = b.position.distanceToSquared(camera.position) > 196;
      if (!b.visible) continue;
      // battements par salves, puis vol plané
      const glide = Math.sin(t * 0.9 + b.userData.ph) > 0.55;
      b.userData.B.flap(glide ? 0.1 : Math.sin(t * 9 + b.userData.ph) * 0.85);
    }
  }
}

// ---- 300_nao.js ----
/* =========================================================================
   NAO : l'assistante de Boris, fidèle à la fiche personnage
   Capuche navy, visage argent, lentille ambre à sa gauche (droite de l'écran),
   petit œil ovale noir à pupille ambre, antennes verte (écran gauche) et orange.
   ========================================================================= */
function makeNaoFace() {
  const W = 512;
  const tex = canvasTex(W, W, () => {}, { aniso: 8 });
  const g = tex.userData.ctx;
  const S = W / 0.52;
  const X = (x) => (x / 0.52 + 0.5) * W;
  const Y = (y) => (0.5 - y / 0.52) * W;
  let last = '';
  function draw(expr, open) {
    const key = expr + '|' + open.toFixed(2);
    if (key === last) return;
    last = key;
    g.clearRect(0, 0, W, W);
    g.fillStyle = '#D5D9E1';
    g.fillRect(0, 0, W, W);
    // coutures gravées
    g.lineCap = 'round';
    const seam = (x0, y0, x1, y1) => {
      g.strokeStyle = 'rgba(112,120,140,0.55)'; g.lineWidth = 3.2;
      g.beginPath(); g.moveTo(X(x0), Y(y0)); g.lineTo(X(x1), Y(y1)); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(X(x0) + 2.5, Y(y0) + 2.5); g.lineTo(X(x1) + 2.5, Y(y1) + 2.5); g.stroke();
    };
    seam(-0.012, 0.3, -0.012, 0.075);
    seam(-0.012, -0.012, -0.012, -0.3);
    seam(-0.3, 0.03, 0.03, 0.03);
    // petit œil (gauche de l'écran)
    const ex = X(-0.095), ey = Y(0.028);
    const rx = 0.037 * S, ry = 0.056 * S;
    const ink = '#1B1E29';
    g.fillStyle = ink; g.strokeStyle = ink;
    const pupil = (sx = 1, sy = 1, dx = 0) => {
      g.save();
      g.shadowColor = 'rgba(255,170,60,0.9)'; g.shadowBlur = 14;
      const gr = g.createLinearGradient(0, ey - ry, 0, ey + ry);
      gr.addColorStop(0, '#FFD27A'); gr.addColorStop(0.5, '#FF9E2C'); gr.addColorStop(1, '#F07A1C');
      g.fillStyle = gr;
      g.beginPath(); g.ellipse(ex + dx, ey, rx * 0.22 * sx, ry * 0.62 * sy, 0, 0, TAU); g.fill();
      g.restore();
    };
    const gloss = () => { g.fillStyle = 'rgba(255,255,255,0.22)'; g.beginPath(); g.ellipse(ex - rx * 0.35, ey - ry * 0.45, rx * 0.28, ry * 0.18, -0.5, 0, TAU); g.fill(); };
    if (expr === 'happy') {
      g.lineWidth = 13;
      g.beginPath(); g.arc(ex, ey + ry * 0.35, rx * 1.05, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
    } else if (expr === 'wink') {
      g.lineWidth = 12; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(ex - rx * 0.8, ey - ry * 0.5); g.lineTo(ex + rx * 0.55, ey); g.lineTo(ex - rx * 0.8, ey + ry * 0.5); g.stroke();
    } else {
      let sx = 1, sy = 1;
      if (expr === 'surprised') { sx = 1.12; sy = 1.14; }
      if (expr === 'curious') { sx = 1.06; sy = 1.08; }
      const o = Math.max(0.06, open);
      g.beginPath(); g.ellipse(ex, ey, rx * sx, ry * sy * o, 0, 0, TAU); g.fill();
      if (o > 0.3) { pupil(expr === 'surprised' ? 0.8 : 1, (expr === 'surprised' ? 0.75 : 1) * o, expr === 'curious' ? rx * 0.2 : 0); gloss(); }
      if (expr === 'thinking') {
        g.fillStyle = '#D5D9E1';
        g.fillRect(ex - rx * 1.4, ey - ry * 1.3, rx * 2.8, ry * 1.0);
        g.strokeStyle = 'rgba(112,120,140,0.8)'; g.lineWidth = 4;
        g.beginPath(); g.moveTo(ex - rx * 1.05, ey - ry * 0.3); g.lineTo(ex + rx * 1.05, ey - ry * 0.3); g.stroke();
        g.fillStyle = ink;
      }
    }
    // bouche
    const mx = X(0.0), my = Y(-0.092);
    g.strokeStyle = '#3A3F4C'; g.fillStyle = '#3A3F4C'; g.lineCap = 'round';
    if (expr === 'happy') {
      g.beginPath(); g.moveTo(mx - 0.034 * S, my - 0.006 * S);
      g.quadraticCurveTo(mx, my + 0.05 * S, mx + 0.034 * S, my - 0.006 * S); g.closePath(); g.fill();
      g.fillStyle = '#E88C7A'; g.beginPath(); g.ellipse(mx, my + 0.018 * S, 0.014 * S, 0.008 * S, 0, 0, TAU); g.fill();
    } else if (expr === 'surprised') {
      g.beginPath(); g.ellipse(mx, my, 0.014 * S, 0.018 * S, 0, 0, TAU); g.fill();
    } else if (expr === 'wink') {
      g.lineWidth = 6; g.beginPath(); g.moveTo(mx - 0.03 * S, my - 0.004 * S); g.quadraticCurveTo(mx, my + 0.028 * S, mx + 0.03 * S, my - 0.004 * S); g.stroke();
    } else if (expr === 'thinking') {
      g.lineWidth = 6; g.beginPath(); g.moveTo(mx - 0.024 * S, my + 0.006 * S); g.lineTo(mx + 0.024 * S, my - 0.006 * S); g.stroke();
    } else {
      g.lineWidth = 6; g.beginPath(); g.moveTo(mx - 0.026 * S, my); g.lineTo(mx + 0.026 * S, my); g.stroke();
    }
    tex.needsUpdate = true;
  }
  draw('neutral', 1);
  return { tex, draw };
}

function lensGlowTex() {
  return canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w * 0.46, h * 0.44, 2, w / 2, h / 2, w / 2);
    gr.addColorStop(0, '#FFFBE0'); gr.addColorStop(0.22, '#FFE58A'); gr.addColorStop(0.55, '#FFB23E'); gr.addColorStop(0.85, '#F7861F'); gr.addColorStop(1, '#E0661A');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}

function buildNao() {

  {
    const p = faceGeo.attributes.position, uv = faceGeo.attributes.uv;

  }

  // casque audio
  for (const s of [-1, 1]) {

  const lensDisk = add(lens, new THREE.CircleGeometry(0.063, 32), lensGlowMat, 0, 0, 0.014);

  glass.rotation.x = Math.PI / 2;

  const lidU = { top: { value: 1 }, bot: { value: -1 } };

  lidMat.onBeforeCompile = (sh) => {
    sh.uniforms.uLidTop = lidU.top; sh.uniforms.uLidBot = lidU.bot;

  };

  lid.castShadow = false;
  const lensHalo = halo(0xffb24a, 0.3, 0.35);
  lensHalo.position.z = 0.03;
  lens.add(lensHalo);

  // capuche : sphère ouverte vers l'avant + bourrelet
  const hoodGroup = new THREE.Group();
  hoodGroup.position.set(0, 0.035, -0.045);
  hoodGroup.scale.set(1.08, 1.03, 1.0);
  head.add(hoodGroup);
  const hoodR = 0.335, alpha = 0.9;
  const axis = V3(0, -0.1, 1).normalize();
  const hoodGeo = (() => {
    const sg = new THREE.SphereGeometry(hoodR, 56, 40).toNonIndexed();
    const p = sg.attributes.position;
    const keep = [];
    const cosA = Math.cos(alpha);
    for (let i = 0; i < p.count; i += 3) {
      const cxp = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3;
      const cyp = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
      const czp = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3;
      const l = Math.hypot(cxp, cyp, czp);

    const n0 = sg.attributes.normal;

  // bras

    add(sh, G.sph(0.082, 20, 14), M.hood, s * 0.018, -0.045, 0, [1, 1.12, 1]);

    add(elbow, G.cyl(0.052, 0.056, 0.11, 20), M.silver, 0, -0.062, 0);

  let trailI = 0, trailAcc = 0;

  const nao = {
    root, body, head, arms, lens, face, lidU, antTips, emitterMat, emitterHalo, groundGlow, shadow,
    hover: 0.3,
    expr: 'neutral', exprUntil: 0, blink: 0, nextBlink: 2,
    lookYaw: 0, lookPitch: 0, headTilt: 0,
    lean: 0, bank: 0, speed: 0,
    mode: 'idle', modeUntil: 0, modeT: 0, pointAt: V3(), jumpT: -1,
    setExpr(e, dur = 2.5) { this.expr = e; this.exprUntil = clock.t + dur; },
    play(mode, dur = 2.2, target = null) {
      this.mode = mode; this.modeUntil = clock.t + dur; this.modeT = 0;
      if (target) this.pointAt.copy(target);
      if (mode === 'cheer') { this.jumpT = 0; this.setExpr('happy', dur); }
      if (mode === 'wave') this.setExpr('happy', dur * 0.8);

  const qTmp = new THREE.Quaternion();
  const vTmp = new THREE.Vector3();
  const invQ = new THREE.Quaternion();
  nao.update = (dt, t) => {
    // expression + clignement
    if (nao.expr !== 'neutral' && t > nao.exprUntil) nao.expr = 'neutral';
    nao.nextBlink -= dt;
    if (nao.nextBlink < 0) { nao.blink = 0.16; nao.nextBlink = rr(2.2, 5.5); }
    let open = 1;
    if (nao.blink > 0) { nao.blink -= dt; open = Math.abs(nao.blink - 0.08) / 0.08; }
    face.draw(nao.expr, nao.expr === 'happy' || nao.expr === 'wink' ? 1 : Math.round(open * 6) / 6);
    // paupière de la lentille
    let lt = 0.08, lb = -0.08;
    if (nao.expr === 'thinking') { lt = 0.012; }
    if (open < 0.95 && nao.expr !== 'happy' && nao.expr !== 'wink') { const c = 1 - open; lt = lerp(0.08, 0.0, c); lb = lerp(-0.08, 0.0, c); }
    lidU.top.value = lt; lidU.bot.value = lb;

    // flottement
    let jump = 0;
    if (nao.jumpT >= 0) { nao.jumpT += dt; const p = nao.jumpT / 0.55; if (p >= 1) nao.jumpT = -1; else jump = Math.sin(p * Math.PI) * 0.32; }
    const bob = Math.sin(t * 2.3) * 0.045 + Math.sin(t * 1.1) * 0.015;
    body.position.y = nao.hover + bob + jump;
    body.rotation.x = damp(body.rotation.x, nao.lean, 7, dt);
    body.rotation.z = damp(body.rotation.z, nao.bank + Math.sin(t * 1.3) * 0.02, 6, dt);
    const h = body.position.y;
    shadow.scale.set(0.95 - h * 0.35, 1, 0.95 - h * 0.35);
    shadow.material.opacity = 0.5 - h * 0.25;
    const sp = nao.speed;
    emitterMat.color.setRGB(0.49 * (2.3 + sp * 0.35), 1.0 * (2.3 + sp * 0.35), 0.82 * (2.3 + sp * 0.35));
    emitterHalo.material.opacity = 0.45 + Math.sin(t * 6) * 0.08 + sp * 0.05;
    groundGlow.material.opacity = 0.22 + Math.sin(t * 2.3) * 0.05;
    // antennes : pulsation
    antTips.forEach((a, i) => { const k = 0.75 + 0.25 * Math.sin(t * 3.1 + i * 1.7); a.h.material.opacity = 0.55 * k + (nao.expr === 'thinking' ? 0.35 : 0); });

    // tête : regard
    head.rotation.y = damp(head.rotation.y, nao.lookYaw, 5, dt);
    head.rotation.x = damp(head.rotation.x, nao.lookPitch, 5, dt);
    head.rotation.z = damp(head.rotation.z, nao.headTilt + (nao.expr === 'curious' ? 0.22 : 0) + (nao.expr === 'thinking' ? -0.12 : 0), 5, dt);

    // bras
    if (nao.mode !== 'idle' && t > nao.modeUntil) nao.mode = 'idle';
    nao.modeT += dt;
    for (const a of arms) {
      let tq = a.restQ, eb = -0.1;
      const swing = Math.sin(t * 2.3 + (a.s > 0 ? 0 : Math.PI)) * 0.05;
      qTmp.setFromEuler(new THREE.Euler(0.05 + swing + sp * 0.07, 0, a.s * (0.2 + sp * 0.02)));
      tq = qTmp.clone();
      if (nao.mode === 'wave' && a.s < 0) {
        tq = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.15, 0, a.s * 2.55 + Math.sin(nao.modeT * 11) * 0.22));
        eb = 0;
      } else if ((nao.mode === 'point' || nao.mode === 'highfive') && a.s === nao._pointSide) {
        // direction vers la cible dans le repère du corps
        vTmp.copy(nao.pointAt);
        body.worldToLocal(vTmp);
        vTmp.sub(a.sh.position).normalize();
        tq = new THREE.Quaternion().setFromUnitVectors(V3(0, -1, 0), vTmp);
        eb = 0;
      } else if (nao.mode === 'cheer') {
        tq = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.2, 0, a.s * (2.35 + Math.sin(nao.modeT * 9 + a.s) * 0.15)));
        eb = -0.3;
      } else if (nao.mode === 'think' && a.s < 0) {
        tq = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.2, 0.3, a.s * 0.5));
        eb = -1.5;
      }
      a.sh.quaternion.slerp(tq, 1 - Math.exp(-9 * dt));
      a.elbow.rotation.x = damp(a.elbow.rotation.x, eb, 9, dt);
    }

    // étincelles quand Nao avance vite
    trailAcc += dt * sp;
    if (trailAcc > 0.22 && sp > 0.5) {
      trailAcc = 0;
      const s = trail[trailI++ % trail.length];
      body.localToWorld(s.position.set(rr(-0.05, 0.05), 0.02, rr(-0.05, 0.05)));
      s.userData.life = 0.7;
      s.userData.v.set(rr(-0.2, 0.2), rr(-0.5, -0.2), rr(-0.2, 0.2));
      s.visible = true;
    }
    for (const s of trail) {
      if (!s.visible) continue;
      s.userData.life -= dt;
      if (s.userData.life <= 0) { s.visible = false; continue; }
      s.position.addScaledVector(s.userData.v, dt);
      const k = s.userData.life / 0.7;
      s.scale.setScalar(0.22 * k + 0.02);
      s.material.opacity = 0.8 * k;
    }
  };
  // choisit le bras du côté de la cible
  nao.pointTo = (target, dur = 2.4, mode = 'point') => {
    const local = body.worldToLocal(target.clone());
    nao._pointSide = local.x >= 0 ? 1 : -1;
    nao.play(mode, dur, target);
  };
  return nao;
}

// ---- 306_lowpoly.js ----
/* =========================================================================
   LOW-POLY : briques à facettes pour les personnages (couleurs de sommets,
   ombrage plat) et assemblage en un seul maillage animé par « os » rigides.
   Un personnage entier = un seul appel de dessin (et un pour son ombre).
   ========================================================================= */
const LP_MAT = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.86, metalness: 0 });
LP_MAT.userData.noGrain = true;
const LP_GLOW = new THREE.MeshBasicMaterial({ vertexColors: true, fog: true });

// polyèdre en anneaux : sections à n côtés (face plate devant), superellipse e < 1 = plus carré
// rings : [{ y, rx, rz | rzf/rzb, x0, z0, yf(th), rf(th) }] du bas vers le haut
function lpRings(rings, n = 8, { e = 1, bottom = true, top = true, topPt = null, bottomPt = null } = {}) {
  const P = rings.map((R) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const th = ((i + 0.5) / n) * TAU;
      const s = Math.sin(th), c = Math.cos(th);
      const sx = Math.sign(s) * Math.pow(Math.abs(s), e), cz = Math.sign(c) * Math.pow(Math.abs(c), e);
      const rz = c >= 0 ? (R.rzf ?? R.rz) : (R.rzb ?? R.rz);
      const k = R.rf ? R.rf(th) : 1;
      pts.push(new THREE.Vector3((R.x0 || 0) + R.rx * sx * k, R.yf ? R.yf(th) : R.y, (R.z0 || 0) + rz * cz * k));
    }
    return pts;
  });
  const pos = [];
  const tri = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  for (let k = 0; k < P.length - 1; k++) for (let i = 0; i < n; i++) {
    const a = P[k][i], b = P[k][(i + 1) % n], c = P[k + 1][i], d = P[k + 1][(i + 1) % n];
    tri(a, b, c); tri(b, d, c);
  }
  const mid = (ring) => ring.reduce((s, p) => s.add(p), new THREE.Vector3()).multiplyScalar(1 / ring.length);
  if (bottom) { const B = bottomPt || mid(P[0]); for (let i = 0; i < n; i++) tri(P[0][(i + 1) % n], P[0][i], B); }
  if (top) { const L = P[P.length - 1], T = topPt || mid(L); for (let i = 0; i < n; i++) tri(L[i], L[(i + 1) % n], T); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
// prisme (6 pans par défaut), face plate devant ; axe y, du haut (+h/2) vers le bas
const lpPrism = (rt, rb, h, n = 6) => new THREE.CylinderGeometry(rt, rb, h, n, 1, false, Math.PI / n).toNonIndexed();
const lpBox = (w, h, d) => new THREE.BoxGeometry(w, h, d).toNonIndexed();
const lpBall = (r, ws = 6, hs = 4) => new THREE.SphereGeometry(r, ws, hs).toNonIndexed();
// polygone plat extrudé (points [x, y]) : moustache, poche, semelle…
function lpPoly(pts, depth = 0.01) {
  const sh = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false, curveSegments: 1 });
  return g.index ? g.toNonIndexed() : g;
}
// polygone plat posé sur une surface (z donné par la fonction zAt(x, y)), une seule face vers +z
function lpDecal(pts, zAt, lift = 0.004, levels = 2) {
  const sh = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  let g = new THREE.ShapeGeometry(sh, 1).toNonIndexed();
  // subdivisé pour épouser les pliures des facettes (sinon l'aplat traverse la tête)
  for (let l = 0; l < levels; l++) g = lpSubdivide(g);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, zAt(p.getX(i), p.getY(i)) + lift);
  return g;
}
// découpe chaque triangle en quatre (géométrie non indexée, positions seules)
function lpSubdivide(g) {
  const a = g.attributes.position.array, out = [];
  for (let i = 0; i < a.length; i += 9) {
    const A = [a[i], a[i + 1], a[i + 2]], B = [a[i + 3], a[i + 4], a[i + 5]], Cc = [a[i + 6], a[i + 7], a[i + 8]];
    const m = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2, (u[2] + v[2]) / 2];
    const ab = m(A, B), bc = m(B, Cc), ca = m(Cc, A);
    for (const t of [[A, ab, ca], [ab, B, bc], [ca, bc, Cc], [ab, bc, ca]]) for (const v of t) out.push(...v);
  }
  const h = new THREE.BufferGeometry();
  h.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  return h;
}
const lpNgon = (r, n = 8, rot = 0) => Array.from({ length: n }, (_, i) => [Math.cos(rot + (i / n) * TAU) * r, Math.sin(rot + (i / n) * TAU) * r]);

// assemblage : chaque pièce est rattachée à un os (Object3D du squelette) ; à la fin, un seul
// SkinnedMesh dont chaque sommet suit rigidement son os
function lpRig() {
  const bones = [], boneIdx = new Map(), parts = [];
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
  const col = new THREE.Color();
  const idx = (bone) => { if (!boneIdx.has(bone)) { boneIdx.set(bone, bones.length); bones.push(bone); } return boneIdx.get(bone); };
  return {
    bones,
    // geo dans le repère de l'os, placée par (x, y, z, rx, ry, rz, sx, sy, sz)
    add(bone, geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
      _m.compose(_p.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz));
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      g.applyMatrix4(_m);
      if (_m.determinant() < 0) { const a = g.attributes.position; for (let i = 0; i < a.count; i += 3) { const t = [a.getX(i + 1), a.getY(i + 1), a.getZ(i + 1)]; a.setXYZ(i + 1, a.getX(i + 2), a.getY(i + 2), a.getZ(i + 2)); a.setXYZ(i + 2, t[0], t[1], t[2]); } }
      parts.push({ g, color: col.set(color).clone(), bi: idx(bone), bone });
      return g;
    },
    // géométrie déjà exprimée dans le repère de l'os (non indexée). keepN : normales fournies
    // (facettes adoucies) ; bone2 + mask : sommets rattachés à un second os (raccord de coude, de genou)
    addRaw(bone, g, color, { keepN = false, bone2 = null, mask = null } = {}) {
      parts.push({ g, color: col.set(color).clone(), bi: idx(bone), bone, keepN, bi2: bone2 ? idx(bone2) : -1, mask });
      return g;
    },
    // un seul maillage : positions dans le repère du root (au repos), couleurs, os
    build(root, { cast = true, receive = true, material = LP_MAT, sphere = null } = {}) {
      root.updateMatrixWorld(true);
      const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
      const bw = new Map();
      const geos = parts.map(({ g, color, bi, bone, keepN, bi2, mask }) => {
        if (!bw.has(bone)) bw.set(bone, new THREE.Matrix4().multiplyMatrices(inv, bone.matrixWorld));
        const h = new THREE.BufferGeometry();
        const p = g.attributes.position.clone();
        h.setAttribute('position', p);
        if (keepN) h.setAttribute('normal', g.attributes.normal.clone());
        h.applyMatrix4(bw.get(bone));
        // non indexée : une normale par facette (identique à l'ombrage plat)
        if (!keepN) h.computeVertexNormals();
        const n = p.count;
        const c = new Float32Array(n * 3), si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
        for (let i = 0; i < n; i++) { c[i * 3] = color.r; c[i * 3 + 1] = color.g; c[i * 3 + 2] = color.b; si[i * 4] = mask && mask[i] ? bi2 : bi; sw[i * 4] = 1; }
        h.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
        h.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
        h.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
        return h;
      });
      const merged = mergeGeometries(geos, false);
      const mesh = new THREE.SkinnedMesh(merged, material);
      mesh.castShadow = cast; mesh.receiveShadow = receive;
      root.add(mesh);
      mesh.updateMatrixWorld(true);
      const sk = new THREE.Skeleton(bones.slice());
      mesh.bind(sk, mesh.matrixWorld);
      merged.computeBoundingSphere();
      mesh.boundingSphere = sphere || merged.boundingSphere.clone();
      if (!sphere) mesh.boundingSphere.radius += 0.6;
      mesh.userData.lpTris = merged.attributes.position.count / 3;
      return mesh;
    },
  };
}

// ---- 310_boris.js ----
/* =========================================================================
   BORIS, planche v2 : tête arrondie et afro. Volumes repris de l'atelier de
   Nao (characters.js), adaptés à la scène : les pièces sont fusionnées en un
   seul maillage animé (un appel de dessin, plus un pour l'ombre). On garde
   les unités de la planche (Boris y mesure ~3,1) et on met à l'échelle.
   ========================================================================= */
const BORIS_PAL = {
  cream: 0xfff6ea, lavender: 0xc4abf2, mint: 0xa8e6cf, sky: 0xb0e1ff, skin: 0xa2613b, hair: 0x3a3437,
  white: 0xfff9f0, pupil: 0x201713, lipU: 0x965041, lipL: 0xb35d50,
};
const BORIS_TALL = 1.99; // taille dans la scène, sommet de l'afro compris
// facettes du crâne et de l'afro : une normale par panneau (fournie), le reste en facettes nettes
const BORIS_MAT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 });
BORIS_MAT.userData.noGrain = true;

// ---- petites briques de la planche : de vrais Mesh provisoires, fusionnés ensuite
function borisKit() {
  const K = {};
  const mk = (parent, geo, col, pos, name, smooth = false) => {
    const m = new THREE.Mesh(geo);
    m.userData.col = col; m.userData.smooth = smooth;
    if (pos) m.position.set(pos[0], pos[1], pos[2]);
    m.name = name || '';
    parent.add(m);
    return m;
  };
  K.mesh = mk;
  K.group = (parent, name, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.name = name; g.position.set(pos[0], pos[1], pos[2]); parent.add(g); return g; };
  const octagon = (rx, rz, bevel) => {
    const bx = rx * bevel, bz = rz * bevel;
    return [[-rx + bx, rz], [rx - bx, rz], [rx, rz - bz], [rx, -rz + bz], [rx - bx, -rz], [-rx + bx, -rz], [-rx, -rz + bz], [-rx, rz - bz]];
  };
  // anneaux octogonaux explicites : [y, demi-largeur, demi-profondeur, décalage z]
  K.loft = (rings, bevel = 0.28) => {
    const vs = [], push = (a, b, c) => vs.push(...a, ...b, ...c);
    const rows = rings.map(([y, rx, rz, oz = 0]) => octagon(rx, rz, bevel).map(([x, z]) => [x, y, z + oz]));
    for (let j = 0; j < rows.length - 1; j++) for (let i = 0; i < 8; i++) {
      const n = (i + 1) % 8, a = rows[j][i], b = rows[j][n], c = rows[j + 1][n], d = rows[j + 1][i];
      push(a, b, c); push(a, c, d);
    }
    const t = rows.length - 1;
    for (let i = 0; i < 8; i++) {
      const n = (i + 1) % 8;
      push([0, rings[0][0], rings[0][3] || 0], rows[0][n], rows[0][i]);
      push([0, rings[t][0], rings[t][3] || 0], rows[t][i], rows[t][n]);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vs, 3));
    return geo;
  };
  // bloc chanfreiné ; les très petites pièces (doigts, lacets) deviennent de simples pavés,
  // les petits chanfreins sont omis (invisibles à la taille de la scène)
  K.block = (parent, w, h, d, col, pos, bevel = 0.08, name = '') => {
    const rx = w / 2, rz = d / 2, b = Math.min(bevel, h * 0.25, w * 0.24, d * 0.24);
    let geo;
    if (b < 0.02 && Math.min(w, d) < 0.07) geo = new THREE.BoxGeometry(w, h, d).toNonIndexed();
    else if (b < 0.02) geo = K.loft([[-h / 2, rx, rz], [h / 2, rx, rz]], 0.22);
    else geo = K.loft([[-h / 2, rx - b, rz - b], [-h / 2 + b, rx, rz], [h / 2 - b, rx, rz], [h / 2, rx - b, rz - b]], 0.22);
    return mk(parent, geo, col, pos, name);
  };
  K.poly = (parent, points, depth, col, pos, name = '') => {
    const s = new THREE.Shape();
    points.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y)));
    s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, steps: 1, curveSegments: 1 });
    geo.translate(0, 0, -depth / 2);
    return mk(parent, geo, col, pos, name);
  };
  K.ellipsoid = (parent, radii, col, pos, seg = 10, rings = 6, name = '') => {
    const geo = new THREE.SphereGeometry(1, seg, rings);
    geo.scale(radii[0], radii[1], radii[2]);
    return mk(parent, geo, col, pos, name);
  };
  K.wedge = (parent, verts, faces, col, name = '') => {
    const p = [];
    for (const f of faces) for (let i = 1; i < f.length - 1; i++) p.push(...verts[f[0]], ...verts[f[i]], ...verts[f[i + 1]]);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    return mk(parent, g, col, [0, 0, 0], name);
  };
  K.disc = (parent, rx, ry, col, pos, name = '', seg = 12) => {
    const geo = new THREE.CircleGeometry(1, seg);
    geo.scale(rx, ry, 1);
    return mk(parent, geo, col, pos, name);
  };
  return K;
}

// ---- crâne arrondi (six sections) et afro
function borisSkull(K, head) {
  const P = BORIS_PAL;
  const sections = [[-0.415, 0.235, 0.275, 0.19], [-0.33, 0.42, 0.37, 0.30], [-0.17, 0.55, 0.395, 0.46],
    [0.20, 0.56, 0.40, 0.56], [0.45, 0.465, 0.35, 0.44], [0.55, 0.28, 0.265, 0.20]];
  const angles = [-0.65, 0, 0.65, 1.10, Math.PI / 2, 2.10, 2.64, Math.PI, TAU - 2.64, TAU - 2.10, Math.PI * 1.5, TAU - 1.10];
  const skinRows = sections.map(([y, rx, front, back]) => angles.map((a) => {
    const c = Math.cos(a), z = c >= 0 ? front * Math.min(1, c / Math.cos(0.65)) : back * c;
    return [rx * Math.sin(a), y, z];
  }));
  // surface en anneaux ; chaque quadrilatère reçoit une seule normale (pas de diagonale visible)
  const surface = (rows, { bottom = false, top = null, rim = null } = {}) => {
    const positions = [], n = rows[0].length;
    const tri = (a, b, c) => positions.push(...a, ...b, ...c);
    for (let r = 0; r < rows.length - 1; r++) for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      tri(rows[r][i], rows[r][j], rows[r + 1][j]); tri(rows[r][i], rows[r + 1][j], rows[r + 1][i]);
    }
    const panelVertices = positions.length / 3;
    if (bottom) for (let i = 0; i < n; i++) tri([0, rows[0][0][1], 0], rows[0][(i + 1) % n], rows[0][i]);
    if (top) for (let i = 0; i < n; i++) tri(top, rows[rows.length - 1][i], rows[rows.length - 1][(i + 1) % n]);
    if (rim) for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      tri(rows[0][i], rim[j], rows[0][j]); tri(rows[0][i], rim[i], rim[j]);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.computeVertexNormals();
    const normals = g.attributes.normal, a = new THREE.Vector3(), b = new THREE.Vector3();
    for (let p = 0; p < panelVertices; p += 6) {
      a.fromBufferAttribute(normals, p).add(b.fromBufferAttribute(normals, p + 3)).normalize();
      for (let k = 0; k < 6; k++) normals.setXYZ(p + k, a.x, a.y, a.z);
    }
    return g;
  };
  K.mesh(head, surface(skinRows, { bottom: true, top: [0, 0.55, 0] }), P.skin, null, 'face', true);
  const skinAt = (y) => {
    const next = sections.findIndex((s) => s[0] > y);
    const i = next < 0 ? sections.length - 2 : Math.max(0, next - 1);
    const f = clamp((y - sections[i][0]) / (sections[i + 1][0] - sections[i][0]), 0, 1);
    return skinRows[i].map((v, k) => v.map((c, j) => lerp(c, skinRows[i + 1][k][j], f)));
  };
  const skullEdge = (y, a) => {
    const row = skinAt(y), dx = Math.sin(a), dz = Math.cos(a);
    for (let i = 0; i < row.length; i++) {
      const p = row[i], q = row[(i + 1) % row.length], ex = q[0] - p[0], ez = q[2] - p[2], den = dx * ez - dz * ex;
      if (Math.abs(den) < 1e-8) continue;
      const t = (p[0] * ez - p[2] * ex) / den, u = (p[0] * dz - p[2] * dx) / den;
      if (t > 0 && u >= -1e-8 && u <= 1 + 1e-8) return [t * dx, y, t * dz];
    }
    return [0, y, 0];
  };
  // ligne des cheveux : front, tempes, derrière les oreilles, nuque
  const hairAngles = [-0.78, 0.78, 1.08, 1.36, 1.65, 2.0, 2.48, 2.96, TAU - 2.96, TAU - 2.48, TAU - 2.0, TAU - 1.65, TAU - 1.36, TAU - 1.08];
  const lowerY = [0.36, 0.36, 0.08, -0.04, -0.17, -0.27, -0.34, -0.37, -0.37, -0.34, -0.27, -0.17, -0.04, 0.08];
  const inner = hairAngles.map((a, i) => skullEdge(lowerY[i], a));
  const bottom = inner.map(([x, y, z], i) => [x * (i < 2 ? 1.035 : 1.14), y, i < 2 ? skinAt(y)[1][2] + 0.015 : z * 1.14]);
  // l'afro : un volume rond, un peu plus ample vers l'arrière. Sur les côtés, le bas des cheveux
  // reste près du crâne (l'oreille et le visage restent dégagés) ; derrière, le volume part dès la
  // ligne des cheveux et descend jusqu'à la nuque (plus de pente entre la nuque et le sommet)
  const A = BORIS_AFRO;
  const ell = (i, f) => {
    const a = hairAngles[i], y = lerp(lowerY[i], A.top, f);
    const r = Math.sqrt(Math.max(0, 1 - ((y - A.cy) / A.ry) ** 2));
    const c = Math.cos(a), R = c < 0 ? lerp(A.r, A.rb, -c) : A.r;
    let z = A.zc + R * r * c;
    if (i < 2 && y < 0.55) z = Math.max(z, skinAt(y)[1][2] + 0.017);
    return [R * r * Math.sin(a), y, z];
  };
  const fillOf = (a) => sstep(A.fill[0], A.fill[1], Math.abs((((a + Math.PI) % TAU) + TAU) % TAU - Math.PI));
  const rows = [bottom, ...A.f.map((f) => hairAngles.map((a, i) => {
    const full = ell(i, f);
    if (f >= A.ft) return full;
    const e = ell(i, A.ft), k = Math.max(0.05, f / A.ft), w = fillOf(a);
    return [0, 1, 2].map((j) => lerp(lerp(bottom[i][j], e[j], k), full[j], w));
  }))];
  const rim = inner.map(([x, y, z]) => [x * 0.98, y, z * 0.98]);
  K.mesh(head, surface(rows, { top: [0, A.top, A.zc], rim }), P.hair, null, 'hair-cap', true);
}
// volume de l'afro (unités de la planche) : sommet, centre et rayons de l'ellipsoïde, rangées
// ft : hauteur où le bas des cheveux rejoint le volume sur les côtés ; fill : de l'avant (0) à
// l'arrière (π), zone où le volume descend jusqu'à la ligne des cheveux
const BORIS_AFRO = { top: 0.965, cy: 0.14, ry: 0.825, r: 0.725, rb: 0.75, zc: -0.035, f: [0, 0.15, 0.3, 0.48, 0.66, 0.83, 0.95], ft: 0.3, fill: [1.6, 2.6] };

function borisHead(K, body, R) {
  const P = BORIS_PAL;
  const head = K.group(body, 'head', [0, 1.17, 0]);
  borisSkull(K, head);
  R.eyes = [];
  for (const s of [-1, 1]) {
    K.poly(head, [[-0.095, 0.105], [0.055, 0.15], [0.105, 0.06], [0.10, -0.12], [-0.015, -0.17], [-0.095, -0.11]], 0.16, P.skin, [s * 0.555, -0.075, -0.03], 'ear');
    // œil : blanc, pupille, reflet, dans un groupe qui sert d'os (clignement)
    const e = K.group(head, 'eye', [s * 0.225, 0.082, 0.41]);
    K.poly(e, [[-0.096, -0.081], [0.096, -0.081], [0.096, 0.045], [0.071, 0.09], [-0.07, 0.09], [-0.096, 0.043]], 0.007, P.white, [0, 0.003, -0.005], 'eye-white');
    K.ellipsoid(e, [0.070, 0.086, 0.026], P.pupil, [0.01, -0.002, 0.014], 10, 6, 'eye');
    K.disc(e, 0.013, 0.017, 0xffffff, [-0.010, 0.034, 0.041], 'eye-glint');
    R.eyes.push(e);
    K.poly(head, [[-0.109, -0.023], [0.112, -0.023], [0.087, 0.038], [-0.079, 0.045]], 0.014, P.hair, [s * 0.232, 0.215, 0.401], 'eyebrow');
  }
  K.wedge(head, [[-0.092, -0.105, 0.397], [0.092, -0.105, 0.397], [0, 0.04, 0.398], [0, -0.069, 0.513], [0, -0.143, 0.441]],
    [[0, 3, 2], [2, 3, 1], [0, 4, 3], [3, 4, 1], [0, 1, 4], [0, 2, 1]], P.skin, 'nose');
  K.poly(head, [[-0.135, 0.018], [-0.03, 0.044], [0, 0.037], [0.035, 0.045], [0.14, 0.018], [0.10, -0.012], [-0.10, -0.012]], 0.014, P.lipU, [0, -0.208, 0.398], 'upper-lip').rotation.x = 0.16;
  K.poly(head, [[-0.135, 0.015], [0.135, 0.015], [0.094, -0.035], [0, -0.05], [-0.088, -0.034]], 0.023, P.lipL, [0, -0.225, 0.388], 'lower-lip').rotation.x = 0.16;
  K.poly(head, [[-0.186, -0.012], [-0.182, 0.018], [-0.035, 0.045], [0, 0.031], [0.035, 0.045], [0.182, 0.018], [0.186, -0.012], [0, -0.004]], 0.015, P.hair, [0, -0.17, 0.400], 'moustache');
  K.poly(head, [[-0.15, 0.055], [0.15, 0.055], [0.11, -0.041], [-0.097, -0.047]], 0.014, P.hair, [0, -0.367, 0.336], 'goatee').rotation.x = 0.84;
  return head;
}

// main : paume, quatre doigts, pouce ; tournée pour que la paume regarde la cuisse au repos
function borisHand(K, parent, side) {
  const P = BORIS_PAL;
  const h = K.group(parent, 'hand', [0, -0.32, 0]);
  h.scale.setScalar(1.13);
  const g = K.group(h, 'handGeo');
  g.rotation.y = -side * Math.PI / 2;
  K.block(g, 0.18, 0.155, 0.13, P.skin, [0, -0.075, 0], 0.022, 'palm');
  for (let i = 0; i < 4; i++) K.block(g, 0.038, 0.13 + (i === 1 ? 0.014 : 0), 0.065, P.skin, [-0.061 + i * 0.040, -0.19, 0.026], 0.009, 'finger').rotation.x = -0.17;
  K.block(g, 0.067, 0.137, 0.074, P.skin, [side * 0.109, -0.092, 0.032], 0.016, 'thumb').rotation.z = side * 0.38;
  return h;
}

// basket : semelle épaisse, empeigne, bout bleu, pièces menthe et bleues qui épousent la forme
function borisShoe(K, parent) {
  const P = BORIS_PAL;
  const shoe = K.group(parent, 'shoe', [0, 0, 0.075]);
  K.mesh(shoe, K.loft([[-0.265, 0.205, 0.31, 0.04], [-0.16, 0.205, 0.31, 0.04], [-0.105, 0.20, 0.305, 0.04]], 0.22), P.cream, null, 'sole');
  K.mesh(shoe, K.loft([[-0.153, 0.195, 0.30, 0.04], [-0.085, 0.184, 0.27, 0.025], [0.033, 0.125, 0.19, -0.035]], 0.24), P.cream, null, 'upper');
  const conform = (panel, side = 0) => {
    panel.updateMatrix(); panel.geometry.applyMatrix4(panel.matrix);
    const positions = panel.geometry.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i), y = positions.getY(i), z = positions.getZ(i);
      const low = y < -0.085, a = low ? [-0.153, 0.195, 0.30, 0.04] : [-0.085, 0.184, 0.27, 0.025], b = low ? [-0.085, 0.184, 0.27, 0.025] : [0.033, 0.125, 0.19, -0.035];
      const f = clamp((y - a[0]) / (b[0] - a[0]), 0, 1);
      const rx = lerp(a[1], b[1], f), rz = lerp(a[2], b[2], f), oz = lerp(a[3], b[3], f);
      if (side) { const edge = Math.max(0, Math.abs(z - oz) - rz * 0.76); positions.setX(i, side * (rx - edge * rx / rz + 0.004) + (x - panel.position.x)); }
      else { const edge = Math.max(0, Math.abs(x) - rx * 0.76); positions.setZ(i, rz + oz - edge * rz / rx + 0.004 + (z - panel.position.z)); }
    }
    panel.position.set(0, 0, 0); panel.rotation.set(0, 0, 0);
  };
  conform(K.poly(shoe, [[-0.136, -0.035], [0.137, -0.035], [0.158, -0.092], [-0.157, -0.092]], 0.006, P.sky, [0, -0.057, 0.348], 'toe-blue'));
  for (const s of [-1, 1]) {
    const p = K.poly(shoe, [[-0.16, -0.026], [0.04, -0.063], [0.15, 0.016], [0.12, 0.093], [-0.045, 0.047]], 0.008, P.mint, [s * 0.198, -0.11, -0.018], 'mint-panel');
    p.rotation.y = s * Math.PI / 2;
    const p2 = K.poly(shoe, [[-0.11, -0.042], [0.085, -0.042], [0.055, 0.049], [-0.069, 0.049]], 0.008, P.sky, [s * 0.198, -0.101, 0.17], 'blue-panel');
    p2.rotation.y = s * Math.PI / 2;
    conform(p, s); conform(p2, s);
  }
  for (let i = 0; i < 3; i++) K.block(shoe, 0.17, 0.024, 0.036, P.cream, [0, 0.01 - i * 0.028, 0.04 + i * 0.05], 0.003, 'lace').rotation.x = -0.35;
  return shoe;
}

// la planche complète, au repos (unités d'origine, pieds à y = 0)
function borisSheet(K, T) {
  const P = BORIS_PAL, R = {};
  const hip = 1.035, tw = 0.39, torsoH = 0.68;
  R.hip = hip;
  const body = K.group(T, 'body', [0, hip, 0]);
  R.body = body;
  K.mesh(body, K.loft([[-0.07, tw * 0.96, 0.25], [0.08, tw, 0.255], [torsoH - 0.1, tw * 0.93, 0.25], [torsoH, tw * 0.72, 0.20]], 0.21), P.cream, null, 'torso');
  K.block(body, tw * 1.95, 0.095, 0.485, P.cream, [0, -0.06, 0], 0.013, 'hem');
  // col de capuche (deux pans épais devant), capuche dans le dos, poche ventrale, cordons
  for (const s of [-1, 1]) K.poly(body, [[s * 0.012, 0.658], [s * 0.325, 0.732], [s * 0.274, 0.856], [s * 0.015, 0.735]], 0.145, P.cream, [0, 0, 0.203], 'hood-collar');
  K.mesh(body, K.loft([[0.365, 0.15, 0.084, -0.23], [0.47, 0.32, 0.14, -0.26], [0.70, 0.32, 0.13, -0.23], [0.78, 0.235, 0.10, -0.17]], 0.36), P.cream, null, 'hood');
  K.poly(body, [[-0.29, -0.10], [0.29, -0.10], [0.242, 0.105], [-0.239, 0.105]], 0.055, P.cream, [0, 0.137, 0.265], 'kangaroo-pocket');
  for (const s of [-1, 1]) K.block(body, 0.035, 0.27, 0.036, P.cream, [s * 0.095, 0.465, 0.282], 0.006, 'drawstring');
  K.mesh(body, new THREE.CylinderGeometry(0.135, 0.15, 0.24, 6), P.skin, [0, 0.79, 0], 'neck');
  R.head = borisHead(K, body, R);
  for (const side of [-1, 1]) {
    const S = side < 0 ? 'L' : 'R';
    const shoulder = K.group(body, 'shoulder' + S, [side * (tw + 0.055), 0.57, 0]);
    R['arm' + S] = shoulder;
    const upperLen = 0.33, foreLen = 0.32;
    K.mesh(shoulder, K.loft([[-upperLen, 0.135, 0.135], [0.022, 0.154, 0.16]], 0.12), P.cream, null, 'upper-sleeve');
    // épaule : un bouchon qui garde le raccord avec le buste quand le bras se lève
    K.mesh(shoulder, K.loft([[-0.1, 0.15, 0.155], [0.02, 0.16, 0.165], [0.12, 0.11, 0.12]], 0.3), P.cream, null, 'shoulder-cap');
    const elbow = K.group(shoulder, 'elbow' + S, [0, -upperLen, 0]);
    R['elbow' + S] = elbow;
    K.mesh(elbow, K.loft([[-0.075, 0.13 * 1.006, 0.125 * 1.006], [0.075, 0.13 * 1.006, 0.125 * 1.006]], 0.16), P.cream, null, 'elbow-joint');
    K.mesh(elbow, K.loft([[-foreLen, 0.098, 0.104], [0.021, 0.13, 0.125]], 0.20), P.cream, null, 'forearm');
    K.block(elbow, 0.219, 0.07, 0.231, P.cream, [0, -foreLen + 0.026, 0], 0.014, 'sleeve-cuff');
    const hand = borisHand(K, elbow, side);
    hand.position.y = -foreLen;
    R['hand' + S] = hand;
    shoulder.rotation.z = side * 0.29;
    const leg = K.group(T, 'hip' + S, [side * 0.193, hip, 0]);
    R['leg' + S] = leg;

function buildBoris(opts = {}) {
  const seated = !!opts.seated;
  const K = borisKit();
  // 1. la planche, à l'échelle de la scène
  const T = new THREE.Group();
  const R = borisSheet(K, T);
  T.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(T);
  const SC = BORIS_TALL / box.max.y;
  T.scale.setScalar(SC);
  T.updateMatrixWorld(true);
  // 2. le squelette de la scène : mêmes poses que les groupes de la planche, sans échelle
  const root = new THREE.Group();
  root.name = 'Boris';
  const body = new THREE.Group();
  root.add(body);
  const wp = V3(), wq = new THREE.Quaternion(), ws = V3(), one = V3(1, 1, 1), M = new THREE.Matrix4(), Mi = new THREE.Matrix4();
  const place = (parent, src, at = null) => {
    const bone = new THREE.Group();
    parent.add(bone);
    root.updateMatrixWorld(true);
    src.updateWorldMatrix(true, false);
    src.matrixWorld.decompose(wp, wq, ws);
    if (at) wp.copy(at);
    M.compose(wp, wq, one).premultiply(Mi.copy(parent.matrixWorld).invert());
    M.decompose(bone.position, bone.quaternion, bone.scale);
    bone.updateMatrixWorld(true);
    return bone;
  };
  const map = new Map();
  const torso = place(body, R.body);
  map.set(R.body, torso);
  // la tête pivote en haut du cou
  const head = place(body, R.head, V3(0, (R.hip + 0.86) * SC, 0));
  map.set(R.head, head);
  const eyes = R.eyes.map((e) => { const b = place(head, e); map.set(e, b); return { e: b }; });
  const arms = [], legs = [];
  for (const s of [-1, 1]) {
    const S = s < 0 ? 'L' : 'R';
    const sh = place(body, R['arm' + S]); map.set(R['arm' + S], sh);
    const elbow = place(sh, R['elbow' + S]); map.set(R['elbow' + S], elbow);
    const hand = place(elbow, R['hand' + S]); map.set(R['hand' + S], hand);
    arms.push({ s, sh, elbow, hand, restQ: sh.quaternion.clone() });
    const thigh = place(body, R['leg' + S]); map.set(R['leg' + S], thigh);
    const knee = place(thigh, R['knee' + S]); map.set(R['knee' + S], knee);
    const ankle = place(knee, R['ankle' + S]); map.set(R['ankle' + S], ankle);
    legs.push({ s, thigh, knee, ankle, rest: [thigh.quaternion.clone(), ankle.quaternion.clone()] });
  }
  // 3. fusion : chaque pièce passe dans le repère de son os ; les raccords de coude et de genou
  //    sont partagés entre deux os (moitié haute sur le segment parent)
  const rig = lpRig();
  const rel = new THREE.Matrix4();
  const boneOf = (o) => { for (let p = o.parent; p; p = p.parent) if (map.has(p)) return map.get(p); return torso; };
  T.traverse((o) => {
    if (!o.isMesh) return;
    const bone = boneOf(o);
    rel.copy(bone.matrixWorld).invert().multiply(o.matrixWorld);
    const src = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', src.attributes.position.clone());
    if (o.userData.smooth) g.setAttribute('normal', src.attributes.normal.clone());
    let mask = null, bone2 = null;
    if (o.name === 'elbow-joint' || o.name === 'knee-joint') {
      const p = src.attributes.position;
      mask = new Uint8Array(p.count);
      for (let i = 0; i < p.count; i++) mask[i] = p.getY(i) > 0 ? 1 : 0;
      bone2 = bone.parent;
    }
    g.applyMatrix4(rel);
    rig.addRaw(bone, g, o.userData.col, { keepN: o.userData.smooth, bone2, mask });
  });
  const mesh = rig.build(root, { material: BORIS_MAT, sphere: new THREE.Sphere(V3(0, 1.0, 0.1), 1.35) });
  mesh.name = 'borisMesh';
  const shadow = blob(1.15, 0.5);
  root.add(shadow);
  const EYE_Y = eyes[0].e.getWorldPosition(V3()).y;

  // assis (tabouret du Studio) : cuisses à l'horizontale, genoux pliés, le tout abaissé
  // pour que les cuisses reposent sur l'assise
  const SEAT = seated ? R.hip * SC - 0.595 : 0;
  if (seated) for (const l of legs) {
    l.thigh.rotation.set(-1.5, l.s * 0.08, 0);
    l.knee.rotation.set(1.52, 0, 0);
    l.ankle.rotation.set(0, 0, 0);
  }

  const boris = {
    root, body, head, torso, arms, legs, eyes, mesh, scale: SC,
    mode: 'idle', modeUntil: 0, modeT: 0, target: V3(), lookAt: null, nextBlink: 1.5, blink: 0,
    play(mode, dur = 2.5, target = null) { this.mode = mode; this.modeUntil = clock.t + dur; this.modeT = 0; if (target) this.target.copy(target); },
  };

    torso.scale.set(1 + Math.sin(t * 1.6) * 0.006, 1 + Math.sin(t * 1.6) * 0.01, 1 + Math.sin(t * 1.6) * 0.008);
    body.rotation.z = Math.sin(t * 0.7) * 0.012;

      pitch = clamp(-Math.atan2(v.y, Math.hypot(v.x, v.z)), -0.3, 0.35);

    head.rotation.x = damp(head.rotation.x, pitch, 4, dt);
    head.rotation.z = damp(head.rotation.z, boris.mode === 'talk' ? Math.sin(t * 1.3) * 0.05 : 0, 3, dt);

    boris.nextBlink -= dt;
    if (boris.nextBlink < 0) { boris.blink = 0.14; boris.nextBlink = rr(2.5, 6); }
    let closed = 0;
    if (boris.blink > 0) { boris.blink -= dt; closed = 1 - Math.abs(boris.blink - 0.07) / 0.07; }
    for (const e of eyes) e.e.scale.y = 1 - closed * 0.9;
    // bras et mains
    if (boris.mode !== 'idle' && t > boris.modeUntil) boris.mode = 'idle';
    boris.modeT += dt;
    for (const a of arms) {
      let q = a.restQ, eb = -0.14, hy = 0, hz = 0;
      if (boris.mode === 'wave' && a.s < 0) {

        eb = -0.3 + Math.sin(boris.modeT * 10) * 0.14;
        hy = a.s * 1.5;
      } else if (boris.mode === 'highfive' && a.s < 0) {
        v.copy(boris.target);
        body.worldToLocal(v);
        v.sub(a.sh.position).normalize();
        q = tq.setFromUnitVectors(V3(0, -1, 0), v);
        eb = 0; hy = a.s * 1.5;
      } else if (boris.mode === 'talk') {
        const k = Math.sin(boris.modeT * 2.4 + a.s) * 0.18;
        q = tq.setFromEuler(te.set(-0.9 + k, a.s * 0.25, a.s * 0.45));
        eb = -1.1 + k; hy = a.s * -0.8; hz = -0.4;
      } else if (boris.mode === 'present' && a.s > 0) {
        q = tq.setFromEuler(te.set(-0.55, -0.3, a.s * 0.95));
        eb = -0.5; hy = -1.2; hz = -0.5;
      }
      a.sh.quaternion.slerp(q, 1 - Math.exp(-8 * dt));
      a.elbow.rotation.x = damp(a.elbow.rotation.x, eb, 8, dt);
      a.hand.rotation.y = damp(a.hand.rotation.y, hy, 8, dt);
      a.hand.rotation.x = damp(a.hand.rotation.x, hz, 8, dt);
    }
  };
  boris.handWorld = (out) => arms[0].hand.getWorldPosition(out);
  // high five : point atteint par le bout des doigts (bras gauche tendu vers la main de Nao,
  // un peu relevé)
  const REACH = (0.33 + 0.32 + 0.3) * SC, _hs = V3();
  boris.highFivePoint = (out, toward) => {
    arms[0].sh.getWorldPosition(_hs);
    out.copy(toward).sub(_hs).normalize();
    out.y += 0.35;
    return out.normalize().multiplyScalar(REACH * 0.97).add(_hs);
  };

  boris.bubbleUp = BORIS_TALL - 0.21 - head.getWorldPosition(V3()).y;
  return boris;
}

    P.ph += (d / s / 0.58) * Math.PI;
    const run = sstep(1.15, 1.6, k), walk = Math.min(1, k);
    const sn = Math.sin(P.ph), cs = Math.cos(P.ph);
    const A = walk * (0.5 + run * 0.35);
    // jambes : balancier opposé, genou qui plie au passage du pied (le pied ne glisse pas)
    const legs = [[P.lL, sn, cs], [P.lR, -sn, -cs]];
    for (const [L, a, c] of legs) {
      L.th.rotation.x = damp(L.th.rotation.x, -a * A, 18, dt);
      L.kn.rotation.x = damp(L.kn.rotation.x, walk * (Math.pow(Math.max(0, c), 1.4) * (0.75 + run * 0.8) + 0.08), 18, dt);
    }
    // bras opposés aux jambes, coude plié en courant
    P.aL.sw.rotation.x = damp(P.aL.sw.rotation.x, sn * A * 0.85, 14, dt);
    P.aR.sw.rotation.x = damp(P.aR.sw.rotation.x, -sn * A * 0.85, 14, dt);
    const eb = -0.12 - walk * 0.18 - run * 0.9;
    P.aL.el.rotation.x = damp(P.aL.el.rotation.x, eb, 10, dt);
    P.aR.el.rotation.x = damp(P.aR.el.rotation.x, eb, 10, dt);
    // bassin : plus bas quand les pieds sont écartés, léger roulis ; buste penché en courant
    P.hips.position.y = P_HIP - walk * 0.018 * (1 - Math.abs(cs)) + run * 0.02 * Math.abs(cs);
    P.hips.rotation.y = damp(P.hips.rotation.y, sn * 0.08 * walk, 12, dt);
    P.torso.rotation.y = -P.hips.rotation.y * 1.4;
    if (!P.bodyExt) P.torso.rotation.x = damp(P.torso.rotation.x, 0.05 * walk + run * 0.14, 8, dt);
    // à l'arrêt : petite respiration, regard qui bouge un peu
    if (walk < 0.05) P.head.rotation.y = Math.sin(t * 0.5 + P.idle) * 0.25;
    else P.head.rotation.y = damp(P.head.rotation.y, 0, 6, dt);
  }
}

/* ---------- oiseaux low-poly (fiche 03) : un maillage, deux ailes articulées ---------- */
const BIRD_KINDS = {
  gull: { body: 0xfaf8f2, wing: 0x9ea3ad, tail: 0x9ea3ad, belly: 0xffffff },
  blue: { body: 0x7fb2e8, wing: 0x6a9fe0, tail: 0x6a9fe0, belly: 0xfbf1dc },
  brown: { body: 0xc98b6b, wing: 0xa8704f, tail: 0xa8704f, belly: 0xf3e3cc },
  slate: { body: 0x6f82a8, wing: 0x5a6c94, tail: 0x5a6c94, belly: 0xe8edf6 },
};
function buildBird(kind = 'gull') {
  const K = BIRD_KINDS[kind] || BIRD_KINDS.gull;
  const rig = lpRig();
  const root = new THREE.Group();
  const bodyB = new THREE.Group(); root.add(bodyB);
  rig.add(bodyB, lpRings([
    { y: -0.07, rx: 0.045, rz: 0.06 },
    { y: 0.0, rx: 0.085, rzf: 0.1, rzb: 0.09 },
    { y: 0.08, rx: 0.08, rzf: 0.09, rzb: 0.085 },
    { y: 0.13, rx: 0.05, rz: 0.06 },
  ], 7, { e: 0.9 }), K.body, 0, 0.12, 0, -1.2, 0, 0);
  rig.add(bodyB, lpBall(0.075, 6, 4), K.body, 0, 0.22, 0.085);
  if (kind !== 'gull') rig.add(bodyB, lpBall(0.07, 6, 4), K.belly, 0, 0.1, 0.04, 0, 0, 0, 0.95, 1.1, 1.05);
  rig.add(bodyB, new THREE.ConeGeometry(0.028, 0.08, 4).rotateX(Math.PI / 2).toNonIndexed(), 0xf2b83a, 0, 0.215, 0.18);
  for (const s of [-1, 1]) rig.add(bodyB, lpBox(0.018, 0.018, 0.01), 0x16161c, s * 0.052, 0.24, 0.13);
  rig.add(bodyB, lpPoly([[-0.045, 0], [0.045, 0], [0.07, -0.13], [0.02, -0.11], [0, -0.14], [-0.02, -0.11], [-0.07, -0.13]], 0.012), K.tail, 0, 0.13, -0.1, -1.35, 0, 0);
  for (const s of [-1, 1]) {
    rig.add(bodyB, lpBox(0.012, 0.07, 0.012), 0xf2b83a, s * 0.03, 0.035, 0.0);
    rig.add(bodyB, lpBox(0.035, 0.008, 0.04), 0xf2b83a, s * 0.03, 0.002, 0.015);
  }
  // ailes : aplats à plumes en escalier, articulées à l'épaule
  const wings = [];
  for (const s of [-1, 1]) {
    const w = new THREE.Group(); w.position.set(s * 0.06, 0.16, 0.02); bodyB.add(w);
    const pts = [[0, 0.05], [0.12, 0.06], [0.25, 0.03], [0.3, -0.01], [0.26, -0.02], [0.28, -0.05], [0.22, -0.05], [0.23, -0.08], [0.16, -0.07], [0.15, -0.1], [0.06, -0.07], [0, -0.06]];
    rig.add(w, lpPoly(pts.map(([x, y]) => [x * s, y]), 0.014), K.wing, 0, 0, 0, Math.PI / 2, 0, 0);
    w.rotation.order = 'ZYX';
    wings.push({ s, w });
  }
  root.updateMatrixWorld(true);
  const mesh = rig.build(root, { sphere: new THREE.Sphere(V3(0, 0.15, 0), 0.45) });
  // repli : ailes le long du corps ; vol : battement
  const B = { root, body: bodyB, wings, mesh,
    fold() { for (const { s, w } of wings) { w.rotation.set(-0.25, s * 1.45, s * 1.5); } },
    flap(a) { for (const { s, w } of wings) { w.rotation.set(0, s * 0.15, s * a); } },
  };
  B.fold();
  return B;
}

/* ---------- géométries colorées fusionnées ---------- */
const VC_MAT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82 });
const VC_GLOSS = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.42, metalness: 0.1 });
function colored(geo, hex) {
  const g = ensureIndexed(geo.clone());
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  const c = new THREE.Color(hex);
  const n = g.attributes.position.count;
  const a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
const _eu = new THREE.Euler(), _qq = new THREE.Quaternion(), _pp = new THREE.Vector3(), _ss = new THREE.Vector3();
// parts : [geo, couleur, x, y, z, rx, ry, rz, sx, sy, sz]
function assembleGeo(parts) {
  const geos = parts.map(([geo, hex, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1]) => {
    const g = colored(geo, hex);
    g.applyMatrix4(new THREE.Matrix4().compose(_pp.set(x, y, z), _qq.setFromEuler(_eu.set(rx, ry, rz)), _ss.set(sx, sy, sz)));
    return g;
  });
  return mergeGeometries(geos);
}
function assemble(parts, material = VC_MAT, parent = null) {
  const m = new THREE.Mesh(assembleGeo(parts), material);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

  const P = ISLE_POS[id];

  const outline = outlineBlob(P.rx, P.rz, 56, r, 0.06, 3);
  const isl = buildIsland({ id, cx: P.x, cz: P.z, outline, depth: 10 + r() * 3, seed: seed + 1, extraRocks: 1 });
  isl.name = P.name;
  isl.s = P.s || 1;

// trajectoire par images clés : keys = [[t, x, z], ...] (t croissant)
function keyLerp(keys, a, out) {
  if (a <= keys[0][0]) return out.set(keys[0][1], 0, keys[0][2]);
  for (let i = 1; i < keys.length; i++) {
    if (a <= keys[i][0]) {
      const [t0, x0, z0] = keys[i - 1], [t1, x1, z1] = keys[i];
      const e = E.inOutSine(clamp((a - t0) / (t1 - t0 || 1), 0, 1));
      return out.set(lerp(x0, x1, e), 0, lerp(z0, z1, e));
    }
  }
  const k = keys[keys.length - 1];
  return out.set(k[1], 0, k[2]);
}
