function islandEdgeWorld(id, towardX, towardZ, inset = 0.35) {
  const isl = ISLANDS[id], s = isl.s || 1;
  const [x, z] = edgeToward(isl.outline, towardX - isl.cx, towardZ - isl.cz, inset / s);
  return V3(isl.cx + x * s, 0, isl.cz + z * s);
}
function buildBridges() {
  const link = (a, b, bend = 0) => {
    const A = ISLANDS[a], B = ISLANDS[b];
    const pa = islandEdgeWorld(a, B.cx, B.cz), pb = islandEdgeWorld(b, A.cx, A.cz);
    const len = pa.distanceTo(pb);
    return buildBridge(pa, pb, { id: a + '-' + b, arch: Math.min(1.1, 0.35 + len * 0.03), bend, open: true, width: 2.0 });
  };
  HUB.portBridge = link('hub', 'port', 0.8);
  link('hub', 'observatoire', -1.2);
  link('hub', 'citadelle', 1.2);
  link('hub', 'stade', -1.2);
  link('hub', 'residence', 1.0);
  link('observatoire', 'atelier', 0.8);
  link('citadelle', 'tour', -0.9);
  link('citadelle', 'campus', 0.8);
  link('stade', 'poste', 0.9);
  link('poste', 'biblio', -0.6);
  link('biblio', 'residence', 1.0);
  link('residence', 'studio', 1.0);
  // cascades
  buildWaterfall(ISLANDS.hub, 1.25, 1.3, 9);
  buildWaterfall(ISLANDS.port, 1.72, 1.6, 10);
  buildWaterfall(ISLANDS.port, -2.7, 1.0, 8);
  buildWaterfall(ISLANDS.observatoire, 2.3, 1.1, 8);
  buildWaterfall(ISLANDS.atelier, 1.2, 1.1, 8);
  buildWaterfall(ISLANDS.citadelle, 0.6, 1.2, 8);
  buildWaterfall(ISLANDS.tour, 1.9, 1.0, 7);
  buildWaterfall(ISLANDS.stade, 1.7, 1.3, 9);
  buildWaterfall(ISLANDS.poste, 1.3, 1.0, 7);
  buildWaterfall(ISLANDS.biblio, 2.1, 1.0, 7);
  buildWaterfall(ISLANDS.studio, 2.6, 1.1, 8);
  buildWaterfall(ISLANDS.campus, 0.9, 1.0, 7);
  buildWaterfall(ISLANDS.residence, 2.4, 1.1, 8);
  flushWaterfalls();
  flushBridges();
}

function crateTex(kind, mask = 7) {
  return canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#FFFEFB'; g.fillRect(0, 0, w, h);
    const green = '#3FA36B';
    if (kind === 'raw') {
      g.fillStyle = '#D9F1E3'; g.fillRect(0, 0, w, 22);
      g.strokeStyle = green; g.lineWidth = 3;
      const cols = [0, 30, 44, 81, 99, 128], rows = [0, 22, 41, 58, 80, 97, 128];
      cols.forEach((x) => { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); });
      rows.forEach((y) => { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); });
      g.fillStyle = 'rgba(63,163,107,.35)'; g.fillRect(48, 62, 28, 12); g.fillRect(8, 101, 18, 10);
    } else {
      const bands = [['#8FDDBE', 1], ['#FFD26A', 2], ['#BBA6EE', 4]];
      bands.forEach(([c, bit], i) => { if (mask & bit) { g.fillStyle = c; g.fillRect(6, 10 + i * 38, w - 12, 30); } });
      g.strokeStyle = green; g.lineWidth = 3;
      for (let i = 0; i <= 4; i++) { const x = (i / 4) * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
      for (let j = 0; j <= 4; j++) { const y = 2 + (j / 4) * (h - 4); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    }
    g.lineWidth = 8; g.strokeStyle = green; g.strokeRect(0, 0, w, h);

const waterNormalTex = (() => {
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  const hgt = (x, y) => Math.sin((x / S) * TAU * 3) * 0.5 + Math.sin((y / S) * TAU * 2 + (x / S) * TAU) * 0.6 + Math.sin(((x + y) / S) * TAU * 5) * 0.25 + Math.cos(((x - 2 * y) / S) * TAU * 2) * 0.35;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = hgt(x + 1, y) - hgt(x - 1, y), dy = hgt(x, y + 1) - hgt(x, y - 1);
    const n = V3(-dx * 1.2, -dy * 1.2, 1).normalize();
    const i = (y * S + x) * 4;
    img.data[i] = (n.x * 0.5 + 0.5) * 255; img.data[i + 1] = (n.y * 0.5 + 0.5) * 255; img.data[i + 2] = (n.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1.6, 1.6);
  return t;
})();

/* ---------- convoyeur ---------- */
const BELTS = [];
function buildConveyor(parent, ax, az, bx, bz, { width = 0.95, top = 0.58, tex = null, frame = C.steel, speed = 1.3, legs = true } = {}) {
  const g = new THREE.Group();
  const len = Math.hypot(bx - ax, bz - az);
  g.position.set((ax + bx) / 2, 0, (az + bz) / 2);
  g.rotation.y = Math.atan2(bx - ax, bz - az);
  parent.add(g);
  const fm = mat(frame, { r: 0.5, m: 0.2 });
  for (const s of [-1, 1]) mesh(G.rbox(0.09, 0.16, len + 0.1, 0.03), fm, g, s * (width / 2 + 0.03), top - 0.05, 0);
  mesh(G.box(width, 0.1, len), mat(0x3f4557, { r: 0.7 }), g, 0, top - 0.08, 0);
  for (const zz of [-len / 2, len / 2]) { const rl = mesh(G.cyl(0.09, 0.09, width, 14), fm, g, 0, top - 0.07, zz); rl.rotation.z = Math.PI / 2; }
  if (legs) {
    const n = Math.max(2, Math.round(len / 1.4) + 1);
    for (let i = 0; i < n; i++) {
      const zz = -len / 2 + 0.2 + (i / (n - 1)) * (len - 0.4);
      for (const s of [-1, 1]) mesh(G.box(0.07, top - 0.1, 0.07), fm, g, s * (width / 2 - 0.05), (top - 0.1) / 2, zz);
    }
  }
  const t = (tex || beltTex()).clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, len / 1.2);
  const belt = mesh(new THREE.PlaneGeometry(width, len).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: t, roughness: 0.7 }), g, 0, top, 0, { cast: false });
  belt.userData.keep = true;
  BELTS.push({ tex: t, speed: speed / 1.2 });
  bake(g, { shallow: true });
  return g;
}

  mesh(G.sph(0.035, 10, 8), glowMat(eyeColor, 1.6), head, 0, 0.31, 0, { cast: false });
  // bras : épaule → coude → pince
  const L1 = 0.62, L2 = 0.58;
  const shoulder = new THREE.Group();
  shoulder.position.set(0, 0.45, 0.2);
  turret.add(shoulder);
  mesh(G.sph(0.1, 14, 10), steel, shoulder, 0, 0, 0);
  mesh(G.rbox(0.13, 0.13, L1, 0.05), body, shoulder, 0, 0, L1 / 2);
  const elbow = new THREE.Group();
  elbow.position.set(0, 0, L1);
  shoulder.add(elbow);
  mesh(G.sph(0.085, 14, 10), steel, elbow, 0, 0, 0);
  mesh(G.rbox(0.11, 0.11, L2, 0.045), cream, elbow, 0, 0, L2 / 2);
  const wrist = new THREE.Group();
  wrist.position.set(0, 0, L2);
  elbow.add(wrist);
  mesh(G.cyl(0.07, 0.07, 0.08, 14), steel, wrist, 0, 0, 0.02).rotation.x = Math.PI / 2;
  const fingers = [];
  for (const s of [-1, 1]) {
    const f = new THREE.Group();
    f.position.set(s * 0.06, 0, 0.06);
    wrist.add(f);
    mesh(G.rbox(0.035, 0.07, 0.16, 0.015), steel, f, 0, 0, 0.08);
    fingers.push(f);
  }
  const tip = new THREE.Object3D();
  tip.position.set(0, 0, 0.17);
  wrist.add(tip);
  bake(g, { shallow: true }); bake(turret, { shallow: true }); bake(head, { shallow: true });
  const r = { g, turret, head, shoulder, elbow, wrist, fingers, tip, L1, L2, yaw: 0, color };
  PORT.robots.push(r);
  return r;
}
// IK plan : cible (f,h) relative à l'épaule, pince vers le bas
function robotPose(r, yaw, f, h, open = 0.5) {
  r.turret.rotation.y = yaw;
  const { L1, L2 } = r;
  let d = Math.hypot(f, h);
  d = clamp(d, Math.abs(L1 - L2) + 0.02, L1 + L2 - 0.02);
  const a2 = Math.acos(clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1));
  const a1 = Math.atan2(h, f) + Math.atan2(L2 * Math.sin(a2), L1 + L2 * Math.cos(a2));
  r.shoulder.rotation.x = -a1;
  r.elbow.rotation.x = a2;
  r.wrist.rotation.x = Math.PI / 2 + (a1 - a2);
  r.fingers[0].rotation.y = -0.1 - open * 0.35;
  r.fingers[1].rotation.y = 0.1 + open * 0.35;
}

/* ---------- boucle ferroviaire ---------- */
function buildRailLoop(isl) {
  const P = PORT;
  const g = P.g;
  const xo = P.TRACK_OUT, xr = P.TRACK_RET, cxm = (xo + xr) / 2, rad = (xr - xo) / 2;
  const zS = -1.8, zN = -24.5;
  // chemin : A (aller vers le nord), B (demi-tour nord), C (retour), D (demi-tour sud)
  const lenA = zS - zN, lenB = Math.PI * rad;
  P.rail = { xo, xr, cxm, rad, zS, zN, lenA, lenB, L: 2 * lenA + 2 * lenB };
  P.railAt = (s) => {
    const { L } = P.rail;
    s = ((s % L) + L) % L;
    if (s < lenA) return { x: xo, z: zS - s, h: Math.PI };
    s -= lenA;
    if (s < lenB) { const a = Math.PI + s / rad; return { x: cxm + Math.cos(a) * rad, z: zN - Math.sin(a) * rad * -1 * -1 - 0 + (Math.sin(a) * rad), h: Math.PI - s / rad }; }
    s -= lenB;
    if (s < lenA) return { x: xr, z: zN + s, h: 0 };
    s -= lenA;
    const a = s / rad;
    return { x: cxm + Math.cos(a) * rad, z: zS + Math.sin(a) * rad, h: -s / rad };
  };
  // (le demi-tour nord est caché dans les nuages ; formule simplifiée ci-dessus)
  P.railAt = (s) => {
    const { L } = P.rail;
    s = ((s % L) + L) % L;
    if (s < lenA) return { x: xo, z: zS - s, h: Math.PI };
    s -= lenA;
    if (s < lenB) { const a = Math.PI - s / rad; return { x: cxm + Math.cos(a) * rad, z: zN - Math.sin(a) * rad, h: Math.PI - s / rad }; }
    s -= lenB;
    if (s < lenA) return { x: xr, z: zN + s, h: 0 };
    s -= lenA;
    const a = -s / rad;
    return { x: cxm + Math.cos(a) * rad, z: zS - Math.sin(a) * rad, h: -s / rad };
  };
  // traverses + rails (partie visible : sur l'île et sur le pont)
  const sleepers = [];
  const railPts = [[], []];
  const step = 0.36;
  const Lvis = P.rail.L;
  for (let s = 0; s < Lvis; s += step) {
    const p = P.railAt(s);
    if (p.z < zN + 1.2) continue; // caché dans le portail
    sleepers.push(p);
  }
  const d = new THREE.Object3D();
  const sm = new THREE.InstancedMesh(G.rbox(0.82, 0.06, 0.16, 0.02), mat(0xb98b62, { r: 0.8 }), sleepers.length);
  sleepers.forEach((p, i) => { d.position.set(p.x, 0.04, p.z); d.rotation.set(0, p.h, 0); d.scale.setScalar(1); d.updateMatrix(); sm.setMatrixAt(i, d.matrix); });
  sm.receiveShadow = true;
  g.add(sm);
  // rails : 4 tubes par voie droite + arcs
  const railM = mat(0x8e97aa, { r: 0.35, m: 0.5 });
  const addRail = (pts) => { const c = new THREE.CatmullRomCurve3(pts.map(([x, z]) => V3(x, 0.1, z))); const m = new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(8, pts.length * 2), 0.035, 5, false), railM); m.castShadow = true; m.receiveShadow = true; g.add(m); };
  for (const off of [-0.24, 0.24]) {
    const pts = [];
    for (let s = 0; s <= Lvis + 0.01; s += 0.25) {
      const p = P.railAt(s);
      if (p.z < zN + 1.0) { if (pts.length > 1) addRail(pts.splice(0)); else pts.length = 0; continue; }
      pts.push([p.x + Math.cos(p.h) * off, p.z - Math.sin(p.h) * off]);
    }
    if (pts.length > 1) addRail(pts);
  }
  obstacleRect(isl, xo - 0.55, -11.5, xr + 0.55, zS + rad + 0.35);
  // pont ferroviaire
  const a = portWorld(V3(cxm, 0, -10.0)), b = portWorld(V3(cxm, 0, zN - 0.5));
  const br = buildBridge(a, b, { id: 'rail', width: 3.2, arch: 0.0, open: false, rails: false, lampEnds: false });
  br.barrierT = -1;
  BRIDGES.splice(BRIDGES.indexOf(br), 1); // non praticable
  // portail de nuages (le demi-tour s'y cache)
  const portal = new THREE.Group();
  portal.position.set(cxm, 0, zN - 0.4);
  g.add(portal);
  const R = mulberry32(88);
  for (let i = 0; i < 26; i++) {
    const s = rr(0.9, 1.9, R);
    const m = new THREE.Mesh(G.ico(1, 2), cloudMat);
    m.position.set(rr(-2.8, 2.8, R), rr(0.2, 2.6, R) * (1 - Math.abs(i % 5) * 0.08), rr(-1.6, 1.4, R));
    m.scale.set(s, s * 0.8, s);
    portal.add(m);
  }
  const arch = mesh(G.tor(1.25, 0.16, 12, 36, Math.PI), mat(0xfff6ec, { e: 0xfff1d6, ei: 0.25 }), portal, 0, 0.1, 1.9);
  const glow = halo(0xfff4dc, 3.2, 0.5);
  glow.position.set(0, 0.9, 1.6);
  portal.add(glow);
  P.portal = portal;
  // trains
  for (let q = 0; q < 2; q++) P.trains.push(buildTrain(g, q));
}
function buildTrain(parent, q) {
  const cars = [];

  const blue = mat(0x7f94c6, { r: 0.5 });

  boiler.rotation.x = Math.PI / 2;
  mesh(G.cyl(0.32, 0.32, 0.06, 20), navyM, loco, 0, 0.62, 0.7).rotation.x = Math.PI / 2;
  mesh(G.rbox(0.8, 0.72, 0.52, 0.08), blue, loco, 0, 0.72, -0.45);
  mesh(G.rbox(0.9, 0.1, 0.62, 0.04), navyM, loco, 0, 1.12, -0.45);
  for (const s of [-1, 1]) mesh(G.rbox(0.02, 0.24, 0.3, 0.02), mat(0x9fd3f0, { r: 0.2 }), loco, s * 0.405, 0.82, -0.45);
  mesh(G.cyl(0.09, 0.12, 0.34, 12), navyM, loco, 0, 1.02, 0.45);
  const lamp = mesh(G.sph(0.08, 10, 8), glowMat(0xfff1b0, 2.4), loco, 0, 0.66, 0.78, { cast: false });
  for (const s of [-1, 1]) for (const z of [-0.45, 0.05, 0.5]) { const w = mesh(G.cyl(0.14, 0.14, 0.08, 14), wheelM, loco, s * 0.36, 0.15, z); w.rotation.z = Math.PI / 2; }
  cars.push({ g: loco, len: 1.5 });
  for (let j = 0; j < 3; j++) {
    const w = new THREE.Group();
    parent.add(w);
    mesh(G.rbox(0.84, 0.16, 1.1, 0.05), mat(0x9aa3b8, { r: 0.45, m: 0.2 }), w, 0, 0.38, 0);
    for (const s of [-1, 1]) mesh(G.rbox(0.05, 0.14, 1.05, 0.02), navyM, w, s * 0.4, 0.5, 0);
    for (const s of [-1, 1]) for (const z of [-0.35, 0.35]) { const wh = mesh(G.cyl(0.13, 0.13, 0.08, 14), wheelM, w, s * 0.34, 0.14, z); wh.rotation.z = Math.PI / 2; }
    bake(w, { shallow: true });
    cars.push({ g: w, len: 1.15 });
  }
  bake(loco, { shallow: true });
  return { q, cars, lamp, smoke: [] };
}

  const c = s.ctx, W = s.W, H = s.H;
  c.fillStyle = '#26304D'; c.beginPath(); c.roundRect(0, 0, W, H, 34); c.fill();
  c.strokeStyle = '#3B4A6B'; c.lineWidth = 10; c.beginPath(); c.roundRect(5, 5, W - 10, H - 10, 30); c.stroke();
  c.fillStyle = '#FFD97A'; c.font = "700 38px 'JetBrains Mono', Menlo, monospace"; c.textBaseline = 'middle';
  c.fillText(_t("BANC D'ESSAI · F1 MOYEN"), 56, 70);
  c.fillStyle = flash > 0 ? '#7DFFC4' : '#8C96B3';
  c.font = "500 28px Figtree, 'Segoe UI', sans-serif";
  c.fillText(flash > 0 ? _t('XML conforme, livré') : _t('XML reconstruits vs XML de référence'), 58, 118);
  const row = (y, label, val, col, f) => {

    c.fillStyle = col; c.beginPath(); c.roundRect(250, y - 30, Math.max(60, 560 * (val / 100) * f), 60, 30); c.fill();
    c.fillStyle = '#FFFFFF'; c.font = "800 52px Unbounded, 'Trebuchet MS', sans-serif"; c.textAlign = 'right';
    c.fillText(`${Math.round(val * f)} %`, W - 50, y + 3); c.textAlign = 'left';
  };
  row(215, _t('Avant'), 49, '#9AA3B8', Math.min(1, fill * 1.6));
  row(320, _t('Après'), 73, '#7FD9B5', fill);
  c.fillStyle = '#8C96B3'; c.font = "500 27px Figtree, 'Segoe UI', sans-serif";
  c.fillText(_t('Certains fichiers reconstruits à 100 %.'), 58, 410);
  s.tex.needsUpdate = true;
}

/* =========================================================================

const FLOW = {};
function buildFlow() {
  const P = PORT, g = P.g;

  FLOW.TG = P.RX.map((x) => FLOW.TB + (x - P.GX) / P.V); // prise par l'agent i
  FLOW.TEND = FLOW.TB + (P.BELT_END - P.GX) / P.V;  // fin du tapis
  FLOW.DROP = { z: -1.5 };
  FLOW.laneLen = P.RX.map((x, i) => (FLOW.DROP.z - (P.LANE_Z1 + 0.05)) + Math.hypot(x - P.SLOT_X[i], P.PRESS_Z - (P.LANE_Z1 + 0.05)));
  FLOW.TA = P.RX.map((x, i) => FLOW.TG[i] + 1.3 + FLOW.laneLen[i] / P.VL);
  FLOW.TP = Math.max(...FLOW.TA) + 0.2;             // presse
  FLOW.TC0 = FLOW.TP + 0.28;                         // cube sort de la presse
  FLOW.TC1 = FLOW.TC0 + (P.CONV_X - 0.74 - (P.OUT_X0 + 0.15)) / P.VO; // entre dans le convertisseur
  FLOW.TB0 = FLOW.TC1 + 0.8;                         // barre XML sort
  FLOW.TL = FLOW.TB0 + 0.6;                          // chargée sur le wagon
  FLOW.P0off = 1.475;
  FLOW.pitch = 1.3;
  FLOW.sLoad = P.rail.zS - P.LOAD_Z;
  FLOW.P0 = FLOW.sLoad + FLOW.P0off;
  FLOW.D = P.rail.L - 2 * FLOW.pitch;
  FLOW.Dt = 4 * T - 0.75;
  FLOW.ta = 1.0; FLOW.td = 1.6;
  FLOW.vc = FLOW.D / (FLOW.Dt - FLOW.ta / 2 - FLOW.td / 2);
  FLOW.B0 = FLOW.TL - 0.6;
  // matériaux et réserves d'objets
  const crateGeo = G.rbox(0.46, P.CRATE_H, 0.46, 0.05);
  FLOW.matRaw = new THREE.MeshStandardMaterial({ map: crateTex('raw'), roughness: 0.7 });
  FLOW.matS = {};
  for (const m of [7, 6, 4, 0]) FLOW.matS[m] = new THREE.MeshStandardMaterial({ map: crateTex('struct', m), roughness: 0.7 });
  FLOW.crates = [];
  for (let i = 0; i < 14; i++) {
    const m = new THREE.Mesh(crateGeo, FLOW.matRaw);

  }
  const laneMats = [0x8fddbe, 0xffd26a, 0xbba6ee].map((c) => mat(c, { r: 0.5 }));
  const pieceGeo = G.rbox(0.4, 0.11, 0.34, 0.035);
  FLOW.pieces = [];
  for (let i = 0; i < 18; i++) {
    const m = new THREE.Mesh(pieceGeo, laneMats[i % 3]);
    m.castShadow = true; m.visible = false;
    g.add(m);
    FLOW.pieces.push(m);
  }
  FLOW.laneMats = laneMats;
  const cubeGeo = G.rbox(0.3, 0.3, 0.3, 0.06);
  const cubeMat = new THREE.MeshStandardMaterial({ color: 0xdffcf1, emissive: 0x7dffd2, emissiveIntensity: 1.1, roughness: 0.3 });
  FLOW.cubes = [];
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(cubeGeo, cubeMat);
    m.castShadow = true; m.visible = false;
    const h = halo(0x8dffd8, 0.9, 0.45);
    m.add(h);
    g.add(m);
    FLOW.cubes.push(m);
  }
  // barre XML : trois couches (entries, lines, items)
  const layer = (y, col) => { let gg = G.rbox(0.96, 0.095, 0.34, 0.03); if (gg.index) gg = gg.toNonIndexed(); gg.translate(0, y, 0); const c = new THREE.Color(col); const n = gg.attributes.position.count; const a = new Float32Array(n * 3); for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; } gg.setAttribute('color', new THREE.BufferAttribute(a, 3)); return gg; };
  const barGeo = mergeGeometries([layer(-0.1, 0x8fddbe), layer(0, 0xffd26a), layer(0.1, 0xbba6ee)]);
  const barMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55 });
  FLOW.bars = [];

    m.castShadow = true; m.visible = false;
    g.add(m);
    FLOW.bars.push(m);
  }
  // fumée
  const puffMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.8, depthWrite: false, emissive: 0xe8eef5, emissiveIntensity: 0.4 });
  FLOW.puffs = [];
  for (let i = 0; i < 14; i++) {
    const m = new THREE.Mesh(G.ico(1, 1), puffMat.clone());
    m.visible = false;
    m.userData = { life: 0, v: V3() };
    g.add(m);
    FLOW.puffs.push(m);
  }
  FLOW.puffI = 0;
  FLOW.lastPress = -1;
  FLOW.lastDepart = [-1, -1];
  FLOW.scoreFlashUntil = 0;
  FLOW.scoreFill = 1;
  FLOW.scoreAnim = null;
  // taille brute aléatoire des caisses (fichiers hétérogènes)
  FLOW.rawScale = (k) => { const h = Math.sin(k * 12.9898) * 43758.5453; const f = h - Math.floor(h); const h2 = Math.sin(k * 78.233) * 12345.678; const f2 = h2 - Math.floor(h2); return [0.78 + f * 0.5, 0.75 + f2 * 0.55, 0.85 + ((f + f2) % 1) * 0.35]; };
}
function puff(x, y, z, s = 0.35, vy = 0.8) {
  const m = FLOW.puffs[FLOW.puffI++ % FLOW.puffs.length];
  m.position.set(x, y, z);
  m.userData.life = 2.4;
  m.userData.s = s;
  m.userData.v.set(rr(-0.15, 0.15), vy, rr(-0.15, 0.15));
  m.visible = true;
}
function trainTravel(u) {
  const { ta, td, vc, D, Dt } = FLOW;
  if (u <= 0) return 0;
  if (u < ta) return 0.5 * (vc / ta) * u * u;
  if (u < Dt - td) return 0.5 * vc * ta + vc * (u - ta);
  const rem = Math.max(0, Dt - u);
  return D - 0.5 * (vc / td) * rem * rem;
}
// position (s relative au chargement) du train q à l'instant ft
function trainState(q, ft) {
  const T = PORT.T;
  const base = 3 * q * T + FLOW.B0;
  const n = Math.floor((ft - base) / (6 * T));
  const C0 = base + n * 6 * T;
  const u = ft - C0;
  const p = FLOW.pitch;
  let s;
  if (u < T - 0.5) s = 0;
  else if (u < T - 0.05) s = p * E.inOut((u - (T - 0.5)) / 0.45);
  else if (u < 2 * T - 0.5) s = p;
  else if (u < 2 * T - 0.05) s = p + p * E.inOut((u - (2 * T - 0.5)) / 0.45);
  else if (u < 2 * T + 0.75) s = 2 * p;
  else s = 2 * p + trainTravel(u - (2 * T + 0.75));
  return { n, C0, u, s, m: 2 * n + q };
}

function updateFlow(dt) {
  const P = PORT, F = FLOW;
  const ft = clock.flow, t = clock.t, T = P.T;
  const c = Math.floor(ft / T), tau = ft - c * T;
  const W = _v2;

  /* --- bateau (léger tangage) --- */
  P.boat.position.y = -0.42 + Math.sin(t * 1.3) * 0.035;
  P.boat.rotation.z = Math.sin(t * 1.1) * 0.02;
  P.boat.rotation.x = Math.sin(t * 0.9 + 1) * 0.015;
  P.water.material.normalMap.offset.set(t * 0.015, t * 0.01);
  P.foam.material.opacity = 0.45 + Math.sin(t * 2) * 0.1;
  for (const b of BELTS) b.tex.offset.y += b.speed * dt * (window.__arch.flowSpeed ?? 1);

  /* --- portique --- */
  const BZ = P.BOAT_Z, DZ = P.BELT_Z, UP = 2.85;
  const boatTop = 0.11 + P.CRATE_H, beltTop = P.BELT_Y + P.CRATE_H;
  let tz, hy;
  if (tau < 1.25) tz = BZ; else if (tau < 2.05) tz = lerp(BZ, DZ, E.inOut((tau - 1.25) / 0.8)); else if (tau < 3.05) tz = DZ; else tz = lerp(DZ, BZ, E.inOut((tau - 3.05) / 0.95));
  if (tau < 0.5) hy = lerp(UP, boatTop + (P.boat.position.y + 0.42), E.inOut(tau / 0.5));
  else if (tau < 0.7) hy = boatTop + (P.boat.position.y + 0.42);
  else if (tau < 1.2) hy = lerp(boatTop, UP, E.inOut((tau - 0.7) / 0.5));
  else if (tau < 2.1) hy = UP;
  else if (tau < 2.55) hy = lerp(UP, beltTop, E.inOut((tau - 2.1) / 0.45));
  else if (tau < 2.75) hy = beltTop;
  else if (tau < 3.2) hy = lerp(beltTop, UP, E.inOut((tau - 2.75) / 0.45));
  else hy = UP;
  const gt = P.gantry;
  gt.trolley.position.z = tz;
  gt.hook.position.set(0, hy, tz);
  const cl = 3.5 - hy;
  gt.cable.position.set(0, hy + cl / 2, tz);
  gt.cable.scale.set(1, Math.max(0.01, cl), 1);

  /* --- caisses --- */
  for (const m of F.crates) m.visible = false;
  for (let k = c - 4; k <= c + 4; k++) {
    const age = ft - k * T;
    const m = F.crates[((k % 14) + 14) % 14];
    let x, y, z, sx = 1, sy = 1, sz = 1, ry = 0, material = F.matRaw;
    const raw = F.rawScale(k);
    if (age < 0.6) {
      // file d'attente sur le pont du bateau
      let slot = k - c;
      if (k === c) slot = 0;
      else if (tau > 1.4) slot -= E.inOut(Math.min(1, (tau - 1.4) / 0.8));
      if (slot > 3.2) continue;
      const pop = slot > 2.2 ? clamp((3.2 - slot), 0, 1) : 1;
      W.set(P.boatPickLX + slot * 0.62, 0.53 + (P.CRATE_H * raw[1]) / 2, 0);
      P.boat.localToWorld(W);
      P.g.worldToLocal(W);
      x = W.x; y = W.y; z = W.z;
      sx = raw[0] * pop; sy = raw[1] * pop; sz = raw[2] * pop;
      ry = P.boat.rotation.y;
    } else if (age < F.TB) {
      x = P.GX; z = tz; y = hy - (P.CRATE_H * raw[1]) / 2 - 0.02;
      sx = raw[0]; sy = raw[1]; sz = raw[2];
      ry = Math.sin(t * 3) * 0.04;
    } else if (age < F.TEND) {
      x = P.GX + P.V * (age - F.TB);
      z = P.BELT_Z;
      const ks = sstep(F.TS - 0.2, F.TS + 0.35, age);
      sx = lerp(raw[0], 1, ks); sy = lerp(raw[1], 1, ks); sz = lerp(raw[2], 1, ks);
      y = P.BELT_Y + (P.CRATE_H * sy) / 2;
      if (age > F.TS) {
        let mask = 7;
        if (age > F.TG[0]) mask = 6;
        if (age > F.TG[1]) mask = 4;
        if (age > F.TG[2]) mask = 0;
        material = F.matS[mask];
      }
    } else if (age < F.TEND + 0.55) {
      const p = (age - F.TEND) / 0.55;
      x = P.BELT_END + 0.35 * E.out(p);
      z = P.BELT_Z;
      y = P.BELT_Y + P.CRATE_H / 2 + 0.05 - p * p * 0.6;
      sx = sy = sz = 1 - p * 0.6;
      material = F.matS[0];
      ry = p * 0.6;
    } else continue;
    m.visible = true;
    m.material = material;
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    m.rotation.set(0, ry, 0);
  }

  /* --- scanner --- */
  {
    const d = ((ft - F.TS) % T + T) % T; // temps depuis le dernier passage
    const on = d < 0.55 ? Math.sin((d / 0.55) * Math.PI) : 0;
    P.scanner.beam.material.opacity = on * 0.55;
    P.scanner.beam.position.x = on > 0 ? (d / 0.55 - 0.5) * 0.5 : 0;
    const lc = 1.3 + on * 2.5;
    P.scanner.lamp.material.color.setRGB(0.5 * lc, 0.85 * lc, 1.0 * lc);
  }

  /* --- agents robots --- */
  P.robots.forEach((rb, i) => {
    const k = Math.floor((ft - F.TG[i] + 0.8) / T);
    const v = ft - (k * T + F.TG[i]);
    const crateX = P.GX + P.V * (ft - k * T - F.TB);
    // repères : f,h relatifs à l'épaule
    const REST = [0, 0.35, 0.3, 0.4];
    let yaw = 0, f = 0.35, h = 0.3, open = 0.4;
    const trackYaw = () => Math.atan2(crateX - rb.g.position.x, (P.BELT_Z - rb.g.position.z));
    const trackF = () => Math.hypot(crateX - rb.g.position.x, P.BELT_Z - rb.g.position.z) - 0.2;
    if (v >= -0.8 && v < -0.35) { const e = E.inOut((v + 0.8) / 0.45); yaw = lerp(0, trackYaw(), e); f = lerp(REST[1], trackF(), e); h = lerp(REST[2], 0.3, e); open = 1; }
    else if (v >= -0.35 && v < 0) { const e = E.inOut((v + 0.35) / 0.35); yaw = trackYaw(); f = trackF(); h = lerp(0.3, 0.0, e); open = 1; }
    else if (v >= 0 && v < 0.2) { yaw = trackYaw(); f = trackF(); h = 0.0; open = lerp(1, 0.12, v / 0.2); }
    else if (v >= 0.2 && v < 0.55) { const e = E.inOut((v - 0.2) / 0.35); const y0 = Math.atan2(crateX - rb.g.position.x, P.BELT_Z - rb.g.position.z); yaw = lerp(y0, 0, e); f = lerp(0.8, 0.62, e); h = lerp(0.0, 0.42, e); open = 0.12; }
    else if (v >= 0.55 && v < 1.05) { const e = E.inOut((v - 0.55) / 0.5); yaw = lerp(0, Math.PI, e); f = lerp(0.62, 0.55, e); h = lerp(0.42, 0.3, e); open = 0.12; }
    else if (v >= 1.05 && v < 1.3) { const e = E.inOut((v - 1.05) / 0.25); yaw = Math.PI; f = lerp(0.55, 0.5, e); h = lerp(0.3, -0.265, e); open = 0.12; }
    else if (v >= 1.3 && v < 1.45) { yaw = Math.PI; f = 0.5; h = -0.265; open = lerp(0.12, 1, (v - 1.3) / 0.15); }
    else if (v >= 1.45 && v < 1.75) { const e = E.inOut((v - 1.45) / 0.3); yaw = Math.PI; f = lerp(0.5, REST[1], e); h = lerp(-0.265, REST[2], e); open = 1; }
    else if (v >= 1.75 && v < 2.35) { const e = E.inOut((v - 1.75) / 0.6); yaw = lerp(Math.PI, TAU, e); f = REST[1]; h = REST[2]; open = lerp(1, 0.4, e); }
    else { yaw = 0; f = REST[1] + Math.sin(t * 1.5 + i) * 0.03; h = REST[2] + Math.sin(t * 1.2 + i * 2) * 0.03; }
    robotPose(rb, yaw, f, h, open);
    rb.head.rotation.y = Math.sin(t * 0.8 + i * 1.3) * 0.25 + (v > -0.8 && v < 0.2 ? -yaw * 0.5 : 0);
    rb.g.updateMatrixWorld(true);
  });

  /* --- pièces (niveaux tarifaires) --- */
  for (const m of F.pieces) m.visible = false;
  for (let k = c - 5; k <= c; k++) {
    const sk = k * T;
    const tP = sk + F.TP;
    for (let i = 0; i < 3; i++) {
      const tg = sk + F.TG[i];
      if (ft < tg || ft > tP + 0.22) continue;
      const m = F.pieces[((k * 3 + i) % 18 + 18) % 18];
      m.material = F.laneMats[i];
      m.visible = true;
      m.scale.set(1, 1, 1);
      m.rotation.set(0, 0, 0);
      if (ft < tg + 1.3) {
        const rb = P.robots[i];
        rb.tip.getWorldPosition(W);
        P.g.worldToLocal(W);
        m.position.set(W.x, W.y - 0.06, W.z);
        m.rotation.y = rb.turret.rotation.y;
        if (ft < tg + 0.2) { const e = (ft - tg) / 0.2; m.scale.set(lerp(0.3, 1, e), lerp(0.3, 1, e), lerp(0.3, 1, e)); }
      } else {
        const d = (ft - tg - 1.3) * P.VL;
        const x0 = P.RX[i], zA = F.DROP.z, zB = P.LANE_Z1 + 0.05;
        const straight = zA - zB;
        if (d < straight) m.position.set(x0, P.LANE_Y + 0.06, zA - d);
        else {
          const diag = F.laneLen[i] - straight;
          const e = Math.min(1, (d - straight) / diag);
          m.position.set(lerp(x0, P.SLOT_X[i], e), lerp(P.LANE_Y + 0.06, P.BED_Y + 0.06, e), lerp(zB, P.PRESS_Z, e));
          if (e >= 1) m.position.y = P.BED_Y + 0.06 + i * 0.001;
        }
        if (ft > tP + 0.08) { const e = clamp((ft - tP - 0.08) / 0.12, 0, 1); m.scale.set(1 + e * 0.3, 1 - e * 0.85, 1 + e * 0.3); m.position.y = P.BED_Y + 0.02; }
      }
    }
  }

  /* --- presse --- */
  {
    const k = Math.floor((ft - F.TP) / T);
    const d = ft - (k * T + F.TP);
    let ry = 1.55;
    if (d >= 0 && d < 0.16) ry = lerp(1.55, 0.84, E.in(d / 0.16));
    else if (d >= 0.16 && d < 0.24) ry = 0.84;
    else if (d >= 0.24 && d < 0.5) ry = lerp(0.84, 1.55, E.inOut((d - 0.24) / 0.26));
    P.press.ram.position.y = ry;
    const flash = d >= 0.14 && d < 0.6 ? 1 - (d - 0.14) / 0.46 : 0;
    P.press.lamp.material.color.setRGB(1.0 * (1.2 + flash * 2), 0.55 * (1.2 + flash * 2), 0.48 * (1.2 + flash * 2));
    if (k !== F.lastPress && d >= 0.18 && d < 0.5) {
      F.lastPress = k;
      isleSfx('port', 'stamp', { vol: 0.4 });
      for (const ch of P.chimneys) { puff(ch.x + 0, ch.y - 0.1, ch.z - PORT_C.z * 0 + 0, 0.28, 0.9); }
    }
  }

  /* --- cubes JSON --- */
  for (const m of F.cubes) m.visible = false;
  for (let k = c - 6; k <= c; k++) {
    const a = ft - k * T;
    if (a < F.TC0 || a > F.TC1) continue;
    const m = F.cubes[((k % 5) + 5) % 5];
    const e = a - F.TC0;
    m.visible = true;
    m.position.set(P.OUT_X0 + 0.15 + e * P.VO, 0.62 + 0.15, P.PRESS_Z);
    const pop = Math.min(1, e / 0.25);
    const sh = a > F.TC1 - 0.25 ? (F.TC1 - a) / 0.25 : 1;
    m.scale.setScalar(E.outBack(pop) * Math.max(0.2, sh));
    m.rotation.y = e * 0.8;
  }

  /* --- convertisseur --- */
  {
    const a = ((ft - F.TC1) % T + T) % T;
    const busy = a < 0.8 ? 1 : 0;
    for (const gr of P.converter.gears) gr.m.rotation.z += gr.sp * dt * (0.35 + busy * 2.2) * (window.__arch.flowSpeed ?? 1);
    const cone = P.converter.cone;
    if (cone) cone.position.y = 1.73 + (busy ? Math.sin(a * 40) * 0.02 : 0);
  }

  /* --- barres XML + trains --- */
  for (const m of F.bars) m.visible = false;
  const pr = P.rail;
  for (let q = 0; q < 2; q++) {
    const tr = P.trains[q];
    const stt = trainState(q, ft);
    const sAbs = F.P0 + stt.s;
    let offs = 0;
    tr.cars.forEach((car, j) => {
      const sc = j === 0 ? sAbs : sAbs - F.P0off - (j - 1) * F.pitch;
      const p = P.railAt(sc);
      const sm = ((sc % pr.L) + pr.L) % pr.L;
      car.g.visible = !(sm > pr.lenA - 0.6 && sm < pr.lenA + pr.lenB + 0.6);
      car.g.position.set(p.x, 0.06, p.z);
      car.g.rotation.y = p.h;
      if (j > 0) {
        // barres de ce cycle
        const k = 3 * stt.m + (j - 1);
        const tl = k * T + F.TL;
        const sUnwrapped = F.sLoad + stt.s - (j - 1) * F.pitch;
        if (ft >= tl && sUnwrapped < pr.lenA - 0.8 + F.sLoad * 0) {
          const bm = F.bars[((k % 16) + 16) % 16];
          bm.visible = car.g.visible;
          bm.position.set(p.x, 0.62 + 0.03, p.z);
          bm.rotation.set(0, p.h + Math.PI / 2, 0);
          bm.scale.setScalar(1);
        }
      }
    });
    // départ : fumée et flash du tableau
    const dep = stt.C0 + 2 * T + 0.75;
    if (ft >= dep && ft < dep + 0.5 && F.lastDepart[q] !== stt.n) {
      F.lastDepart[q] = stt.n;
      isleSfx('port', 'horn', { vol: 0.55 });
      const lp = P.railAt(sAbs);
      puff(lp.x, 1.3, lp.z, 0.22, 1.1);
      F.scoreFlashUntil = t + 1.6;
    }
  }
  // barres sur la goulotte
  for (let k = c - 6; k <= c; k++) {
    const a = ft - k * T;
    if (a < F.TB0 || a >= F.TL) continue;
    const m = F.bars[((k % 16) + 16) % 16];
    const e = E.in((a - F.TB0) / 0.6);
    m.visible = true;
    m.position.set(lerp(P.chute.x0, P.TRACK_OUT, e), lerp(P.chute.y0, 0.65, e), P.PRESS_Z);
    m.rotation.set(0, Math.PI / 2, lerp(-0.12, 0, e));
    m.scale.setScalar(Math.min(1, (a - F.TB0) / 0.15 + 0.3));
  }

  /* --- tableau du banc d'essai --- */
  const flash = t < F.scoreFlashUntil ? 1 : 0;
  drawScore(F.scoreFill, flash);
  const lk = flash ? 1.8 + Math.sin(t * 20) * 0.6 : 0.9;
  P.scoreLamp.material.color.setRGB(0.49 * lk, 1.0 * lk, 0.77 * lk);

  /* --- toit de l'atelier (fondu quand on regarde la presse) --- */
  {
    const R = P.roof;
    const dpx = cam.target.x - PORT_C.x, dpz = cam.target.z - (PORT_C.z + P.PRESS_Z);
    R.target = Math.hypot(dpx, dpz) < 7.5 && cam.dist < 30 ? 0.14 : 1;
    R.fade = damp(R.fade, R.target, 4, dt);
    const o = R.fade;
    for (const m of R.mats) { m.opacity = o; m.depthWrite = o > 0.95; }
  }

  /* --- fumée --- */
  for (const m of F.puffs) {
    if (!m.visible) continue;
    m.userData.life -= dt;
    if (m.userData.life <= 0) { m.visible = false; continue; }
    const k = m.userData.life / 2.4;
    m.position.addScaledVector(m.userData.v, dt);
    m.scale.setScalar(m.userData.s * (1 + (1 - k) * 1.8));
    m.material.opacity = 0.75 * Math.min(1, k * 1.5);
  }

  /* --- l'ancien pipeline : il en perd en route --- */
  {
    const O = P.old;
    const period = 7, tt = t % period;
    const wob = Math.sin(t * 1.9) * 0.06 + (tt > 2.2 && tt < 3.8 ? Math.sin(t * 9) * 0.05 * (tt - 2.2) : 0);
    O.stack.rotation.z = wob;
    O.stack.rotation.x = Math.sin(t * 1.3) * 0.03;
    O.cable.scale.set(1, -O.stack.position.y, 1);
    O.cable.position.set(O.stack.position.x, O.stack.position.y / 2, 0);
    let yy = 0.1;
    O.crates.forEach((m, i) => {
      const h = m.userData.h;
      const top = i === O.crates.length - 1;
      if (top && tt >= 3.6 && tt < 6.2) {
        const e = tt - 3.6;
        // chute dans le repère du port
        if (O.fallStart === undefined || O.lastFall !== Math.floor(t / period)) {
          O.lastFall = Math.floor(t / period);
          m.getWorldPosition(W); P.g.worldToLocal(W);
          O.fallStart = W.clone();
          O.splashed = false;
        }
        const g0 = O.fallStart;
        let py = g0.y - 4.9 * e * e;
        const px = g0.x - 0.6 * e, pz = g0.z + 0.2 * e;
        if (py < -0.42) {
          if (!O.splashed) {
            O.splashed = true; O.splashT = t;
            O.ring.position.set(px, -0.4, pz);
            O.drops.forEach((d) => { d.position.set(px, -0.35, pz); d.userData.v.set(rr(-1.3, 1.3), rr(2, 3.4), rr(-1.3, 1.3)); d.visible = true; });
          }
          const s = t - O.splashT;
          py = -0.42 - s * 0.25;
          m.visible = s < 1.6;
        } else m.visible = true;
        W.set(px, py, pz);
        P.g.localToWorld(W);
        O.stack.worldToLocal(W);
        m.position.copy(W);
        m.rotation.set(e * 2, 0, e * 3);
      } else {
        m.visible = true;
        let sc = 1;
        if (top && tt >= 6.2) sc = E.outBack(Math.min(1, (tt - 6.2) / 0.6));
        m.scale.setScalar(Math.max(0.01, sc));
        m.position.set(m.userData.off, -yy - h / 2, 0);
        m.rotation.set(0, 0, m.userData.rot * (0.5 + i * 0.25));
        yy += h;
      }
    });
    if (O.splashT !== undefined) {
      const s = t - O.splashT;
      O.ring.material.opacity = s < 1 ? 0.8 * (1 - s) : 0;
      O.ring.scale.setScalar(0.4 + s * 2.2);
      O.drops.forEach((d) => { if (!d.visible) return; d.userData.v.y -= 9.8 * dt; d.position.addScaledVector(d.userData.v, dt); if (d.position.y < -0.45) d.visible = false; });
    }
  }
}

function residenceUpdate(R, dt, t) {
  const ft = clock.flow, T = R.T;
  const c = Math.floor(ft / T);
  const Rt = R.route;
  const lit = new Set();
  let chosen = -1;
  for (const L of R.letters) L.g.visible = false;
  for (const h of R.heads) h.visible = false;
  let headI = 0;
  const playing = gameOn('residence');
  for (let k = c - 4; k <= c + 1 && !playing; k++) {
    const a = ft - k * T;
    if (a < -1.2 || a > 8.0) continue;
    const hsh = Math.imul(k, 2654435761) >>> 0;
    const photo = k % 3 === 0, foreign = k % 4 === 1, isOther = k % 7 === 3;
    const win = R.windows[hsh % R.windows.length];
    if (a > -1.2 && a < 0.4 && headI < R.heads.length) {
      const h = R.heads[headI++];
      h.visible = true;
      const e = a < -0.8 ? (a + 1.2) / 0.4 : a > 0.1 ? 1 - (a - 0.1) / 0.3 : 1;
      h.position.set(win.x, win.y - 0.18 + e * 0.1, win.z - 0.3 + e * 0.2);
      h.scale.setScalar(Math.max(0.01, e));
    }
    if (a < 0) continue;
    const L = R.letters[((k % 6) + 6) % 6];
    L.g.visible = true;
    L.g.rotation.set(0, 0, 0);
    L.g.scale.setScalar(1);
    const P = L.g.position;
    const spin = Math.sin(a * 5 + k) * 0.18;
    let masked = false, fr = !foreign;
    if (a < 1.2) { arcPos(P, win, Rt.A, 1.0, E.inOut(a / 1.2)); L.g.rotation.set(spin, a * 2, 0); }
    else if (a < 1.7) { P.copy(Rt.A); P.y += Math.sin((a - 1.2) * 6) * 0.03; masked = a > 1.45; }
    else if (a < 2.6) { arcPos(P, Rt.A, Rt.B, 0.3, E.inOut((a - 1.7) / 0.9)); masked = true; L.g.rotation.z = spin; }
    else if (a < 3.4) { arcPos(P, Rt.B, Rt.C, 0.25, E.inOut((a - 2.6) / 0.8)); masked = true; L.g.rotation.z = spin; }
    else if (a < 4.4) { arcPos(P, Rt.C, Rt.D, 0.3, E.inOut((a - 3.4) / 1.0)); masked = true; fr = true; L.g.rotation.z = spin; }
    else if (a < 6.4) { P.copy(Rt.D); P.y += Math.sin((a - 4.4) * 3) * 0.05; L.g.rotation.y = (a - 4.4) * 1.5; masked = true; fr = true; }
    else if (a < 7.6) {
      masked = true; fr = true;
      const target = isOther ? R.otherPos : R.boxPos[hsh % R.boxPos.length];
      const e = E.inOut((a - 6.4) / 1.2);
      arcPos(P, Rt.D, target, 1.1, e);
      L.g.rotation.set(-1.4 * e, 0, 0);
    } else if (a < 7.9) {
      masked = true; fr = true;
      P.copy(isOther ? R.otherPos : R.boxPos[hsh % R.boxPos.length]);
      L.g.scale.setScalar(1 - (a - 7.6) / 0.3);
      L.g.rotation.set(-1.4, 0, 0);
    } else L.g.visible = false;
    if (a > 2.6) fr = fr || a > 3.3;
    L.env.material = masked ? (fr ? R.envMats.maskedFR : R.envMats.masked) : (fr ? R.envMats.rawFR : R.envMats.raw);
    L.ph.visible = photo && a < 6.4;
    if (L.ph.visible) L.ph.material = a > 2.6 ? R.textMat : R.photoMat;
    if (a >= 4.6 && a < 7.9) {
      const b0 = hsh % 80;
      lit.add(b0); lit.add((b0 + 17 + (hsh % 11)) % 80); lit.add((b0 + 43 + (hsh % 7)) % 80);
      if (a >= 5.5) chosen = isOther ? -2 : b0;
    }
  }
  let dirty = false;
  for (let i = 0; i < 80; i++) {
    const target = i === chosen ? 1.0 : lit.has(i) ? 0.6 : 0;
    if (R.boxK[i] !== target) {
      R.boxK[i] = target;
      _cTmp.copy(R.boxCols[i]).lerp(_cMint, target);
      if (target) _cTmp.multiplyScalar(1 + target * 0.7);
      R.box.setColorAt(i, _cTmp);

    }
  }

  // tampon
  { const d = ((ft - 1.3) % T + T) % T; R.stamp.position.y = 1.85 - (d < 0.3 ? Math.sin((d / 0.3) * Math.PI) * 0.34 : 0); if (edge('re-stamp', d > 0.1 && d < 0.3)) isleSfx('residence', 'stamp', { vol: 0.35 }); }
  // flash photo
  { const d = ((ft - 2.6) % T + T) % T; const kk = Math.floor((ft - 2.6) / T); setGlow(R.flash.material, kk % 3 === 0 && d < 0.25 ? 4.5 : 1.1); if (edge('re-flash', kk % 3 === 0 && d < 0.25)) isleSfx('residence', 'shutter', { vol: 0.6 }); }
  R.globe.rotation.y += dt * (boosted('resGlobe') ? 9 : 0.6);
  // agent de tri
  const bot = R.bot;
  const sa = ((ft - 4.4) % T + T) % T;
  bot.head.rotation.y = sa < 1.6 ? -0.9 + Math.sin(sa * 4) * 0.15 : Math.sin(t * 0.8) * 0.3;
  setGlow(bot.eyes.material, sa < 1.4 || boosted('resBot') ? 3.4 : 2.2);
  bot.g.position.y = Math.sin(t * 2) * 0.02;
  bot.arms[0].rotation.x = sa > 1.0 && sa < 1.9 ? -1.3 : damp(bot.arms[0].rotation.x, -0.1, 6, dt);
  R.cloud.position.y = 2.55 + Math.sin(t * 1.3) * 0.08;
  // locataire
  const ch = ((ft - 5.5) % T + T) % T;
  R.tenant.armR.rotation.x = ch < 0.9 ? -2.4 + Math.sin(ch * 12) * 0.15 : damp(R.tenant.armR.rotation.x, 0, 6, dt);
  // écran
  if (!(t < R.nextShot)) {
    R.nextShot = t + 0.6;
    R.hist.shift();
    R.hist.push(0.7 + Math.sin(t * 0.9) * 0.05 + (Math.random() - 0.5) * 0.06);
    R.autre = R.autre.map((i) => i - 1).filter((i) => i >= 0);
    if (Math.random() < 0.12) R.autre.push(39);
    R.screen.redraw(R.hist, R.autre);
  }
  const cyc = t % 12;
  R.lid.rotation.x = cyc > 9 && cyc < 11.2 ? -Math.sin(((cyc - 9) / 2.2) * Math.PI) * 1.1 : 0;
  setGlow(R.chestLamp.material, cyc > 9.6 && cyc < 11 ? 3 : 1.1);
}

function obsUpdate(O, dt, t) {
  const ft = clock.flow;
  const g = O.g;
  const camL = g.worldToLocal(_oL.copy(camera.position));
  const R = O.ring;
  // ciel de posts
  const T = 3.2;
  const c0 = Math.floor(ft / T);
  const hidden = new Map();
  for (let k = c0 - 2; k <= c0; k++) { const a = ft - k * T; if (a >= 0 && a < 6.4) hidden.set(((k * 7) % O.nCards + O.nCards) % O.nCards, a); }
  const cardPos = (i, out) => {
    const ang = (i / O.nCards) * TAU + t * 0.045;
    const rad = R.r + Math.sin(i * 2.3) * 0.45;
    return out.set(R.x + Math.cos(ang) * rad, R.y + Math.sin(i * 1.7 + t * 0.6) * 0.35 + Math.sin(i * 0.9) * 0.4, R.z + Math.sin(ang) * rad);
  };
  for (let i = 0; i < O.nCards; i++) {
    const im = O.cards[i % 3], j = Math.floor(i / 3);
    cardPos(i, _oDm.position);
    let s = 1;
    if (hidden.has(i)) { const a = hidden.get(i); s = a < 5.4 ? 0 : (a - 5.4) / 1.0; }
    _oDm.lookAt(camL);
    _oDm.scale.setScalar(Math.max(0.001, E.out(Math.min(1, s))));
    _oDm.updateMatrix();
    im.setMatrixAt(j, _oDm.matrix);
  }
  for (const im of O.cards) { im.instanceMatrix.needsUpdate = true; im.visible = !gameOn('observatoire'); }
  // cible du télescope : la carte en cours d'aspiration
  const kc = c0, ac = ft - kc * T;
  const idx = ((kc * 7) % O.nCards + O.nCards) % O.nCards;
  const nextIdx = (((kc + 1) * 7) % O.nCards + O.nCards) % O.nCards;
  const aimIdx = ac < 1.3 ? idx : nextIdx;
  cardPos(aimIdx, _oA);
  const yaw = Math.atan2(_oA.x - O.D.x, _oA.z - O.D.z);
  if (boosted('obsSpin')) O.domeTop.rotation.y += dt * 6;
  else if (!gameOn('observatoire')) O.domeTop.rotation.y = dampAngle(O.domeTop.rotation.y, yaw, 1.6, dt);
  // carte aspirée
  g.worldToLocal(O.lens.getWorldPosition(_oB));
  if (ac < 1.3 && !gameOn('observatoire')) {
    cardPos(idx, _oA);
    const e = E.inOut(ac / 1.3);
    O.pulled.visible = true;
    O.pulled.material = O.postMats[idx % 3];
    O.pulled.position.lerpVectors(_oA, _oB, e);
    O.pulled.lookAt(camera.position);
    O.pulled.scale.setScalar(1 - e * 0.8);
  } else O.pulled.visible = false;
  setGlow(O.lens.material, ac > 1.1 && ac < 1.6 ? 3.2 : 1.3);
  if (edge('ob-lens', ac > 1.1 && ac < 1.6)) isleSfx('observatoire', 'sparkle', { vol: 0.3 });
  const busy = ac > 1.3 && ac < 2.3;
  for (const w of O.domeGlow) setGlow(w.material, busy ? 1.8 + Math.sin(t * 14) * 0.4 : 0.9);
  // cartes texte : porte → tri → bac
  let lampK = -1;
  for (const o of O.outs) o.visible = false;
  O.emo.visible = false;
  for (let k = c0 - 1; k <= c0; k++) {
    const a = ft - k * T;
    if (a < 2.1 || a > 4.6) continue;
    const hsh = Math.imul(k + 11, 2654435761) >>> 0;
    const sk = hsh % 5 < 2 ? 0 : 1;
    const o = O.outs[((k % 3) + 3) % 3];
    o.visible = true;
    o.scale.setScalar(0.8);
    let tint = 0;
    if (a < 3.0) arcPos(o.position, O.door, O.gate, 0.5, E.inOut((a - 2.1) / 0.9));
    else if (a < 3.6) { o.position.copy(O.gate); o.position.y += Math.sin((a - 3.0) * 8) * 0.03; tint = a > 3.25 ? 1 + sk : 0; if (a > 3.25) lampK = sk; }
    else {
      tint = 1 + sk;
      const e = E.inOut(Math.min(1, (a - 3.6) / 0.8));
      arcPos(o.position, O.gate, O.bins[sk], 0.7, e);
      if (a > 4.3) o.scale.setScalar(0.8 * Math.max(0.01, 1 - (a - 4.3) / 0.3));
    }
    o.material = O.outMats[tint];
    o.lookAt(camera.position);
    if (a > 3.2 && a < 4.4) {
      O.emo.visible = true;
      O.emo.position.copy(o.position).add(_oC.set(0.38, 0.28, 0));
      O.emo.material.color.setHex(EMO_COLS[hsh % 5]);
      O.emoHalo.material.color.setHex(EMO_COLS[hsh % 5]);
      O.emo.scale.setScalar(Math.min(1, (a - 3.2) / 0.2));
    }
  }
  if (edge('ob-sort', lampK >= 0)) isleSfx('observatoire', 'pop', { f: lampK === 0 ? 560 : 840, vol: 0.4 });
  setGlow(O.gateLamps[0].material, lampK === 0 ? 3.2 : 0.9);
  setGlow(O.gateLamps[1].material, lampK === 1 ? 3.2 : 0.9);
  // nuage de paraphrases : tantôt serré, tantôt flou
  const breathe = 0.5 + 0.5 * Math.sin(t * 0.7);
  const spread = 0.22 + breathe * 0.62;
  const pos = O.lines.geometry.attributes.position.array;
  O.ptCol.setHex(0xa8e6cf).lerp(_cTmp.setHex(0xc8b6f2), breathe);
  O.pts.material.color.copy(O.ptCol).multiplyScalar(1.3);
  for (let i = 0; i < 12; i++) {
    const d = O.ptDir[i];
    _oDm.position.set(O.cloudC.x + d.x * spread + Math.sin(t * 1.3 + i) * 0.03, O.cloudC.y + d.y * spread * 0.8, O.cloudC.z + d.z * spread);
    _oDm.rotation.set(0, 0, 0);
    _oDm.scale.setScalar(1);
    _oDm.updateMatrix();
    O.pts.setMatrixAt(i, _oDm.matrix);
    pos[i * 6] = O.cloudC.x; pos[i * 6 + 1] = O.cloudC.y; pos[i * 6 + 2] = O.cloudC.z;
    pos[i * 6 + 3] = _oDm.position.x; pos[i * 6 + 4] = _oDm.position.y; pos[i * 6 + 5] = _oDm.position.z;
  }
  O.pts.instanceMatrix.needsUpdate = true;
  O.lines.geometry.attributes.position.needsUpdate = true;
  O.core.scale.setScalar(1 + Math.sin(t * 2) * 0.12);
  // frise
  if (!(t < O.nextChart)) { O.nextChart = t + 0.25; O.chart.redraw((t * 0.08) % 1.25); }
  // page du draft
  const pc = t % 7;
  O.page.visible = pc > 5.6 && pc < 6.8;
  if (O.page.visible) O.page.rotation.z = E.inOut((pc - 5.6) / 1.2) * Math.PI;
  // labo : émotion → réponse adaptée
  const Tm = 4.2, m = ((Math.floor(ft / Tm) % 4) + 4) % 4, am = ((ft % Tm) + Tm) % Tm;
  O.mood.material = O.moodMats[m];
  O.reply.material = O.replyMats[m];
  const pop = (a0, a1, x) => {
    if (x < a0) return 0;
    if (x < a0 + 0.35) return E.outBack((x - a0) / 0.35);
    if (x < a1) return 1;
    if (x < a1 + 0.3) return 1 - (x - a1) / 0.3;
    return 0;
  };
  O.mood.scale.setScalar(Math.max(0.001, pop(0.1, 3.7, am)));
  O.reply.scale.setScalar(Math.max(0.001, pop(1.6, 3.7, am)));
  O.mood.quaternion.copy(camera.quaternion);
  O.reply.quaternion.copy(camera.quaternion);
  O.mood.position.y = 2.1 + Math.sin(t * 2.2) * 0.04;
  O.reply.position.y = 2.3 + Math.sin(t * 2.2 + 1) * 0.04;
  const thinking = am > 0.6 && am < 1.6;
  setGlow(O.bot.eyes.material, thinking ? 2.2 + Math.sin(t * 16) * 1.2 : 2.2);
  O.bot.head.rotation.z = thinking ? Math.sin(t * 3) * 0.12 : damp(O.bot.head.rotation.z, 0, 5, dt);
  O.bot.arms[1].rotation.x = am > 1.6 && am < 2.6 ? -0.9 + Math.sin(t * 8) * 0.2 : damp(O.bot.arms[1].rotation.x, 0, 5, dt);
  O.user.armR.rotation.x = am < 0.9 ? -1.2 + Math.sin(am * 10) * 0.2 : damp(O.user.armR.rotation.x, 0, 5, dt);
  // machines : le CVAE règle l'émotion, Mistral affine le naturel
  const ei = Math.floor(t / 1.6) % 5;
  O.latent.material.color.setHex(EMO_COLS[ei]);
  O.latentHalo.material.color.setHex(EMO_COLS[ei]);
  O.latent.scale.setScalar(1 + Math.sin(t * 3) * 0.08);
  O.needle.rotation.z = dampAngle(O.needle.rotation.z, -((ei + 0.5) / 5) * TAU - Math.PI / 2, 6, dt);
  O.adapters.forEach((a, i) => setGlow(a.material, 1.1 + Math.max(0, Math.sin(t * 3 - i * 0.8)) * 1.6));
  O.bubbles.forEach((b, i) => {
    const bt = (t + i * 0.55) % 4.4;
    const src = i % 2 ? O.outMis : O.outCVAE;
    if (bt > 2.2) { b.visible = false; return; }
    b.visible = true;
    b.position.set(src.x + Math.sin(i * 3 + bt) * 0.15, src.y + bt * 0.55, src.z + Math.cos(i * 2) * 0.1);
    b.scale.setScalar(Math.min(1, bt / 0.25) * (1 - bt / 2.4));
  });
}

function sheetTex(bad) {

    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#3FA46A'; c.fillRect(0, 0, w, 16);
    c.strokeStyle = 'rgba(39,49,77,.25)'; c.lineWidth = 2;
    for (let i = 1; i < 5; i++) { c.beginPath(); c.moveTo(0, 16 + i * 16); c.lineTo(w, 16 + i * 16); c.stroke(); }
    for (let j = 1; j < 4; j++) { c.beginPath(); c.moveTo(j * 32, 16); c.lineTo(j * 32, h); c.stroke(); }
    c.fillStyle = 'rgba(39,49,77,.4)';
    for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) if ((i + j) % 3) c.fillRect(j * 32 + 6, 20 + i * 16, 18, 6);
    if (bad) { c.fillStyle = '#FF6B57'; c.fillRect(64, 52, 32, 16); c.strokeStyle = '#E0412C'; c.lineWidth = 5; c.strokeRect(3, 3, w - 6, h - 6); }
  });
}
function dialTex(title, sub, col) {
  return canvasTex(256, 300, (c, w) => {
    c.fillStyle = '#FFF8EE'; c.beginPath(); c.arc(128, 128, 118, 0, TAU); c.fill();
    c.lineWidth = 12; c.strokeStyle = col; c.beginPath(); c.arc(128, 128, 112, 0, TAU); c.stroke();
    c.strokeStyle = '#27314D'; c.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU; c.lineWidth = i % 3 ? 4 : 8; c.beginPath(); c.moveTo(128 + Math.cos(a) * 92, 128 + Math.sin(a) * 92); c.lineTo(128 + Math.cos(a) * 104, 128 + Math.sin(a) * 104); c.stroke(); }
    c.fillStyle = '#27314D'; c.textAlign = 'center';
    c.font = "800 34px Unbounded, 'Trebuchet MS', sans-serif"; c.fillText(title, w / 2, 280);
    c.font = "600 22px Figtree, sans-serif"; c.fillStyle = '#6A7390'; c.fillText(sub, w / 2, 170);
  });
}

function atelierUpdate(A, dt, t) {
  const ft = clock.flow;
  const camW = camera.position;
  // ancienne base : bobines lentes et sablier
  A.reels.forEach((rg, i) => { rg.rotation.z -= dt * (0.5 + i * 0.15); });
  { const c = t % 6; A.hg.rotation.z = c > 5.2 ? E.inOut((c - 5.2) / 0.8) * Math.PI : 0; }
  // enregistrements sur le tapis ETL
  const Tr = 1.1, c0 = Math.floor(ft / Tr);
  let used = 0;
  const lampOn = [0, 0, 0];
  let dbHit = 0;
  for (let k = c0 - 6; k <= c0; k++) {
    const a = ft - k * Tr;
    if (a < 0 || a > 6.55) continue;
    const m = A.recs[used++ % A.recs.length];
    m.visible = true;
    m.scale.setScalar(1);
    let x;
    if (a < 6.0) {
      x = -4.35 + a;
      m.position.set(x, 0.86, A.CZ);
      m.rotation.set(0, 0, 0);
    } else {
      x = 1.65;
      const e = (a - 6.0) / 0.55;
      arcPos(m.position, _aA.set(1.65, 0.86, A.CZ), A.dbTop, 0.5, E.inOut(e));
      m.rotation.set(0, 0, -e * 1.2);
      if (e > 0.75) m.scale.setScalar(Math.max(0.01, 1 - (e - 0.75) / 0.25));
      if (e > 0.7) dbHit = 1;
    }
    const stage = x < -2.8 ? 0 : x < -1.2 ? 1 : x < 0.4 ? 2 : 3;
    m.material = A.recMats[stage];
    A.arches.forEach((ar, i) => { if (Math.abs(x - ar.x) < 0.3) lampOn[i] = 1; });
  }
  for (let i = used; i < A.recs.length; i++) A.recs[i].visible = false;
  A.arches.forEach((ar, i) => setGlow(ar.lamp.material, lampOn[i] ? 3.2 : 0.9));
  setGlow(A.dbLid.material, dbHit ? 2.4 : 1.0);
  // chronos : lent avant, très rapide après
  A.hands[0].rotation.z = -t * 0.08;
  A.hands[1].rotation.z = -t * 9;
  // imports Excel
  const Ts = 2.6, s0 = Math.floor(ft / Ts);
  for (const s of A.sheets) s.visible = false;
  let lampCol = null;
  for (let k = s0 - 1; k <= s0; k++) {
    const a = ft - k * Ts;
    if (a < 0 || a > 2.5) continue;
    const bad = (Math.imul(k + 5, 2654435761) >>> 0) % 5 === 0;
    const m = A.sheets[((k % 3) + 3) % 3];
    m.visible = true;
    m.material = A.sheetMats[bad && a > 1.1 ? 1 : 0];
    m.scale.setScalar(1);
    if (a < 1.0) {
      const e = E.out(a / 1.0);
      m.position.set(lerp(A.gate.x + 0.9, A.gate.x, e), lerp(4.6, A.gate.y, e), lerp(A.gate.z + 0.8, A.gate.z, e));
      m.rotation.set(Math.sin(a * 9) * 0.3, a * 3, Math.sin(a * 7) * 0.2);
    } else if (a < 1.5) {
      m.position.copy(A.gate); m.position.y += Math.sin((a - 1.0) * 10) * 0.03;
      m.lookAt(camW);
      if (a > 1.1) lampCol = bad ? 0xff6b57 : 0x7dffc4;
    } else {
      const e = E.inOut(Math.min(1, (a - 1.5) / 0.8));
      arcPos(m.position, A.gate, bad ? A.reject : A.dbTop, 0.8, e);
      m.rotation.set(-e * 1.3, 0, 0);
      if (a > 2.2) m.scale.setScalar(Math.max(0.01, 1 - (a - 2.2) / 0.3));
      if (!bad && e > 0.8) dbHit = 1;
    }
  }
  if (edge('at-lamp', lampCol !== null)) isleSfx('atelier', lampCol === 0xff6b57 ? 'bad' : 'good', { vol: 0.3 });
  A.eLamp.material.color.setHex(lampCol || 0xf6ecdc);
  if (lampCol) A.eLamp.material.color.multiplyScalar(2.2);
  if (dbHit) setGlow(A.dbLid.material, 2.4);
  // drapeau
  const fp = A.flagCloth.geometry.attributes.position;
  for (let i = 0; i < fp.count; i++) { const x = A.flagBase[i * 3]; fp.array[i * 3 + 2] = Math.sin(x * 7 - t * 5) * 0.06 * x; }
  fp.needsUpdate = true;
  A.flag.rotation.y = Math.sin(t * 0.7) * 0.25;
  // citoyen → mairie, puis suivi de la demande
  const Tc = 7.5, ac = ((ft % Tc) + Tc) % Tc;
  const C = A.citizen;
  const parking = gameOn('atelier');
  if (parking) C.g.visible = false;
  else if (ac < 4.2) {
    const e = ac / 4.2;
    C.g.visible = true;
    C.g.position.lerpVectors(A.cStart, A.door, e);
    C.g.position.y = Math.abs(Math.sin(ac * 7)) * 0.05;
    C.g.rotation.y = Math.atan2(A.door.x - A.cStart.x, A.door.z - A.cStart.z);
    C.g.scale.setScalar(ac < 0.3 ? ac / 0.3 : 1);
  } else if (ac < 4.6) { C.g.scale.setScalar(Math.max(0.01, 1 - (ac - 4.2) / 0.4)); }
  else C.g.visible = false;
  const tr = ac - 4.6;
  A.status.forEach((l, i) => setGlow(l.material, tr > i * 0.9 ? 2.6 : 0.35));
  // voiture qui entre, se gare, repart
  const Tp = 12, ap = ((ft % Tp) + Tp) % Tp, kc = Math.floor(ft / Tp);
  const car = A.car, laneZ = A.PZ + 0.72, sx = A.slotX, sz = A.PZ - 0.6, x0 = 0.6;
  if (parking) { car.visible = false; return; }
  car.visible = true;
  car.scale.setScalar(1);
  if (ap < 2.4) { const e = E.inOut(ap / 2.4); car.position.set(lerp(x0, sx, e), 0, laneZ); car.rotation.y = -Math.PI / 2; if (ap < 0.3) car.scale.setScalar(ap / 0.3); }
  else if (ap < 3.4) { const e = E.inOut((ap - 2.4) / 1.0); car.position.set(sx, 0, lerp(laneZ, sz, e)); car.rotation.y = lerp(-Math.PI / 2, -Math.PI, e); }
  else if (ap < 7.4) { car.position.set(sx, 0, sz); car.rotation.y = -Math.PI; }
  else if (ap < 8.4) { const e = E.inOut((ap - 7.4) / 1.0); car.position.set(sx, 0, lerp(sz, laneZ, e)); car.rotation.y = lerp(-Math.PI, -1.5 * Math.PI, e); }
  else if (ap < 10.8) { const e = E.inOut((ap - 8.4) / 2.4); car.position.set(lerp(sx, x0, e), 0, laneZ); car.rotation.y = -1.5 * Math.PI; }
  else if (ap < 11.2) { car.position.set(x0, 0, laneZ); car.scale.setScalar(Math.max(0.01, 1 - (ap - 10.8) / 0.4)); }
  else car.visible = false;
  const near = car.visible && Math.abs(car.position.x - (A.barrier.position.x)) < 1.3 && Math.abs(car.position.z - laneZ) < 0.3;
  A.barrier.rotation.x = damp(A.barrier.rotation.x, near ? 1.35 : 0, 6, dt);
  if (edge('at-bar', near)) isleSfx('atelier', 'tick', { f: 620, vol: 0.5 });
  const ent = 14 + kc + (ap > 1.2 ? 1 : 0), sor = 13 + kc + (ap > 9.6 ? 1 : 0);
  const key = `${ent}|${sor}`;
  if (key !== A.kioskState) { A.kioskState = key; A.kiosk.redraw(ent, sor, (sor % 20) + 2); }
}

function citadelleUpdate(K, dt, t) {
  const ft = clock.flow;
  // drapeau du donjon
  const fp = K.flag.geometry.attributes.position;
  for (let i = 0; i < fp.count; i++) { const x = K.flagBase[i * 3]; fp.array[i * 3 + 2] = Math.sin(x * 6 - t * 5) * 0.07 * x; }
  fp.needsUpdate = true;
  K.flag.rotation.y = Math.sin(t * 0.6) * 0.3;
  // cadran BIA : l'aiguille balaie les zones
  const zi = Math.floor(t / 2.2) % 4;
  K.needle.rotation.z = damp(K.needle.rotation.z, Math.PI / 2 - ((zi + 0.5) / 4) * Math.PI, 4, dt);
  // incident → plan de reprise (cycle de 10 s)
  const T = 10, a = ((ft % T) + T) % T;
  const hit = K.towers[1];
  const down = a > 4.0 && a < 8.6;
  const recovering = a > 4.4 && a < 9.2;
  const rto = recovering ? clamp((a - 4.4) / 2.2, 0, 1) : 0;
  const restored = recovering && rto >= 1;
  K.towers.forEach((tw, i) => {
    const bad = i === 1 && down;
    const col = bad ? 0xff5a47 : 0x7dffc4;
    tw.lamp.material.color.setHex(col).multiplyScalar(bad ? 1.8 + Math.sin(t * 12) * 0.5 : 1.6);
    tw.hl.material.color.setHex(col);
  });
  const sCol = restored ? 0x7dffc4 : recovering ? 0xffd97a : 0xc8b6f2;
  K.sLamp.material.color.setHex(sCol).multiplyScalar(recovering ? 2.0 : 1.2);
  K.sHalo.material.color.setHex(sCol);
  const key = `${Math.round(rto * 20)}|${restored}`;
  if (key !== K.rtoState) { K.rtoState = key; K.rto.redraw(rto, restored); }
  // orage
  const cx = hit.x, cz = hit.z;
  let sy = 4.1, sxo = -5, so = 0;
  if (a > 2.6 && a < 9.4) {
    const e = a < 3.8 ? E.out((a - 2.6) / 1.2) : a > 8.4 ? 1 - (a - 8.4) / 1.0 : 1;
    so = e; sxo = lerp(-5, 0, a < 3.8 ? E.inOut((a - 2.6) / 1.2) : 1) + (a > 8.4 ? (a - 8.4) * 3 : 0);
  }
  K.storm.visible = so > 0.01;
  K.storm.position.set(cx + sxo, sy + Math.sin(t * 1.2) * 0.1, cz - 0.2);
  K.storm.scale.setScalar(Math.max(0.01, so));
  K.bolt.visible = (a > 3.95 && a < 4.25) || (a > 4.45 && a < 4.6) || boosted('citBolt');
  if (edge('cit-bolt', a > 3.95 && a < 4.6)) isleSfx('citadelle', 'thunder');
  if (edge('cit-ok', restored)) isleSfx('citadelle', 'good', { vol: 0.55 });
  K.bolt.position.set(cx + 0.05, 3.8, cz + 0.1);
  K.bolt.lookAt(_cA.set(camera.position.x, 3.8, camera.position.z));
  // dépendances : impulsions
  K.links.forEach((L, li) => {
    const broken = down && (li === 0 || li === 1);
    const active = li === 3 ? recovering : !broken;
    L.m.material.emissive.setHex(broken ? 0x662018 : active && li === 3 ? 0x2b5a48 : 0x000000);
    L.m.material.color.setHex(broken ? 0xff8c7a : li === 3 && !recovering ? 0xe4dcf5 : 0xc8b6f2);
    L.sp.forEach((s, k) => {
      s.visible = active;
      if (!active) return;
      const u = ((t * 0.45 + k / 3) % 1);
      s.position.lerpVectors(L.a, L.b, u);
      s.position.y = 0.2;
      s.material.color.setHex(li === 3 ? 0xffd97a : 0x7dffc4);
    });
  });
  // migration : le chariot emmène un bloc du Django vers le socle BPCE
  const Tm = 5.0, am = ((ft % Tm) + Tm) % Tm;
  let u, drop, carry = true;
  if (am < 0.7) { u = 0; drop = lerp(1.25, 0.9, E.inOut(am / 0.7)); }
  else if (am < 2.6) { u = E.inOut((am - 0.7) / 1.9); drop = 0.9; }
  else if (am < 3.3) { u = 1; drop = lerp(0.9, 1.15, E.inOut((am - 2.6) / 0.7)); }
  else { u = 1 - E.inOut((am - 3.3) / 1.7); drop = 0.8; carry = false; }
  K.trolley.position.lerpVectors(K.P1, K.P2, u);
  K.cable.scale.y = drop;
  K.block.visible = carry;
  K.block.position.copy(K.trolley.position); K.block.position.y -= drop + 0.25;
  K.block.material = K.blockMats[u > 0.5 ? 1 : 0];
  K.block.rotation.y = Math.sin(t * 2) * 0.15;
  if (am > 3.0 && am < 3.3) K.block.scale.setScalar(Math.max(0.01, 1 - (am - 3.0) / 0.3)); else K.block.scale.setScalar(1);
  if (edge('cit-drop', am > 3.0 && am < 3.3)) isleSfx('citadelle', 'pop', { f: 520, vol: 0.5 });
  // documentation : une page tourne ; tests qui passent un par un
  const pc = t % 6;
  K.page.visible = pc > 4.6 && pc < 5.8;
  if (K.page.visible) K.page.rotation.z = E.inOut((pc - 4.6) / 1.2) * Math.PI;
  const n = Math.min(5, Math.floor((t % 8) / 1.2));
  if (n !== K.testsN) { K.testsN = n; K.tests.redraw(n); }
}

function tourUpdate(T, dt, t) {
  const ft = clock.flow;
  // tête de Nao : regarde doucement autour, l'objectif pulse
  T.head.rotation.y = Math.sin(t * 0.35) * 0.5 + 0.15;
  setGlow(T.lens.material, 1.5 + Math.sin(t * 2.4) * 0.35);
  // avions de papier vers l'antenne
  const Tp = 1.9;
  for (let i = 0; i < T.planes.length; i++) {
    const m = T.planes[i];
    const k = Math.floor((ft - i * (Tp / T.planes.length)) / (Tp * 2));
    const a = ((ft - i * (Tp / T.planes.length)) % (Tp * 2) + Tp * 2) % (Tp * 2);
    if (a > Tp) { m.visible = false; continue; }
    const hsh = Math.imul(k * 4 + i + 3, 2654435761) >>> 0;
    const ang = (hsh % 360) / 360 * TAU;
    _tA.set(T.TX + Math.cos(ang) * 9, 6.8 + (hsh % 3), T.TZ + Math.sin(ang) * 9);
    const e = a / Tp;
    arcPos(_tB, _tA, T.antTip, 1.2, E.inOut(e));
    arcPos(_tC, _tA, T.antTip, 1.2, E.inOut(Math.min(1, e + 0.02)));
    m.visible = true;
    m.position.copy(_tB);
    m.lookAt(T.g.localToWorld(_tC));
    m.scale.setScalar(e > 0.9 ? Math.max(0.01, (1 - e) * 10) : 1);
  }
  // messages vocaux : ondes autour de la tête
  T.waves.forEach((w, i) => {
    const a = ((t * 0.8 + i / 3) % 1);
    w.visible = true;
    w.position.set(T.TX, 5.0, T.TZ);
    w.rotation.x = Math.PI / 2;
    w.scale.setScalar(1.2 + a * 2.2);
    w.material.opacity = 0.55 * (1 - a);
  });
  // levier : Codex ↔ Claude Code
  const side = Math.floor(t / 5) % 2;
  if (side !== T.sideK) { if (T.sideK !== undefined) isleSfx('tour', 'tick', { f: 480, vol: 0.6 }); T.sideK = side; }
  T.lever.rotation.z = damp(T.lever.rotation.z, side ? -0.55 : 0.55, 5, dt);
  setGlow(T.swLamps[0].material, side ? 0.4 : 2.4);
  setGlow(T.swLamps[1].material, side ? 2.4 : 0.4);
  // mode Mission : les étapes avancent
  const n = Math.floor((t % 10) / 2);
  const mk = `${n}|${Math.floor(t / 10) % 2}`;
  if (mk !== T.missionN) { T.missionN = mk; T.mission.redraw(Math.min(4, n), Math.floor(t / 10) % 2); }
  // digest de veille → boîte aux lettres
  const Tm = 4.5, am = ((ft % Tm) + Tm) % Tm;
  if (edge('to-mail', am > 1.4 && am < 1.6)) isleSfx('tour', 'pop', { f: 990, vol: 0.35 });
  if (am < 1.6) {
    T.env.visible = true;
    arcPos(T.env.position, T.mailFrom, T.mailTo, 1.0, E.inOut(am / 1.6));
    T.env.rotation.set(0, am * 2, Math.sin(am * 6) * 0.2);
    T.env.scale.setScalar(am > 1.4 ? Math.max(0.01, (1.6 - am) / 0.2) : 1);
  } else T.env.visible = false;
  // MCP : impulsions vers les autres assistants
  T.mcp.forEach((m, i) => {
    const u = ((t * 0.5 + i * 0.5) % 1);
    m.curve.getPoint(clamp(u, 0, 0.999), m.pulse.position);
    m.b.head.rotation.y = Math.sin(t * 1.4 + i) * 0.3;
    setGlow(m.b.eyes.material, u > 0.9 ? 3.2 : 2.0);
  });
  // chez Nao : écran et vapeur du mug
  if (!(t < T.pcNext)) { T.pcNext = t + 0.5; T.pc.redraw(Math.floor(t * 2)); }

    const a = (i / 33) * TAU + t * 0.25;

    _tDm.rotation.set(0, -a + Math.PI / 2, 0);
    _tDm.scale.setScalar(1);
    _tDm.updateMatrix();
    T.tools.setMatrixAt(i, _tDm.matrix);
  }
  T.tools.instanceMatrix.needsUpdate = true;
  // mémoire
  T.mem.rotation.y = t * 0.3;
  T.memNodes.forEach((m, i) => m.scale.setScalar(1 + Math.max(0, Math.sin(t * 2 - i)) * 0.35));

  if (edge('to-ok', aa >= 2.1 && aa < 2.6) && !approving) isleSfx('tour', 'good', { vol: 0.45 });
  if (aa < 1.2) { arcPos(T.token.position, T.hubPt, T.gate, 0.8, E.inOut(aa / 1.2)); T.token.material.color.setHex(0xffd97a); }
  else if (aa < 2.6) { T.token.position.copy(T.gate); T.token.position.y += Math.sin(aa * 8) * 0.04; lamp = aa < 2.1 ? 0xffc34d : 0x7dffc4; T.token.material.color.setHex(aa < 2.1 ? 0xffd97a : 0x7dffc4); }
  else if (aa < 3.6) { T.g.worldToLocal(icon.getWorldPosition(_tA)); _tA.y += 0.3; arcPos(T.token.position, T.gate, _tA, 0.6, E.inOut((aa - 2.6) / 1.0)); T.token.material.color.setHex(0x7dffc4); }
  else T.token.visible = false;
  T.token.material.color.multiplyScalar(1.5);
  if (!approving) { T.agLamp.material.color.setHex(lamp).multiplyScalar(lamp === 0xfbf3e6 ? 1 : 1.8); T.agHalo.material.color.setHex(lamp); }
  T.gIcons.forEach((c, i) => { c.position.y = (c === icon && aa > 3.4 && aa < 4.0) ? 0.95 : damp(c.position.y, 0.7 + (i % 2) * 0.1, 6, dt); });
  // sous-agents : aller chercher des preuves, revenir
  T.drones.forEach((d, i) => {
    const Td = 6.0, ad = ((ft + i * 0.5) % Td + Td) % Td;

    if (ad < 1.6) arcPos(d.position, T.hubPt, src, 1.0, E.inOut(ad / 1.6));
    else if (ad < 2.6) { d.position.copy(src); d.position.y += 0.1 + Math.sin(ad * 6) * 0.06; carry = ad > 2.1; }
    else if (ad < 4.2) { arcPos(d.position, src, T.hubPt, 1.0, E.inOut((ad - 2.6) / 1.6)); carry = true; }
    else { d.position.copy(T.hubPt); d.position.y += Math.sin(t * 3 + i) * 0.05; }
    d.visible = ad < 4.4;
    d.userData.card.visible = carry;
    d.rotation.y = t * 2 + i;
  });
}

function posteUpdate(Q, dt, t) {
  const ft = clock.flow;
  const T = 12, a = ((ft % T) + T) % T;
  const camW = camera.position;
  // la candidate
  const C = Q.cand;
  keyLerp(Q.keys, a, C.g.position);
  const moving = Q.prev.distanceToSquared(C.g.position) > 1e-6;
  if (moving) C.g.rotation.y = dampAngle(C.g.rotation.y, Math.atan2(C.g.position.x - Q.prev.x, C.g.position.z - Q.prev.z), 10, dt);
  else C.g.rotation.y = dampAngle(C.g.rotation.y, Math.PI, 6, dt);
  Q.prev.copy(C.g.position);
  C.g.position.y = moving ? Math.abs(Math.sin(t * 9)) * 0.05 : 0;
  C.g.scale.setScalar(a < 0.3 ? a / 0.3 : a > 11.5 ? Math.max(0.01, (12 - a) / 0.5) : 1);
  C.armR.rotation.x = (a > 11.0 && a < 11.8) || boosted('poCand') ? -2.6 + Math.sin(t * 12) * 0.2 : damp(C.armR.rotation.x, 0, 6, dt);
  // le CV part dans la machine
  if (a > 1.2 && a < 1.9) {
    Q.cvIn.visible = true;
    _pA.copy(C.g.position); _pA.y = 1.0;
    arcPos(Q.cvIn.position, _pA, Q.slot, 0.6, E.inOut((a - 1.2) / 0.7));
    Q.cvIn.lookAt(camW);
  } else Q.cvIn.visible = false;
  setGlow(Q.parser.material, a > 1.9 && a < 2.8 ? 2.8 + Math.sin(t * 20) : 0.8);
  // trois onglets vers les guichets
  Q.tabs.forEach((m, i) => {
    const t0 = 2.0 + i * 0.25;
    if (a > t0 && a < t0 + 1.1) {
      m.visible = true;
      const cn = Q.counters[i];
      arcPos(m.position, Q.slot, _pA.set(cn.x, 1.0, cn.z - 0.1), 1.2, E.inOut((a - t0) / 1.1));
      m.rotation.set(0, (a - t0) * 4, 0);
    } else m.visible = false;
  });
  // questions et réponses aux guichets
  Q.counters.forEach((cn, i) => {
    const q0 = 3.4 + i * 2.0;
    const on = a > q0 && a < q0 + 1.1;
    cn.qm.visible = on;
    if (edge('po-q' + i, on)) isleSfx('poste', 'pop', { f: 620 + i * 130, vol: 0.4 });
    if (on) { const e = Math.min(1, (a - q0) / 0.25); cn.qm.scale.setScalar(E.outBack(e)); cn.qm.quaternion.copy(camera.quaternion); cn.qm.position.y = 2.6 + Math.sin(t * 4) * 0.04; }
    cn.bot.head.rotation.y = on ? Math.sin(t * 5) * 0.2 : damp(cn.bot.head.rotation.y, 0, 5, dt);
    setGlow(cn.bot.eyes.material, on ? 3.0 : 2.0);
    cn.bot.arms[1].rotation.x = on ? -0.8 + Math.sin(t * 8) * 0.25 : damp(cn.bot.arms[1].rotation.x, 0, 5, dt);
  });
  // réponses : de la candidate vers l'agent, puis des agents vers la presse et la mémoire
  Q.answers.forEach((m) => { m.visible = false; });
  for (let i = 0; i < 3; i++) {
    const q0 = 3.4 + i * 2.0 + 0.6;
    const cn = Q.counters[i];
    if (a > q0 && a < q0 + 0.6) {
      const m = Q.answers[i];
      m.visible = true;
      _pA.copy(C.g.position); _pA.y = 1.0;
      arcPos(m.position, _pA, _pB.set(cn.x, 1.2, cn.z - 0.4), 0.5, E.inOut((a - q0) / 0.6));
    }
    const s0 = 9.0 + i * 0.12;
    if (a > s0 && a < s0 + 0.9) {
      const m = Q.answers[i];
      m.visible = true;
      arcPos(m.position, _pA.set(cn.x, 1.3, cn.z - 0.5), Q.press, 1.4, E.inOut((a - s0) / 0.9));
      m.rotation.y = a * 5;
    }
  }
  if (a > 9.2 && a < 10.0) {
    const m = Q.answers[3];
    m.visible = true;
    arcPos(m.position, _pA.set(Q.counters[1].x, 1.3, Q.counters[1].z - 0.5), Q.memIn, 1.2, E.inOut((a - 9.2) / 0.8));
  }
  Q.drawers.forEach((d, i) => { d.position.z = Q.memIn.z - 0.17 + (i === 1 && a > 9.3 && a < 10.4 ? Math.sin(((a - 9.3) / 1.1) * Math.PI) * 0.35 : 0); });
  // la presse imprime : Word, puis PDF, puis la candidate le reçoit
  const printing = a > 9.9 && a < 11.0;
  if (edge('po-print', printing)) isleSfx('poste', 'stamp', { vol: 0.5 });
  if (edge('po-done', a > 11.0 && a < 11.8)) isleSfx('poste', 'tada', { vol: 0.4 });
  Q.rollers.forEach((m, i) => { if (printing) m.rotation.x += dt * (i ? -8 : 8); });
  if (a > 9.9 && a < 12.0) {
    Q.doc.visible = true;
    Q.doc.material = Q.docMats[a > 10.6 ? 1 : 0];
    if (a < 10.9) {
      const e = E.out(Math.min(1, (a - 9.9) / 0.6));
      Q.doc.position.set(Q.press.x, 1.1, Q.press.z + 0.3 + e * 0.5);
      Q.doc.lookAt(camW);
      Q.doc.scale.setScalar(a > 10.55 && a < 10.7 ? 1.25 : 1);
    } else if (a < 11.5) {
      _pA.copy(C.g.position); _pA.y = 1.25;
      arcPos(Q.doc.position, _pB.set(Q.press.x, 1.1, Q.press.z + 0.8), _pA, 0.7, E.inOut((a - 10.9) / 0.6));
      Q.doc.lookAt(camW);
    } else { Q.doc.position.copy(C.g.position); Q.doc.position.y = 1.9 + Math.sin(t * 6) * 0.04; Q.doc.lookAt(camW); Q.doc.scale.setScalar(Math.max(0.01, C.g.scale.x)); }
  } else Q.doc.visible = false;
  // la loupe sur la fiche de poste
  const lx = Math.sin(t * 0.9) * 0.4, ly = 1.25 + Math.sin(t * 1.3) * 0.25;
  Q.lensInner.position.set(lx, ly, 0.25);
  const hi = Math.floor(t * 1.2);
  if (hi !== Q.offerK) { Q.offerK = hi; Q.offer.redraw(hi); }
  // offres France Travail
  const jk = Math.floor(t / 2.5);
  if (jk !== Q.jobsK) { Q.jobsK = jk; Q.jobs.redraw(jk); }
}

  // mode 2 : le staff (7,5 s)

  });

  const stage = a2 < 2.3 ? 1 : a2 < 4.8 ? 2 : 3;
  if (stage !== S.tacState) { S.tacState = stage; S.tactics.redraw(stage); }
}

   Un grand PDF de cours s'ouvre, ses pages volent vers la machine à
   découper (Docling, détection de ruptures), les segments sont rangés dans
   le fichier FAISS. Autour du bureau, quatre agents : le Planner planifie,
   l'Executor écrit la question à partir des preuves, le Critic la juge,

const _bA = new THREE.Vector3(), _bB = new THREE.Vector3();
function pageTex(col = '#27314D') {
  return canvasTex(96, 128, (c, w, h) => {
    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h);
    c.fillStyle = col; c.fillRect(10, 12, 50, 9);
    c.fillStyle = 'rgba(39,49,77,.4)';
    for (let i = 0; i < 8; i++) c.fillRect(10, 32 + i * 11, i % 3 === 2 ? 44 : 74, 5);
  });
}
function cpDraw(c, w, h, k = 0) {
  c.fillStyle = '#26304D'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#FFD97A'; c.font = "700 16px 'JetBrains Mono', monospace"; c.fillText(_t('RUPTURES'), 12, 22);
  c.strokeStyle = '#7FD9B5'; c.lineWidth = 3; c.beginPath();
  const brk = [0.22, 0.47, 0.71];
  for (let i = 0; i <= 60; i++) { const x = i / 60; const v = 0.6 + 0.12 * Math.sin(x * 40) - brk.reduce((s, b) => s + 0.45 * Math.exp(-((x - b) ** 2) / 0.0006), 0); const px = 10 + x * (w - 20), py = h - 14 - v * (h - 44); if (i) c.lineTo(px, py); else c.moveTo(px, py); }
  c.stroke();
  brk.forEach((b, i) => { if (i < k) { const x = 10 + b * (w - 20); c.strokeStyle = '#FF8C7A'; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(x, 30); c.lineTo(x, h - 8); c.stroke(); c.setLineDash([]); } });
}

function studioUpdate(U, dt, t) {
  const ft = clock.flow;
  // Boris parle à la caméra
  const B = U.boris;
  if (B.mode !== 'talk') B.play('talk', 2.6 + (Math.floor(t) % 3));
  B.lookAt = U.camPt;
  B.update(dt, t);
  setGlow(U.rec.material, Math.floor(t * 1.5) % 2 ? 2.4 : 0.3);
  setGlow(U.ring.material, boosted('suRing') ? 3.2 : 1.5 + Math.sin(t * 2) * 0.1);
  // la vidéo verticale
  const k = Math.floor(t * 1.25);
  if (k !== U.feedK && !gameOn('studio')) { U.feedK = k; U.feed.redraw(k); }
  U.hearts.forEach((s, i) => {
    const a = ((t * 0.5 + i / U.hearts.length) % 1);
    s.position.set(U.heartBase.x + Math.sin(a * 8 + i) * 0.18, U.heartBase.y + a * 2.4, U.heartBase.z);
    s.material.opacity = a < 0.1 ? a * 10 : 1 - Math.max(0, (a - 0.6) / 0.4);
    s.scale.setScalar(0.22 + a * 0.2);
  });
  // antenne de veille
  U.waves.forEach((w, i) => {
    const a = ((t * 0.6 + i / 3) % 1);
    w.position.copy(U.mastTop);
    w.scale.setScalar(0.6 + a * 3.2);
    w.material.opacity = 0.7 * (1 - a);
  });
  const Tn = 1.6;
  U.bubbles.forEach((b) => { b.visible = false; });
  U.news.forEach((m, i) => {
    const kk = Math.floor((ft - i * (Tn / 3) * 3) / (Tn * 3));
    const a = ((ft - i * Tn) % (Tn * 3) + Tn * 3) % (Tn * 3);
    const who = U.crowd[((Math.imul(kk * 3 + i + 7, 2654435761) >>> 0) % U.crowd.length)];
    _uB.set(who.x, 1.35, who.z);
    if (a < 1.3) {
      m.visible = true;
      arcPos(m.position, U.mastTop, _uB, 0.6, E.inOut(a / 1.3));
      m.lookAt(camera.position);
      m.scale.setScalar(a > 1.1 ? Math.max(0.01, (1.3 - a) / 0.2) : 1);
    } else m.visible = false;
    const bub = U.bubbles[i];
    if (edge('su-b' + i, a > 1.3 && a < 2.6)) isleSfx('studio', 'pop', { f: 760 + i * 90, vol: 0.28 });
    if (a > 1.3 && a < 2.6) {
      bub.visible = true;
      bub.position.set(who.x + 0.15, 1.55 + Math.sin(t * 4) * 0.03, who.z);
      bub.quaternion.copy(camera.quaternion);
      bub.scale.setScalar(E.outBack(Math.min(1, (a - 1.3) / 0.25)));
    }
  });
  U.crowd.forEach((c, i) => { c.p.g.position.y = Math.max(0, Math.sin(t * 2 + c.ph)) * 0.04; });
  // webinaire
  const sk = Math.floor(t / 3);
  if (sk !== U.slideK) { if (U.slideK !== undefined) isleSfx('studio', 'click', { vol: 0.5 }); U.slideK = sk; U.slides.redraw(sk); }
  U.audience.forEach((a) => { a.p.body.rotation.x = Math.sin(t * 1.5 + a.ph) * 0.04; });
}

function campusUpdate(K, dt, t) {
  // le petit avion : de l'IAI à l'UTBM
  const Tp = 7, a = (t % Tp) / Tp;
  const e = E.inOutSine(a);
  arcPos(_kA, K.iai, K.utbm, 2.4, e);
  arcPos(_kB, K.iai, K.utbm, 2.4, Math.min(1, e + 0.01));
  K.plane.position.copy(_kA);
  K.plane.lookAt(K.g.localToWorld(_kB));
  K.plane.rotateZ(Math.sin(t * 2) * 0.15);
  K.plane.visible = a < 0.96;
  if (edge('ca-land', a > 0.9)) isleSfx('campus', 'bell', { vol: 0.45 });
  K.plane.scale.setScalar(a < 0.05 ? a / 0.05 : a > 0.9 ? Math.max(0.01, (0.96 - a) / 0.06) : 1);
  K.trail.forEach((m, i) => {
    const u = Math.max(0, a - (i + 1) * 0.012);
    arcPos(m.position, K.iai, K.utbm, 2.4, E.inOutSine(u));
    m.visible = K.plane.visible && u > 0.02;
    m.scale.setScalar(1 - i * 0.1);
    m.material.opacity = 0.5 * (1 - i / 8);
  });
  // les diplômés lancent leur toque
  K.grads.forEach((gr) => {
    const u = ((t + gr.ph) % 4.5) / 4.5;
    const air = u < 0.36;
    if (edge('ca-cap' + gr.x, u < 0.1)) isleSfx('campus', 'whoosh', { vol: 0.35 });
    gr.p.armR.rotation.x = u < 0.12 ? -2.6 : damp(gr.p.armR.rotation.x, 0, 5, dt);
    gr.p.g.position.y = u < 0.1 ? Math.sin((u / 0.1) * Math.PI) * 0.12 : 0;
    const h = air ? Math.sin((u / 0.36) * Math.PI) * 2.0 : 0;
    gr.cap.position.set(gr.x + (air ? Math.sin(u * 18) * 0.06 : 0), gr.p.g.position.y + 1.13 + h, gr.z);
    gr.cap.rotation.set(air ? u * 16 : 0, t * 0.2 + gr.ph, 0);
  });
  K.ball.rotation.y += dt * 0.3;
}

function blocked(isl, lx, lz, rad = NAO_R) {
  for (const o of isl.obstacles) {
    if (o.c) { const dx = lx - o.x, dz = lz - o.z, rr2 = o.r + rad; if (dx * dx + dz * dz < rr2 * rr2) return true; }

  }
  return false;
}
// Hauteur du sol praticable en (x,z), ou null
function groundAt(x, z, rad = NAO_R) {
  for (const isl of WALK.islands) {
    const s = isl.s || 1;
    const lx = (x - isl.cx) / s, lz = (z - isl.cz) / s;
    if (lx < isl.bb[0] || lx > isl.bb[1] || lz < isl.bb[2] || lz > isl.bb[3]) continue;
    if (!pointInPoly(lx, lz, isl.outline)) continue;
    if (distToPolyEdge(lx, lz, isl.outline) < 0.6 / s) continue;
    let inHole = false;
    for (const h of isl.holes) if (pointInPoly(lx, lz, h) || distToPolyEdge(lx, lz, h) < 0.5 / s) { inHole = true; break; }
    if (inHole) return null;
    if (blocked(isl, lx, lz, rad / s)) return null;
    return 0;
  }
  for (const br of BRIDGES) {
    if (br.bb && (x < br.bb[0] || x > br.bb[1] || z < br.bb[2] || z > br.bb[3])) continue;
    const q = bridgeQuery(br, x, z);
    if (q.d < br.width / 2 - 0.42 && q.t <= Math.min(1.01, br.barrierT - 0.07)) return q.y;
  }

}
function registerWalkIsland(isl) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  isl.outline.forEach(([x, z]) => { a = Math.min(a, x); b = Math.max(b, x); c = Math.min(c, z); d = Math.max(d, z); });
  isl.bb = [a, b, c, d];

/* ---------- grille de navigation ---------- */
function buildNavGrid(x0, z0, x1, z1, cell = 0.5) {
  const nx = Math.ceil((x1 - x0) / cell), nz = Math.ceil((z1 - z0) / cell);
  const cells = new Uint8Array(nx * nz);
  const hy = new Float32Array(nx * nz);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const y = groundAt(x0 + (i + 0.5) * cell, z0 + (j + 0.5) * cell);
    if (y !== null) { cells[j * nx + i] = 1; hy[j * nx + i] = y; }
  }

}
function gridIdx(x, z) {
  const g = WALK.grid;
  const i = Math.floor((x - g.x0) / g.cell), j = Math.floor((z - g.z0) / g.cell);
  if (i < 0 || j < 0 || i >= g.nx || j >= g.nz) return -1;
  return j * g.nx + i;
}
function nearestWalkable(x, z, maxR = 6) {
  const g = WALK.grid;
  const i0 = Math.floor((x - g.x0) / g.cell), j0 = Math.floor((z - g.z0) / g.cell);
  const R = Math.ceil(maxR / g.cell);
  let best = -1, bd = Infinity;
  for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) {
    const i = i0 + di, j = j0 + dj;
    if (i < 0 || j < 0 || i >= g.nx || j >= g.nz) continue;
    if (!g.cells[j * g.nx + i]) continue;
    const d = di * di + dj * dj;
    if (d < bd) { bd = d; best = j * g.nx + i; }
  }
  return best;
}
function cellCenter(idx) {
  const g = WALK.grid;
  const i = idx % g.nx, j = Math.floor(idx / g.nx);
  return V3(g.x0 + (i + 0.5) * g.cell, g.hy[idx], g.z0 + (j + 0.5) * g.cell);
}
function lineWalkable(ax, az, bx, bz) {
  const d = Math.hypot(bx - ax, bz - az);
  const n = Math.max(2, Math.ceil(d / 0.2));
  for (let k = 1; k <= n; k++) {
    const t = k / n;
    const idx = gridIdx(lerp(ax, bx, t), lerp(az, bz, t));
    if (idx < 0 || !WALK.grid.cells[idx]) return false;
  }

}
function findPath(from, to) {
  const g = WALK.grid;
  let s = gridIdx(from.x, from.z);
  if (s < 0 || !g.cells[s]) s = nearestWalkable(from.x, from.z, 2);
  let e = gridIdx(to.x, to.z);
  if (e < 0 || !g.cells[e]) e = nearestWalkable(to.x, to.z, 5);
  if (s < 0 || e < 0) return null;

  if (!WALK.buf || WALK.buf.n !== N) WALK.buf = { n: N, gS: new Float32Array(N), fS: new Float32Array(N), came: new Int32Array(N), closed: new Uint8Array(N), stamp: new Uint32Array(N), gen: 0 };

  B.gen++;
  const gen = B.gen;
  const { gS, fS, came, closed, stamp } = B;
  const touch = (i) => { if (stamp[i] !== gen) { stamp[i] = gen; gS[i] = Infinity; fS[i] = Infinity; came[i] = -1; closed[i] = 0; } };
  const ex = e % g.nx, ez = Math.floor(e / g.nx);

  const heap = [];
  const push = (i) => { heap.push(i); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (fS[heap[p]] <= fS[heap[k]]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0]; const last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && fS[heap[l]] < fS[heap[m]]) m = l; if (r < heap.length && fS[heap[r]] < fS[heap[m]]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
  touch(s); touch(e);
  gS[s] = 0; fS[s] = hfun(s);
  push(s);
  let iter = 0;
  while (heap.length && iter++ < 120000) {
    const cur = pop();
    if (closed[cur]) continue;
    if (cur === e) break;
    closed[cur] = 1;
    const ci = cur % g.nx, cj = Math.floor(cur / g.nx);
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const ni = ci + di, nj = cj + dj;
      if (ni < 0 || nj < 0 || ni >= g.nx || nj >= g.nz) continue;
      const nb = nj * g.nx + ni;
      if (!g.cells[nb]) continue;
      touch(nb);
      if (closed[nb]) continue;
      if (di && dj && (!g.cells[cj * g.nx + ni] || !g.cells[nj * g.nx + ci])) continue;
      const cost = gS[cur] + (di && dj ? Math.SQRT2 : 1);
      if (cost < gS[nb]) { gS[nb] = cost; came[nb] = cur; fS[nb] = cost + hfun(nb) * 1.001; push(nb); }
    }

  if (came[e] < 0 && e !== s) return null;
  const cellsPath = [];
  for (let c = e; c >= 0; c = came[c]) { cellsPath.push(c); if (c === s) break; }
  cellsPath.reverse();
  const pts = cellsPath.map(cellCenter);
  const endGround = groundAt(to.x, to.z);
  if (endGround !== null) pts[pts.length - 1] = V3(to.x, endGround, to.z);

  const out = [V3(from.x, from.y, from.z)];
  let k = 0;
  while (k < pts.length - 1) {
    let j = pts.length - 1;
    const a = out[out.length - 1];
    while (j > k + 1 && !lineWalkable(a.x, a.z, pts[j].x, pts[j].z)) j--;
    out.push(pts[j]);
    k = j;
  }
  out.shift();
  return out;
}

/* ---------- joueur (Nao) ---------- */
const player = {
  pos: V3(), vel: V3(), yaw: 0, path: null, onArrive: null, locked: false, idleT: 0, moved: false, yawRate: 0, faceYaw: null,
