<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>L'Archipel de Boris</title>
<meta name="description" content="Le portfolio 3D de Boris Koulevo, AI Engineer. Chaque île raconte une expérience ou un projet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
:root{
  --paper:#FFFBF5; --cream:#FFF6EC; --sand:#F4E8D6; --line:#EADCC8; --line-2:#E2D1BA;
  --ink:#27314D; --ink-2:#55607D; --ink-3:#848CA3;
  --navy:#3B4A6B; --mint:#A8E6CF; --mint-ink:#1D7555; --butter:#FFD97A; --butter-ink:#8A6410;
  --coral:#FF8C7A; --coral-ink:#B8443A; --lav:#C8B6F2; --lav-ink:#5F4BAA; --sky:#BFE3F5; --sky-ink:#246A92;
  --lift: 0 1px 0 rgba(255,255,255,.95) inset, 0 3px 0 #E6D6C1, 0 16px 30px -14px rgba(39,49,77,.42);
  --lift-sm: 0 1px 0 rgba(255,255,255,.95) inset, 0 2px 0 #E6D6C1, 0 10px 22px -12px rgba(39,49,77,.4);
  --display:'Unbounded','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#D7ECF6;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit}
/* l'archipel se manipule, il ne se sélectionne pas : pas de texte surligné, de curseur ni de menu
   quand on touche l'écran pour déplacer Nao ou tourner la vue (seule la version texte reste sélectionnable) */
html,body,#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;caret-color:transparent}
.textmode{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;caret-color:auto}
@media (pointer:fine){.panel-scroll{-webkit-user-select:text;user-select:text}}
#app{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#scene:focus,#scene:focus-visible{outline:none}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 58%,rgba(255,236,214,.28) 100%)}
:focus-visible{outline:3px solid #6A7BDB;outline-offset:2px}

/* ---------- HUD ---------- */
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none;z-index:5;transition:opacity .5s,transform .5s var(--ease-out)}
.hud-top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:7px 14px 7px 8px;box-shadow:var(--lift-sm);cursor:pointer;text-align:left}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.01em;line-height:1.15}
.brand span{display:block;font-size:12px;color:var(--ink-2);line-height:1.2}
.hud-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:9px 15px 9px 12px;font-weight:600;font-size:13.5px;box-shadow:var(--lift-sm);cursor:pointer;transition:transform .15s var(--ease-out),box-shadow .15s,background .2s}
.chip:hover{background:#fff}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 0 0 #E6D6C1,0 6px 14px -10px rgba(39,49,77,.4)}
.chip svg{width:17px;height:17px;flex:none}
.chip.accent{background:var(--butter);border-color:#EFC45C;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 #E2B24A,0 12px 24px -12px rgba(138,100,16,.5)}
.chip.icon{padding:9px 11px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 3px 0 #27314D,0 12px 24px -12px rgba(39,49,77,.6)}

.hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;max-width:min(760px,calc(100% - 32px));background:rgba(255,251,245,.9);border:1px solid var(--line);border-radius:16px;padding:9px 14px;font-size:13px;color:var(--ink-2);box-shadow:var(--lift-sm);z-index:4;transition:opacity .6s,transform .6s var(--ease-out)}
.hint.gone{opacity:0;transform:translateY(12px);pointer-events:none}
.hint .k{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:#fff;border:1px solid var(--line-2);box-shadow:0 2px 0 var(--line-2);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink)}

.prompt{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:10px 20px 10px 10px;font-weight:600;font-size:14.5px;box-shadow:0 4px 0 #222B45,0 18px 34px -14px rgba(39,49,77,.7);cursor:pointer;z-index:6;animation:pop .35s var(--ease-out)}
.prompt kbd{background:var(--butter);border-color:#E9B84E;box-shadow:0 2px 0 #C9982F;color:var(--ink);min-width:28px;height:28px;font-size:12.5px}
.prompt:active{transform:translateX(-50%) translateY(2px)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.96)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* ---------- speech bubble ---------- */
.bubble{position:absolute;left:0;top:0;z-index:4;max-width:min(290px,calc(100vw - 40px));background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:11px 15px 12px;font-size:14.5px;line-height:1.42;color:var(--ink);box-shadow:var(--lift);pointer-events:none;transform-origin:50% 100%;will-change:transform}
.bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;width:16px;height:16px;background:var(--paper);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:4px}
.bubble .who{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mint-ink);margin-bottom:2px}
.bubble.boris .who{color:var(--lav-ink)}
.bubble p{margin:0}

/* ---------- island labels ---------- */
#labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.ilabel{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:0;transform-origin:50% 100%;will-change:transform,opacity;pointer-events:none}
.ilabel button{pointer-events:auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:rgba(255,251,245,.94);border:1px solid var(--line);border-radius:14px;padding:6px 11px 7px;box-shadow:var(--lift-sm);cursor:pointer;text-align:left}
.ilabel b{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.01em;white-space:nowrap}
.ilabel small{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.ilabel .tag{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-top:3px}
.ilabel .tag{background:var(--sand);color:var(--ink-2)}
.ilabel .tag.soon{background:#F1E6FF;color:var(--lav-ink)}
.ilabel .tag.open{background:#DDF6EC;color:var(--mint-ink)}
.ilabel::after{content:"";width:2px;height:14px;background:linear-gradient(var(--line-2),transparent)}

/* ---------- case study panel ---------- */
.panel{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(468px,calc(100% - 32px));background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 60px -30px rgba(39,49,77,.55),0 3px 0 #E6D6C1;z-index:8;display:flex;flex-direction:column;overflow:hidden;transform:translateX(0);transition:transform .55s var(--ease-out),opacity .4s}
.panel.enter{transform:translateX(calc(100% + 40px));opacity:.6}
.panel-scroll{overflow-y:auto;overscroll-behavior:contain;padding:26px 26px 30px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet-grip{display:none;justify-content:center;align-items:center;flex:none;height:26px;cursor:grab;touch-action:none;position:relative;z-index:1}
.sheet-grip i{display:block;width:46px;height:5px;border-radius:9px;background:var(--line-2)}
.tour-fold{display:none;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;margin-left:auto;flex:none}
.tour-fold svg{width:15px;height:15px;transition:transform .25s}
.tour.folded .tour-fold svg{transform:rotate(180deg)}
.panel-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 var(--line-2);z-index:2}
.panel-close svg{width:18px;height:18px}
.eyebrow{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 44px 12px 0}
.eyebrow span{background:var(--sand);border-radius:7px;padding:3px 8px}
.panel h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.panel .sub{font-size:17px;line-height:1.4;color:var(--ink-2);margin:0 0 20px;text-wrap:balance}
.figure{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end;background:linear-gradient(135deg,#E3F7EE,#FFF6DD);border:1px solid #D5EEDF;border-radius:20px;padding:16px 18px;margin:0 0 24px}
.figure .lbl{grid-column:1 / -1;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mint-ink)}
.figure .num{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.figure .num s{color:var(--ink-3);text-decoration-thickness:3px;text-decoration-color:rgba(184,68,58,.55);font-weight:600;font-size:26px}
.figure .num em{font-style:normal;color:var(--mint-ink)}
.figure .note{font-size:13.5px;color:var(--ink-2);line-height:1.35;align-self:center}
.panel h3{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 8px}
.panel p{margin:0 0 10px;font-size:15.5px;line-height:1.6;max-width:62ch}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 10px 12px 8px;border-radius:16px;cursor:pointer;transition:background .2s;border:0;background:none;text-align:left;width:100%}
.step:hover,.step.on{background:#F6EEE2}
.step .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.step b{display:block;font-weight:700;font-size:15.5px;line-height:1.3;margin-bottom:2px}
.step span{display:block;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.step i{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:12.5px;font-weight:600;color:var(--sky-ink);margin-top:5px}
.results{margin:4px 0 0;padding:0 0 0 18px}
.results li{margin:0 0 6px;font-size:15.5px;line-height:1.5}
.results li::marker{color:var(--mint-ink)}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.stack span{font-family:var(--mono);font-size:12px;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.panel-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:18px;border-top:1px dashed var(--line-2)}
.next-isle{flex-basis:100%;font-size:13.5px;color:var(--ink-2);margin:0 0 4px}

/* ---------- guided tour ---------- */
.tour{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 26px 50px -26px rgba(39,49,77,.55),0 3px 0 #E6D6C1;z-index:7;padding:18px 20px 16px;transition:transform .5s var(--ease-out),opacity .4s}
.tour.enter{transform:translateY(30px);opacity:0}
.tour-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.tour-count{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.tour-quit{border:0;background:none;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.tour h4{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.tour p{margin:0;font-size:15px;line-height:1.55;color:var(--ink);min-height:4.6em}
.tour-bar{display:flex;gap:4px;margin:14px 0 12px}
.tour-bar i{flex:1;height:5px;border-radius:9px;background:#EDE2D2;overflow:hidden;position:relative}
.tour-bar i b{position:absolute;inset:0;background:var(--navy);transform-origin:0 50%;transform:scaleX(0)}
.tour-nav{display:flex;align-items:center;gap:8px}
.tour-nav .spacer{flex:1;font-size:12px;color:var(--ink-3)}
#tour-auto .i-play,#tour-auto.paused .i-pause{display:none}
.tour.auto .tour-nav .spacer{font-size:0}
#tour-auto.paused .i-play{display:block}
.tour.auto .tour-bar i b{transition:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line-2);transition:transform .12s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 3px 0 #222B45}
.btn.soft{background:var(--butter);border-color:#EBBE58;box-shadow:0 3px 0 #D9A83E}
.btn[disabled]{opacity:.45;cursor:default}
.btn.tiny{padding:6px 10px;font-size:12.5px;border-radius:10px;box-shadow:0 2px 0 var(--line-2)}
.linkish{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--sky-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.step[disabled]{cursor:default}
.step[disabled]:hover{background:none}
.timeline{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .when{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.timeline .what b{display:block;font-size:15px;line-height:1.3}
.timeline .what span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.35}
@media (max-width:420px){.timeline li{grid-template-columns:1fr auto}.timeline .when{grid-column:1 / -1;margin-bottom:-6px}}
.btn svg{width:16px;height:16px}

/* ---------- text version ---------- */
.textmode{position:absolute;inset:0;z-index:20;background:var(--cream);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tm-wrap{max-width:720px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(60px + env(safe-area-inset-bottom,0px))}
.tm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:34px}
#tm-title:focus{outline:none}
.tm-head h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1.02;letter-spacing:-.02em;margin:0 0 8px}
.tm-head p{margin:0;color:var(--ink-2);font-size:16px}
.textmode h2{font-family:var(--display);font-weight:700;font-size:22px;margin:40px 0 6px;letter-spacing:-.005em}
.textmode h3{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 6px}
.textmode p,.textmode li{font-size:16.5px;line-height:1.65;max-width:66ch}
.textmode ol,.textmode ul{padding-left:22px}
.tm-toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;padding:14px 0;border-top:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2)}
.tm-toc a{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.tm-toc a:hover{background:#fff}
.tm-sec{padding-top:6px}
.textmode h2 small{display:block;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lav-ink);margin-top:4px}
.tm-sub{font-size:18px!important;color:var(--ink-2)}
.tm-fig{background:linear-gradient(135deg,#E3F7EE,#FFF6DD);border:1px solid #D5EEDF;border-radius:16px;padding:12px 16px}
.tm-meta{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.isles{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.isles li{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15.5px;line-height:1.5}
.isles b{font-weight:700}
.isles small{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lav-ink);margin-bottom:2px}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.contact a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 2px 0 var(--line-2)}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;z-index:9;box-shadow:0 14px 30px -14px rgba(39,49,77,.7);max-width:calc(100% - 32px);text-align:center;animation:toast .35s var(--ease-out)}
@keyframes toast{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ---------- loader ---------- */
.loader{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(110% 80% at 50% 0%,#DDF0FA 0%,#FFF6EC 62%,#FFEEDB 100%);transition:opacity .9s ease,visibility .9s}
.loader.done{opacity:0;visibility:hidden}
.ld{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:440px}
.ld-nao{width:112px;height:112px;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.ld h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.02;letter-spacing:-.02em;margin:6px 0 0}
.ld .lead{margin:0;color:var(--ink-2);font-size:16px;line-height:1.5;text-wrap:balance}
.ld-bar{width:min(300px,80vw);height:8px;border-radius:9px;background:#EFE3D2;overflow:hidden;margin-top:10px;box-shadow:inset 0 1px 2px rgba(39,49,77,.12)}
.ld-bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--mint),#7FD3B4);transition:width .4s var(--ease-out)}

ntend, APIs, databases, migrations, tests.","StudySpark · bêta privée":"StudySpark · private beta","TacticIQ · projet perso":"TacticIQ · side project","TikTok, veille, webinaires":"TikTok, tech watch, webinars","Un RAG correctif et des agents qui préparent un match à partir des livres des grands entraîneurs.":"A corrective RAG and agents that prepare a match from the books of great coaches.","Un RAG correctif nourri par les livres des grands entraîneurs, et trois agents LangGraph qui préparent un plan de match.":"A corrective RAG fed by the books of great coaches, and three LangGraph agents that prepare a game plan.","Une IA qui adapte son ton aux émotions, puis environ 600 000 posts Reddit analysés pour comprendre le discours climatosceptique.":"An AI that adapts its tone to emotions, then about 600,000 Reddit posts analyzed to understand climate-skeptic discourse.","Une application de paie publique passée de 25 minutes à moins de 5 secondes, et des services municipaux mis en ligne.":"A public payroll application brought from 25 minutes down to under 5 seconds, and municipal services brought online.","Une chaîne d'agents transforme des grilles tarifaires Excel hétérogènes en XML CargoWise. Le F1 moyen passe de 49 % à 73 %.":"A chain of agents turns heterogeneous Excel rate sheets into CargoWise XML. Average F1 goes from 49% to 73%.","Une île par étape":"One island per step","Version texte":"Text version","Via Exalt Value, sur CARO, une plateforme de continuité d'activité : parcours métier, règles de criticité, puis la migration vers Java Spring, Angular et Oracle.":"Through Exalt Value, on CARO, a business continuity platform: business workflows, criticality rules, then the migration to Java Spring, Angular and Oracle.","Voir le parcours":"See the journey","Depuis juillet 2026":"Since July 2026","80 catégories":"80 categories","<em>≈ 87 %</em>":"<em>≈ 87%</em>","Anonymiser avant tout appel":"Anonymize before any call","Anonymiser d'abord":"Anonymize first","Après un premier prototype CamemBERT fine-tuné, j'ai comparé plusieurs approches, dont Gemini via Vertex AI, en performance, robustesse et coût. L'approche LLM permet à LMH d'ajouter ou de modifier une catégorie sans réentraîner de modèle.":"After a first fine-tuned CamemBERT prototype, I compared several approaches, including Gemini through Vertex AI, on performance, robustness and cost. The LLM approach lets LMH add or change a category without retraining a model.","Après un prototype CamemBERT, un benchmark a guidé le choix de Gemini via Vertex AI. Ajouter une catégorie ne demande plus de réentraîner un modèle.":"After a CamemBERT prototype, a benchmark guided the choice of Gemini through Vertex AI. Adding a category no longer requires retraining a model.","Avant tout appel à un LLM, les données sensibles sont masquées. Rien ne part en clair.":"Before any LLM call, sensitive data is masked. Nothing leaves in clear text.","Chaque demande passe sous un portique qui masque les données sensibles, grâce à la NER et à des règles. Rien ne part vers un modèle externe en clair.":"Each request passes under a gate that masks sensitive data, using NER and rules. Nothing goes to an external model in clear text.","Choix des utilisateurs, option « Autre », drift : tout est suivi dans BigQuery et Cloud Monitoring. Un golden dataset et des tests de non-régression passent avant chaque déploiement.":"User choices, the “Other” option, drift: everything is tracked in BigQuery and Cloud Monitoring. A golden dataset and regression tests run before every deployment.","Classification intelligente et en temps réel des demandes de locataires, chez un bailleur social.":"Smart, real-time classification of tenant requests at a social housing landlord.","DataFab · client Lyon Métropole Habitat":"DataFab · client: Lyon Métropole Habitat","Des catégories qui peuvent évoluer sans réentraînement systématique.":"Categories that can evolve without systematic retraining.","Environ 300 000 demandes de locataires par an, écrites librement. Avant le projet, un centre d'appel les classait à la main parmi 80 catégories.":"About 300,000 tenant requests a year, written freely. Before the project, a call center sorted them by hand among 80 categories.","Golden dataset · tests":"Golden dataset · tests","Ici arrivent environ 300 000 demandes de locataires par an, à ranger parmi 80 catégories.":"About 300,000 tenant requests land here every year, to be sorted among 80 categories.","Ici, on surveille : choix des utilisateurs, option « Autre », drift, et un golden dataset avant chaque déploiement.":"Here we monitor: user choices, the “Other” option, drift, and a golden dataset before every deployment.","L'IA allume trois boîtes sur le mur, le locataire choisit. Top-3 accuracy d'environ 87 %, via une API temps réel déployée sur Cloud Run.":"The AI lights up three boxes on the wall, the tenant chooses. Top-3 accuracy of about 87%, through a real-time API deployed on Cloud Run.","L'IA allume trois boîtes, le locataire choisit. Top-3 accuracy d'environ 87 %.":"The AI lights up three boxes, the tenant chooses. Top-3 accuracy of about 87%.","L'objectif : intégrer l'IA directement dans le parcours pour proposer tout de suite les trois catégories les plus probables. J'avais la responsabilité principale du volet technique IA.":"The goal: build AI right into the flow to suggest the three most likely categories immediately. I was the main owner of the technical AI side.","LLM · Vertex AI":"LLM · Vertex AI","Langue → FR":"Language → FR","Les locataires décrivaient librement leur problème sur une plateforme. Les demandes partaient ensuite vers un centre d'appel, où quelqu'un les classait à la main parmi 80 catégories.":"Tenants described their problem freely on a platform. The requests then went to a call center, where someone sorted them by hand among 80 categories.","Les photos jointes deviennent du texte, et les autres langues repassent en français.":"Attached photos become text, and other atform, with a real-time API that returns a top 3. Deployed on Cloud Run.","Une conformité renforcée : les données sensibles sont anonymisées avant tout appel à un LLM.":"Stronger compliance: sensitive data is anonymized before any LLM call.","Une couche de NLP qui combine NER et règles (regex) masque les données sensibles avant tout appel à un modèle externe.":"An NLP layer that combines NER and rules (regex) masks sensitive data before any call to an external model.","choix · drift · « Autre »":"choices · drift · “Other”","demande → IA → top-3":"request → AI → top 3","500 000+ dialogues":"500,000+ dialogues","600 000 posts Reddit":"600,000 Reddit posts","<em>500 000+</em>":"<em>500,000+</em>","<em>≈ 600 000</em>":"<em>≈ 600,000</em>","Alteca : une IA empathique":"Alteca: an empathetic AI","Alteca · IA empathique":"Alteca · empathetic AI","Analyse multimodale":"Multimodal analysis","Avec les chercheurs":"With the researchers","Ce que j'ai fait":"What I did","Ce télescope capte des posts Reddit. Environ 600 000, analysés avec des chercheurs de Princeton.":"This telescope picks up Reddit posts. About 600,000, analyzed with Princeton researchers.","Chaque post est classé : sceptique ou non, avec son émotion dominante.":"Each post is classified: skeptic or not, with its dominant emotion.","Chaque post est classé, sceptique ou non, avec son émotion dominante. Bi-GRU, Transformers de type BART, et des modèles multi-tâches qui mêlent texte, stance et émotions.":"Each post is classified, skeptic or not, with its dominant emotion. Bi-GRU, BART-style Transformers, and multi-task models that mix text, stance and emotions.","Chez Alteca, Boris a construit une IA qui adapte son ton à l'émotion de la personne.":"At Alteca, Boris built an AI that adapts its tone to the person’s emotion.","Chez Alteca, le sujet faisait partie d'un programme de R&D en informatique affective. Ma partie : une IA capable d'ajuster le ton et le contenu de ses réponses selon l'émotion détectée chez l'utilisateur. Empathie, apaisement, style de conversation, cohérence émotionnelle.":"At Alteca, the topic was part of an affective computing R&D program. My part: an AI able to adjust the tone and content of its answers to the emotion detected in the user. Empathy, soothing, conversation style, emotional consistency.","DataFab, l'entité data d'Alteca Group, collaborait avec Princeton sur un programme de recherche : comprendre comment le discours climatosceptique se propage sur les réseaux sociaux.":"DataFab, the data entity of Alteca Group, worked with Princeton on a research program: understanding how climate-skeptic discourse spreads on social media.","Des dialogues empathiques, nettoyés, filtrés et structurés.":"Empathetic dialogues, cleaned, filtered and structured.","Des modèles de classification du discours sceptique, dont des approches multi-tâches qui combinent représentations textuelles, stance et signaux émotionnels. Bi-GRU et Transformers de type BART, plus la détection des émotions dominantes.":"Classification models for skeptic discourse, including multi-task approaches that combine text representations, stance and emotional signals. Bi-GRU and BART-style Transformers, plus detection of dominant emotions.","Des résultats expérimentaux sur la classification du scepticisme, consignés dans les travaux du projet.":"Experimental results on skepticism classification, recorded in the project’s work.","Deux approches comparées":"Two approaches compared","Deux approches comparées : un CVAE codé from scratch, et Mistral-7B affiné avec QLoRA.":"Two approaches compared: a CVAE coded from scratch, and Mistral-7B fine-tuned with QLoRA.","Deux projets de recherche sur la même île. À droite, le labo d'Alteca, où une IA apprend à adapter son ton. À gauche, le télescope de Princeton, braqué sur des centaines de milliers de posts Reddit.":"Two research projects on the same island. On the right, Alteca’s lab, where an AI learns to adapt its tone. On the left, the Princeton telescope, pointed at hundreds of thousands of Reddit posts.","Dialogues dans le corpus":"Dialogues in the corpus","Draft de publication":"Publication draft","Flou du discours":"Vagueness of discourse","Ici, on mesure le flou : un discours vague a des paraphrases qui partent dans tous les sens.":"Here we measure vagueness: a vague discourse has paraphrases that scatter in every direction.","Je suis là.":"I’m here.","La validation méthodologique, la robustesse et l'interprétation des résultats se faisaient avec les chercheurs de Princeton et la direction R&D d'Alteca.":"Methodological validation, robustness and interpretation of results were done with the Princeton researchers and Alteca’s R&D management.","Labo Alteca · IA empathique":"Alteca lab · empathetic AI","Le discours dans le temps":"Discourse over time","Le labo":"The lab","Le labo des émotions":"The emotion lab","Le temps et les événements":"Time and events","Le travail portait sur un corpus massif de contenus Reddit. Il fallait caractériser le scepticisme, les émotions, l'imprécision du discours et ses dynamiques dans le temps, dans un environnement de travail largement anglophone.":"The work focused on a massive corpus of Reddit content. The task was to characterize skepticism, emotions, the vagueness of discourse and its dynamics over time, in a largely English-speaking work environment.","Le télescope capte des posts Reddit : des textes, des vidéos, des liens. Tout est ramené à du texte exploitable, avec de la transcription automatique pour certaines vidéos.":"The telescope picks up Reddit posts: texts, videos, links. Everything is turned into usable text, with automatic transcription for some videos.","Les volumes de discours sont mis en regard des grands événements climatiques. Les résultats ont nourri un premier draft de publication, préparé avant mon départ du projet.":"Discourse volumes are set against major climate events. The results fed a first publication draft, prepared before I left the project.","Les volumes de discours, mis en regard des grands événements climatiques.":"Discourse volumes, set against major climate events.","Les volumes et les signaux de discours mis en relation avec les grands événements climatiques.":"Discourse volumes and signals related to major climate events.","Lire l'étude":"Read the case study","Lire l'étude : Alteca":"Read the case study: Alteca","Lire l'étude : Princeton":"Read the case study: Princeton","Mesurer le flou":"Measuring vagueness","Mistral-7B affiné avec QLoRA":"Mistral-7B fine-tuned with QLoRA","Non sceptique":"Not skeptic","On se pose.":"Let’s take a breath.","Pas à pas.":"Step by step.","Plus de 500 000 dialogues":"Over 500,000 dialogues","Posts Reddit analysés":"Reddit posts analyzed","Princeton : 600 000 posts":"Princeton: 600,000 posts","Recherche appliquée sur la propagation du discours climatosceptique, avec des chercheurs de Princeton.":"Applied research on how climate-skeptic discourse spreads, with Princeton researchers.","Sceptique ou non":"Skeptic or not","Un stage de six mois, de février à août 2024. Un projet de recherche, resté expérimental.":"A six-month internship, from February to August 2024. A research project that stayed experimental.","Tester en conversation":"Testing in conversation","Textes, vidéos et liens ramenés à un seul corpus exploitable.":"Texts, videos and links brought into a single usable corpus.","Textes, vidéos, liens externes et métadonnées ramenés à un corpus exploitable pour le NLP, avec de la transcription automatique pour certaines vidéos et du scraping pour les contenus liés.":"Texts, videos, external links and metadata brought into an NLP-ready corpus, with automatic transcription for some videos and scraping for linked content.","Tout commence par les données. Une revue de littérature, puis plus de 500 000 dialogues empathiques, nettoyés, filtrés et structurés.":"It all starts with data. A literature review, then over 500,000 empathetic dialogues, cleaned, filtered and structured.","Trop bien !":"So good!","Un CVAE codé from scratch":"A CVAE coded from scratch","Un CVAE codé from scratch en PyTorch, conditionné par l'émotion, pour régler finement la réponse. Et Mistral-7B affiné avec QLoRA, pour des réponses plus naturelles.":"A CVAE coded from scratch in PyTorch, conditioned on emotion, to fine-tune the answer. And Mistral-7B fine-tuned with QLoRA, for more natural answers.","Un corpus consolidé et annoté pour la suite des analyses.":"A consolidated, annotated corpus for further analysis.","Un corpus de plus de 500 000 dialogues":"A corpus of over 500,000 dialogues","Un corpus homogène":"A consistent corpus","Un discours vague se reconnaît à ses paraphrases : elles s'éloignent les unes des autres dans l'espace des embeddings. L'imprécision devient mesurable.":"Vague discourse shows in its paraphrases: they drift apart from each other in embedding space. Vagueness becomes measurable.","Un fine-tuning de Mistral-7B avec QLoRA, pour des réponses plus naturelles et une meilleure généralisation. Puis une comparaison qualitative et fonctionnelle des deux approches.":"Fine-tuning Mistral-7B with QLoRA, for more natural answers and better generalization. Then a qualitative and functional comparison of the two approaches.","Un premier draft de publication scientifique, préparé avant mon départ du projet. Le travail a continué ensuite, et je ne connais pas l'état final de la publication.":"A first draft of a scientific publication, prepared before I left the project. The work continued afterwards, and I don’t know the final status of the publication.","Un programme de R&D en informatique affective. Quand la personne est triste, en colère ou inquiète, l'IA ajuste le ton et le contenu de sa réponse.":"An affective computing R&D program. When the person is sad, angry or worried, the AI adjusts the tone and content of its answer.","Une API Flask/FastAPI pour exposer le modèle, une interface React pour évaluer les réponses en conditions interactives, et un suivi des performances et de la cohérence.":"A Flask/FastAPI API to serve the model, a React interface to evaluate answers interactively, and tracking of performance and consistency.","Une IA qui adapte le ton de ses réponses à l'émotion de la personne en face.":"An AI that adapts the tone of its answers to the emotion of the person it talks to.","Une architecture CVAE en PyTorch, conditionnée par l'émotion de l'utilisateur, pour contrôler finement les dimensions émotionnelles de la réponse.":"A CVAE architecture in PyTorch, conditioned on the user’s emotion, to finely control the emotional dimensions of the answer.","Une quantification de l'imprécision du discours, à partir de paraphrases et de distances dans l'espace d'embeddings.":"A quantification of discourse vagueness, based on paraphrases and distances in embedding space.","Une revue de littérature d'abord (IA empathique, conditionnement émotionnel, architectures variationnelles, LLM), puis la constitution, le nettoyage et le filtrage d'un corpus de dialogues empathiques.":"First a literature review (empathetic AI, emotional conditioning, variational architectures, LLMs), then building, cleaning and filtering a corpus of empathetic dialogues.","VOLUME DE DISCOURS":"DISCOURSE VOLUME","et grands événements climatiques":"and major climate events","temps →":"time →","25 min → moins de 5 s":"25 min → under 5 s","Actualités":"News","Ancienne base":"Legacy database","Automatisation Excel":"Excel automation","Avant, 25 minutes de traitement. Après, moins de 5 secondes.":"Before, 25 minutes of processing. After, under 5 seconds.","CENETI est un organisme public togolais qui gère des systèmes d'information de l'administration. Son application de paie, une application legacy, automatisait les calculs et portait un gros volume de données historiques.":"CENETI is a Togolese public body that runs information systems for the administration. Its payroll application, a legacy app, automated the calculations and carried a large volume of historical data.","CENETI · paie publique":"CENETI · public payroll","CIDO est une société de conseil togolaise. Son client, une collectivité municipale de la région de Kloto, voulait remplacer plusieurs processus papier par une seule plateforme web.":"CIDO is a Togolese consulting firm. Its client, a municipality in the Kloto region, wanted to replace several paper processes with a single web platform.","CIDO · services municipaux":"CIDO · municipal services","Chaque fichier importé est parsé et vérifié avant insertion. Les erreurs sont détectées avant d'entrer dans la base.":"Each imported file is parsed and checked before insertion. Errors are caught before they enter the database.","De 25 minutes à moins de 5 secondes":"From 25 minutes to under 5 seconds","Des calculs beaucoup plus rapides":"Much faster calculations","Des démarches d'état civil en ligne, avec des workflows qui suivent le statut de chaque demande et en gardent l'historique.":"Civil registry procedures online, with workflows that track the status of each request and keep its history.","Des erreurs manuelles en forte baisse grâce aux imports automatisés et contrôlés.":"Far fewer manual errors thanks to automated, checked imports.","Des imports Excel contrôlés":"Checked Excel imports","Des imports Excel fiables":"Reliable Excel imports","Décisions":"Decisions","En cours":"In progress","Enregistrement des entrées, des propriétaires et des véhicules, suivi des sorties, et des vues de recettes pour le suivi quotidien.":"Recording entries, owners and vehicles, tracking exits, and revenue views for daily follow-up.","Et le stationnement municipal : entrées, sorties, recettes du jour.":"And municipal parking: entries, exits, daily revenue.","Extraire, transformer, valider, réinjecter : tout l'historique a été migré, sans perte.":"Extract, transform, validate, reload: the whole history was migrated, with no loss.","Frontend responsive":"Responsive frontend","Hôpital":"Hospital","Ici, Boris a modernisé une application de paie publique. Il était le seul développeur technique du projet.":"Here, Boris modernized a public payroll application. He was the only technical developer on the project.","Imports Excel contrôlés":"Checked Excel imports","J'étais le seul développeur technique du projet, pendant environ huit mois, avec un responsable fonctionnel côté métier. Les choix d'implémentation, c'était moi.":"I was the only technical developer on the project, for about eight months, with a functional lead on the business side. The implementation choices were mine.","La mairie en ligne":"The town hall online","La paie":"Payroll","La paie publique":"Public payroll","La plateforme avait trois rôles : digitaliser des démarches administratives, centraliser des opérations municipales, et servir de vitrine numérique à une zone touristique.":"The platform had three roles: digitize administrative procedures, centralize municipal operations, and serve as a digital showcase for a tourist area.","La ville":"The town","La vitrine de la ville":"The town’s showcase","Le stationnement municipal":"Municipal parking","Les imports Excel sont vérifiés avant d'entrer dans la base. Les erreurs restent dehors.":"Excel imports are checked before they enter the database. Errors stay out.","Les services de la ville":"The town’s services","Lire l'étude : la paie publique":"Read the case study: public payroll","Lire l'étude : la ville":"Read the case study: the town","Mairie · espace citoyen":"Town hall · citizen portal","Mes premières missions, au Togo, en 2021 et 2022. Au nord, la paie publique de CENETI. Au sud, les services d'une commune mis en ligne pour CIDO.":"My first missions, in Togo, in 2021 and 2022. To the north, CENETI’s public payroll. To the south, a town’s services brought online for CIDO.","Migrer sans rien perdre":"Migrating without losing anything","Modernisation d'une application critique de calcul de la paie, pour un organisme public togolais.":"Modernizing a critical payroll calculation application for a Togolese public body.","Optimisation des requêtes SQL, des index et de la logique de calcul, et suppression des traitements redondants.":"Optimized SQL queries, indexes and calculation logic, and removed redundant processing.","Parsing, contrôles de cohérence et détection des erreurs avant insertion. Beaucoup moins d'erreurs manuelles.":"Parsing, consistency checks and error detection before insertion. Far fewer manual errors.","Pour une collectivité de la région de Kloto : un espace citoyen et un espace d'administration. Les demandes d'état civil se font en ligne, avec un statut suivi et un historique.":"For a municipality in the Kloto region: a citizen portal and an admin portal. Civil registry requests are made online, with a tracked status and a history.","Pour une commune de la région de Kloto, l'état civil passe en ligne, avec le suivi de chaque demande.":"For a town in the Kloto region, the civil registry goes online, with each request tracked.","Recettes du jour":"Daily revenue","Refonte de l'application en Laravel et MySQL, avec une interface web responsive pour les équipes métier.":"Rebuilt the application in Laravel and MySQL, with a responsive web interface for the business teams.","Requêtes SQL, index et logique de calcul repensés, traitements redondants supprimés. Le temps de traitement passe de 25 minutes à moins de 5 secondes.":"SQL queries, indexes and calculation logic reworked, redundant processing removed. Processing time drops from 25 minutes to under 5 seconds.","Reçue":"Received","Temps de traitement":"Processing time","Temps de traitement ramené d'environ 25 minutes à moins de 5 secondes.":"Processing time brought down from about 25 minutes to under 5 seconds.","Tout l'historique migré vers une base relationnelle maintenable.":"The whole history migrated to a maintainable relational database.","Traitée":"Done","Un blog pour les événements, les décisions et les travaux. Le recensement des écoles, des hôpitaux et des autres services. Et les points d'intérêt de la zone touristique mis en valeur.":"A blog for events, decisions and public works. A directory of schools, hospitals and other services. And the tourist area’s points of interest showcased.","Un blog pour publier événements, décisions et travaux, le recensement des écoles, des hôpitaux et des autres services, et la mise en valeur des points d'intérêt.":"A blog to publish events, decisions and public works, a directory of schools, hospitals and other services, and a showcase of points of interest.","Un espace citoyen, un espace admin":"A citizen portal, an admin portal","Un gain de l'ordre de ×300 après la refonte.":"A gain of about ×300 after the rebuild.","Un module qui enregistre les entrées, les véhicules et leurs propriétaires, puis les sorties. Les recettes du jour se suivent dans des vues dédiées.":"A module that records entries, vehicles and their owners, then exits. Daily revenue is followed in dedicated views.","Un modèle de données solide":"A solid data model","Un modèle relationnel pour les citoyens, les demandes, les contenus, le stationnement et les opérations administratives. Du full-stack, des écrans aux règles métier.":"A relational model for citizens, requests, content, parking and administrative operations. Full-stack, from screens to business rules.","Un pipeline ETL en Python extrait, transforme, valide puis réinjecte l'historique dans MySQL. Toutes les données migrées, sans rupture.":"A Python ETL pipeline extracts, transforms, validates and reloads the history into MySQL. All data migrated, with no break.","Un pipeline ETL en Python pour extraire, transformer, valider et réinjecter l'historique de paie. D'une base legacy de type fichier vers une base relationnelle SQL, sans perte de cohérence ni rupture fonctionnelle.":"A Python ETL pipeline to extract, transform, validate and reload the payroll history. From a file-based legacy database to a relational SQL database, with no loss of consistency and no functional break.","Une application critique, qui calcule la paie et porte des années d'historique. J'étais le seul développeur technique, avec un responsable fonctionnel côté métier.":"A critical application that computes payroll and carries years of history. I was the only technical developer, with a functional lead on the business side.","Une application documentée, et des utilisateurs formés.":"A documented application, and trained users.","Une architecture web moderne":"A modern web architecture","Une migration sans perte":"A lossless migration","Une paie publique legacy":"A legacy public payroll","Une plateforme web pour digitaliser les services d'une collectivité de la région de Kloto, au Togo.":"A web platform to digitize the services of a municipality in the Kloto region, in Togo.","École":"School","Événements":"Events","état civil · stationnement":"civil registry · parking","Activités critiques":"Critical activities","Analyser l'impact":"Analyzing impact","CARO aide à piloter la continuité d'activité : quelles activités sont critiques, de quoi elles dépendent, quelles ressources elles mobilisent, en combien de temps il faut les reprendre et avec quelle stratégie.":"CARO helps manage business continuity: which activities are critical, what they depend on, which resources they use, how fast they must be restored and with which strategy.","CARO pilote la continuité d'activité : ce qui est critique, et comment reprendre quand ça casse.":"CARO manages business continuity: what is critical, and how to recover when it breaks.","CARO, une plateforme pour piloter la continuité d'activité : activités critiques, dépendances, ressources, objectifs et stratégies de reprise.":"CARO, a platform to manage business continuity: critical activities, dependencies, resources, recovery objectives and strategies.","Des activités critiques, reliées par leurs dépendances. Quand l'une tombe, la stratégie de reprise prend le relais dans l'objectif de temps fixé. Ce sont ces règles que CARO rend opérationnelles.":"Critical activities, linked by their dependencies. When one goes down, the recovery strategy takes over within the set time objective. These are the rules CARO puts into practice.","Des règles de criticité fiables":"Reliable criticality rules","Des règles métier complexes (criticité, objectifs de reprise) traduites en fonctionnalités. Et les écarts entre le cahier des charges, les règles attendues et le comportement réel, analysés un par un.":"Complex business rules (criticality, recovery objectives) turned into features. And the gaps between the specification, the expected rules and the actual behavior, analyzed one by one.","Documenter et tester":"Documenting and testing","Développement full-stack des parcours de Business Impact Analysis, des activités critiques, des ressources, et des plans et stratégies de reprise.":"Full-stack development of the Business Impact Analysis workflows, critical activities, resources, and recovery plans and strategies.","Exalt Value · client Groupe BPCE":"Exalt Value · client: Groupe BPCE","Ici, la maquette Django migre vers le socle BPCE : Java Spring Boot, Angular et Oracle.":"Here, the Django prototype moves to the BPCE stack: Java Spring Boot, Angular and Oracle.","La maquette part vers le stack interne du groupe : Java Spring Boot côté backend, Angular côté frontend, Oracle pour les données.":"The prototype moves to the group’s in-house stack: Java Spring Boot on the backend, Angular on the frontend, Oracle for data.","La migration vers Java, Angular et Oracle lancée, pour un produit compatible avec l'écosystème interne.":"The migration to Java, Angular and Oracle launched, for a product that fits the in-house ecosystem.","La migration vers le socle BPCE":"The migration to the BPCE stack","La mission portait sur une maquette fonctionnelle en Django, à préparer pour sa reprise par les équipes internes BPCE. Une équipe de trois ou quatre personnes, et un rôle technique très tation and interactive documentation of the rules. A stable base, ready for client test campaigns and for handover to another team.","Un rôle central dans la migration de la maquette vers le stack interne : backend de Python/Django vers Java Spring Boot, frontend vers Angular, persistance vers Oracle.":"A central role in migrating the prototype to the in-house stack: backend from Python/Django to Java Spring Boot, frontend to Angular, persistence to Oracle.","Une architecture et une documentation prêtes pour la reprise par les développeurs internes BPCE.":"An architecture and documentation ready for handover to BPCE’s internal developers.","Une base prête à être reprise":"A base ready for handover","Une maquette enrichie et stabilisée, avec des parcours métier complets.":"An enriched and stabilized prototype, with complete business workflows.","Vers le socle BPCE":"Toward the BPCE stack","continuité":"continuity","continuité d’activité":"business continuity","criticité · objectifs de reprise":"criticality · recovery objectives","d'activité":"of activity","objectifs de reprise":"recovery objectives","parcours BIA":"BIA workflows","règles de criticité":"criticality rules","stratégies de reprise":"recovery strategies","33 outils et des approbations":"33 tools and approvals","33 outils typés":"33 typed tools","33 outils · approbations":"33 tools · approvals","33 outils, et des approbations":"33 tools, and approvals","Android, usage personnel":"Android, personal use","Approbation requise":"Approval required","Avant une action sensible, l'agent demande la permission. À chaque fois.":"Before a sensitive action, the agent asks for permission. Every time.","Bascule entre Codex et Claude Code, avec des sessions persistantes. On peut interrompre un tour, recharger le runtime, réinitialiser une session ou changer de provider.":"Switches between Codex and Claude Code, with persistent sessions. You can interrupt a turn, reload the runtime, reset a session or change provider.","Ce qu'elle sait faire":"What she can do","Cette tour, c'est moi. Boris m'a construite pour agir à sa place, depuis Telegram.":"This tower is me. Boris built me to act on his behalf, from Telegram.","Chez Nao":"Nao’s place","Comment c'est construit":"How it’s built","Depuis début 2026":"Since early 2026","Des automatisations cron en production : une veille IA qui finit en digest email, la préparation et la publication LinkedIn via Postiz. Et un serveur MCP qui expose Nao à d'autres assistants.":"Cron automations in production: an AI tech watch that ends in an email digest, LinkedIn post preparation and publishing through Postiz. And an MCP server that exposes Nao to other assistants.","Des automatisations en production":"Automations in production","Des sous-agents bornés, parallèles et strictement read-only vont chercher des preuves sur plusieurs sujets, puis les rapportent au run principal.":"Bounded, parallel, strictly read-only subagents gather evidence on several topics, then report it back to the main run.","Des sous-agents bornés, parallèles et strictement read-only, qui cherchent sur plusieurs sujets et rapportent leurs preuves au run parent.":"Bounded, parallel, strictly read-only subagents that search several topics and report their evidence to the parent run.","Des sous-agents en lecture seule":"Read-only subagents","Des tâches longues, sur plusieurs tours ou plusieurs heures : un plan, un journal persistant, une reprise après interruption, et des modes auto ou pas à pas.":"Long tasks, over several turns or several hours: a plan, a persistent log, recovery after interruption, and auto or step-by-step modes.","Deux agents que je construis pour moi. À gauche, Nao, mon agent opérateur du quotidien. À droite, Personal Agent, une application mobile qui transforme une conversation en mémoire et en actions.":"Two agents I build for myself. On the left, Nao, my everyday operator agent. On the right, Personal Agent, a mobile app that turns a conversation into memory and actions.","Deux moteurs au choix":"Two engines to choose from","Différence avec Nao":"How it differs from Nao","Du contexte long et du proactif":"Long context and proactive features","Environ 2 mois de développement":"About 2 months of development","Evals et benchmark du modèle principal, pour mesurer latence et comportement.":"Evals and a benchmark of the main model, to measure latency and behavior.","Je voulais l'agent personnel que je ne trouvais pas sur le marché : un agent qui relie personnes, organisations, projets, faits, notes, tâches, événements, rappels et sources, pour restituer le bon contexte au bon moment.":"I wanted the personal agent I couldn’t find on the market: an agent that links people, organizations, projects, facts, notes, tasks, events, reminders and sources, to bring back the right context at the right time.","Je voulais une alternative personnelle, légère et très automatisable aux agents opérateurs grand public. Nao tourne tous les jours depuis début 2026. C'est aussi elle qui te guide dans cet archipel.":"I wanted a personal, lightweight and highly automatable alternative to consumer operator agents. Nao has been running every day since early 2026. She is also your guide in this archipelago.","L'application est installée sur mon téléphone Android et je l'utilise au quotidien. Elle n'est pas ouverte au public.":"The app is installed on my Android phone and I use it every day. It isn’t open to the public.","L'idée":"The idea","Le mode Mission":"Mission mode","Le runtime bascule entre Codex et Claude Code, avec des sessions persistantes. Je peux interrompre un tour, recharger le runtime ou changer de provider.":"The runtime switches between Codex and Claude Code, with persistent sessions. I can interrupt a turn, reload the runtime or change provider.","Les credentials, les locks et les sessions sont séparés, et les données non fiables venues du web, des mails ou des réseaux sociaux sont traitées à part.":"Credentials, locks and sessions are kept separate, and untrusted data from the web, emails or social media is handled apart.","Lire l'étude : Nao":"Read the case study: Nao","Lire l'étude : Personal Agent":"Read the case study: Personal Agent","Mon agent opérateur":"My operator agent","Mon agent opérateur personnel. Sur Telegram, avec accès à mon PC, elle exécute des missions, fait ma veille et automatise mes publications.":"My personal operator agent. On Telegram, with access to my PC, she carries out missions, does my tech watch and automates my posts.","Mon moteur ? Codex ou Claude Code. Boris bascule de l'un à l'autre quand il veut.":"My engine? Codex or Claude Code. Boris switches between them whenever he wants.","Mémoire":"Memory","Mémoire et actions":"Memory and actions","Nao, sur Telegram":"Nao, on Telegram","Outils métier typés":"Typed business tools","Personal Agent reste dans un environnement applicatif maîtrisé : il n'accède qu'aux données, documents et connecteurs que je lui ai explicitement branchés. Nao, elle, peut agir sur mon PC et lancer des workflows locaux plus larges.":"Personal Agent stays in a controlled app environment: it only accesses the data, documents and connectors I explicitly plugged in. Nao, on the other hand, can act on my PC and run broader local workflows.","Personal Agent, c'est une autre histoire : une app mobile qui garde la mémoire de tout.":"Personal Agent is another story: a mobile app that remembers everything.","Pour les longues missions : un plan, un journal, et je reprends là où je me suis arrêtée.":"For long missions: a plan, a log, and I pick up where I left off.","Pour les tâches longues, parfois sur plusieurs heures : un plan, un journal persistant, une reprise après interruption, en mode auto ou pas à pas.":"For long tasks, sometimes over several hours: a plan, a persistent log, recovery after interruption, in auto or step-by-step mode.","Qualité":"Quality","Rédaction":"Writing","Serveur MCP":"MCP server","Sous-agents · lecture seule":"Subagents · read-only","Sécurité":"Security","Telegram · missions · MCP":"Telegram · missions · MCP","Tests de contrat, tests du runtime et des outils.":"Contract tests, runtime and tool tests.","Texte, images, fichiers, PDF et messages vocaux. Transcription avec Whisper, synthèse vocale, et des réponses intermédiaires en streaming, avec la progression des outils.":"Text, images, files, PDFs and voice messages. Transcription with Whisper, text-to-speech, and streamed intermediate replies, with tool progress.","Texte, images, fichiers, PDF, messages vocaux : tout arrive par Telegram. Les réponses et la progression des outils repartent en streaming.":"Text, images, files, PDFs, voice messages: everything comes in through Telegram. Replies and tool progress stream back.","Un checkpoint conversationnel incrémental en plus des derniers tours verbatim, des workers SQL avec lease et retry, des briefs proactifs qui respectent le fuseau et les heures calmes, et une synchronisation avec Google Calendar, Gmail, Drive et Docs.":"An incremental conversation checkpoint on top of the last turns kept verbatim, SQL workers with lease and retry, proactive briefs that respect the time zone and quiet hours, and sync with Google Calendar, Gmail, Drive and Docs.","Un runtime central avec 33 outils métier typés et validés par Pydantic. Runs, appels d'outils, messages et sources sont persistés, et une approbation est demandée avant les écritures sensibles ou les actions externes.":"A central runtime with 33 typed business tools validated by Pydantic. Runs, tool calls, messages and sources are persisted, and approval is requested before sensitive writes or external actions.","Un runtime central avec 33 outils métier typés, validés par Pydantic. Avant une écriture sensible ou une action externe, l'agent demande une approbation.":"A central runtime with 33 typed business tools, validated by Pydantic. Before a sensitive write or an external action, the agent asks for approval.","Un runtime multi-provider":  a déjà dit est gardé en mémoire, pour poser de moins en moins de questions. Et l'API France Travail propose des offres.":"What the candidate has already said is kept in memory, so fewer and fewer questions get asked. And the France Travail API suggests job offers.","Ce que tu as déjà dit reste en mémoire : de moins en moins de questions.":"What you’ve already said stays in memory: fewer and fewer questions.","Chaque guichet est un agent. Il pose les questions qui manquent : des chiffres, du contexte, des livrables.":"Each counter is an agent. It asks the missing questions: numbers, context, deliverables.","Chercher une offre, comprendre ce qu'elle attend, repérer ce qui manque dans son CV, l'adapter, puis produire une version propre et lisible par les ATS : tout ça prend un temps fou.":"Finding an offer, understanding what it expects, spotting what’s missing in your CV, tailoring it, then producing a clean, ATS-readable version: it all takes a huge amount of time.","Comment ça marche":"How it works","Compétences":"Skills","D'abord, on lit le CV. Et la fiche de poste passe à la loupe.":"First, the CV is read. And the job description goes under the magnifying glass.","Des agents qui posent des questions":"Agents that ask questions","En ligne":"Live","Environ 200 utilisateurs historiques, et leurs retours pour améliorer le parcours.":"About 200 early users, and their feedback to improve the flow.","Expériences, compétences, formation : chaque agent repère ce qui manque et pose des questions ciblées. Des chiffres, du contexte, des livrables.":"Experience, skills, education: each agent spots what’s missing and asks targeted questions. Numbers, context, deliverables.","Fiche de poste":"Job description","Ici, on aide les candidats à adapter leur CV à une offre. C'est Pass ATS, le produit de Boris.":"Here, candidates get help tailoring their CV to a job offer. It’s Pass ATS, Boris’s product.","Le CV en PDF est parsé : expériences, formations, compétences, langues, projets. La fiche de poste est analysée pour en tirer les compétences et les mots-clés attendus.":"The PDF CV is parsed: experience, education, skills, languages, projects. The job description is analyzed to extract the expected skills and keywords.","Le problème":"The problem","Lecture du CV":"CV reading","Lire le CV et l'offre":"Reading the CV and the offer","Mémoire et offres":"Memory and offers","Mémoire utilisateur":"User memory","OFFRES · FRANCE TRAVAIL":"OFFERS · FRANCE TRAVAIL","Où en est le produit":"Where the product stands","Pass ATS : des agents qui posent les bonnes questions pour adapter un CV à une offre, jusqu'au fichier Word et PDF prêt pour les ATS.":"Pass ATS: agents that ask the right questions to tailor a CV to a job offer, all the way to an ATS-ready Word and PDF file.","Pass ATS vise à réduire ce temps. Le projet a démarré fin 2025 et il est toujours en développement actif.":"Pass ATS aims to cut that time. The project started in late 2025 and is still under active development.","Pass ATS · CV et offres":"Pass ATS · CVs and offers","Pass ATS, mon produit : des agents qui aident un candidat à adapter son CV à une offre. Environ 200 personnes l'ont utilisé.":"Pass ATS, my product: agents that help a candidate tailor their CV to a job offer. About 200 people have used it.","Produit personnel":"Personal product","Trois guichets, trois agents":"Three counters, three agents","Un CV prêt pour les ATS":"An ATS-ready CV","Un CV reconstruit, en Word puis en PDF":"A rebuilt CV, in Word then PDF","Un agent final reconstruit le CV avec les réponses et les attentes de l'offre. Il le génère en Word, puis en PDF.":"A final agent rebuilds the CV with the answers and the offer’s expectations. It generates it in Word, then PDF.","Un agent final reformule le CV à partir des réponses et des attentes de l'offre, puis le génère en Word et en PDF, dans une structure claire et exploitable par les ATS.":"A final agent rewrites the CV from the answers and the offer’s expectations, then generates it in Word and PDF, in a clear structure that ATS can read.","Un agent pour les expériences, un pour les hard et soft skills, un pour la formation. Ils détectent les informations manquantes et vont chercher résultats chiffrés, contextes, responsabilités et livrables.":"One agent for experience, one for hard and soft skills, one for education. They detect missing information and go after quantified results, context, responsibilities and deliverables.","Une mémoire utilisateur qui réduit peu à peu le nombre de questions, et l'API France Travail pour rechercher et recommander des offres.":"A user memory that gradually reduces the number of questions, and the France Travail API to search for and recommend offers.","Une nouvelle version, plus puissante, en préparation.":"A new, more powerful version in the works.","Une plateforme web full-stack en ligne, gratuite à ce stade.":"A full-stack web platform, live and free for now.","Une version publique en ligne, gratuite. Une version plus avancée est en préparation.":"A public version online, for free. A more advanced version is in the works.","Upload et parsing automatique du CV en PDF (expériences, formations, compétences, langues, projets), et analyse de la fiche de poste pour repérer compétences attendues, responsabilités et mots-clés.":"Upload and automatic parsing of the PDF CV (experience, education, skills, languages, projects), and analysis of the job description to spot expected skills, responsibilities and keywords.","Utilisateurs historiques":"Early users","À la fin, un CV propre, en Word puis en PDF, lisible par les ATS.":"In the end, a clean CV, in Word then PDF, readable by ATS.","≈ 200 utilisateurs":"≈ 200 users","Après chaque recherche, la pertinence des extraits est évaluée explicitement. Si les preuves ne suffisent pas, la requête est reformulée, et les meilleurs extraits sont gardés d'une tentative à l'autre.":"After each search, the relevance of the excerpts is explicitly assessed. If the evidence isn’t enough, the query is rewritten, and the best excerpts are kept from one attempt to the next.","Après chaque recherche, la pertinence des extraits est évaluée. Carton rouge : la question est reformulée et on recommence, en gardant les meilleurs extraits.":"After each search, the relevance of the excerpts is assessed. Red card: the question is rewritten and we start again, keeping the best excerpts.","Architecture hexagonale":"Hexagonal architecture","Base tactique · ChromaDB":"Tactics base · ChromaDB","Comprendre la question":"Understanding the question","Côté ingénierie":"On the engineering side","Des contrats de données explicites entre agents, pour limiter l'ambiguïté et garder la traçabilité.":"Explicit data contracts between agents, to limit ambiguity and keep traceability.","Détection de la langue et décomposition de la question en sous-problèmes tactiques, puis recherche vectorielle dans ChromaDB, avec embeddings et métadonnées.":"Language detection and breaking the question down into tactical sub-problems, then vector search in ChromaDB, with embeddings and metadata.","En attente":"Waiting","Ici, les livres des grands entraîneurs deviennent une base de connaissances. C’est TacticIQ.":"Here, the books of great coaches become a knowledge base. It’s TacticIQ.","Je voulais apprendre le RAG sur un sujet qui me passionne vraiment. Plutôt qu'un RAG générique sur des documents standards, TacticIQ s'appuie sur des livres et des contenus tactiques de grands entraîneurs (Guardiola, Klopp, Mourinho, Bielsa…).":"I wanted to learn RAG on a topic I’m truly passionate about. Rather than a generic RAG on standard documents, TacticIQ relies on books and tactical content from great coaches (Guardiola, Klopp, Mourinho, Bielsa…).","Juger chaque extrait":"Judging each excerpt","L'Extractor structure l'équipe, l'adversaire et le contexte, et peut demander des précisions. L'Analyzer interroge la base via le CRAG et le web pour trouver concepts, patterns et faiblesses. Le Synthesizer en tire un plan de jeu et un rapport pour le coach.":"The Extractor structures the team, the opponent and the context, and can ask for details. The Analyzer queries the base through the CRAG and the web to find concepts, patterns and weaknesses. The Synthesizer turns it into a game plan and a report for the coach.","L'arbitre juge chaque extrait":"The referee judges each excerpt","L'arbitre juge chaque extrait. Carton rouge : on reformule la question.":"The referee judges each excerpt. Red card: the question gets rewritten.","La question est découpée en sous-problèmes tactiques. Une recherche vectorielle va chercher les passages utiles dans ChromaDB.":"The question is broken into tactical sub-problems. A vector search fetches the useful passages from ChromaDB.","La question part à la bibliothèque":"The question goes to the library","La réponse arrive dans la langue de l'utilisateur, avec ses sources et ses citations. Chaque étape remonte en direct vers l'interface, en SSE.":"The answer comes back in the user’s language, with its sources and citations. Each step is streamed live to the interface, over SSE.","La réponse est générée dans la langue de l'utilisateur, avec ses sources et ses citations. Les étapes du pipeline et la réponse arrivent en streaming (SSE).":"The answer is generated in the user’s language, with its sources and citations. The pipeline steps and the answer are streamed (SSE).","Le pipeline CRAG réutilisé comme outil interne du système multi-agents.":"The CRAG pipeline reused as an internal tool of the multi-agent system.","Le pipeline fonctionne de bout en bout et il a été déployé pour des tests. Il sert à moi et à quelques proches, et il pourrait un jour servir à des coachs.":"The pipeline works end to end and was deployed for testing. It serves me and a few people close to me, and could one day serve coaches.","Le staff : trois agents qui préparent un match, de la description au plan de jeu.":"The staff: three agents that prepare a match, from the description to the game plan.","Le staff prépare le match":"The staff prepares the match","Le web en dernier recours":"The web as a last resort","Mode 1 : un RAG correctif":"Mode 1: a corrective RAG","Mode 2 : préparer un match":"Mode 2: preparing a match","Mode 2 : trois agents orchestrés par LangGraph. L'Extractor structure le contexte, l'Analyzer cherche patterns et faiblesses, le Synthesizer écrit le plan de jeu.":"Mode 2: three agents orchestrated by LangGraph. The Extractor structures the context, the Analyzer looks for patterns and weaknesses, the Synthesizer writes the game plan.","Plan de jeu":"Game plan","Pourquoi le foot":"Why football","Préparation":"Preparation","Préparation de match":"Match preparation","Quand la base ne suffit pas, cette antenne part chercher sur le web.":"When the base isn’t enough, this antenna goes searching the web.","Quand les nouvelles tentatives ne suffisent pas, une recherche web Tavily prend le relais.":"When the new attempts aren’t enough, a Tavily web search takes over.","RAG correctif · multi-agents":"Corrective RAG · multi-agent","Recherche dans la base…":"Searching the base…","Recherche web · Tavily":"Web search · Tavily","Recherche web…":"Web search…","Reformulation…":"Rewriting…","Réponse":"Answer","Réponse sourcée":"Sourced answer","Si les nouvelles tentatives ne suffisent pas, une recherche web Tavily complète les preuves.":"If the new attempts aren’t enough, a Tavily web search completes the evidence.","TacticIQ : un assistant de tactique football nourri par les livres des grands entraîneurs, et une préparation de match multi-agents.":"TacticIQ: a football tactics assistant fed by the books of great coaches, and a multi-agent match preparation.","TacticIQ · RAG et agents":"TacticIQ · RAG and agents","TacticIQ, mon projet pour apprendre le RAG sur un sujet qui me passionne : la tactique football. La base de connaissances, ce sont les livres des grands entraîneurs.":"TacticIQ, my project to learn RAG on a topic I love: football tactics. The knowledge base is the books of great coaches.","Testé de bout en bout":"Tested end to end","Trois agents orchestrés par LangGraph":"Three agents orchestrated by LangGraph","Un suivi pensé autour de quelques métriques : pertinence au premier essai, reformulations, recours au web, latence.":"Monitoring built around a few metrics: first-try relevance, rewrites, web fallback, latency.","Une architecture hexagonale, un backend FastAPI et un frontend React.":"A hexagonal architecture, a FastAPI backend and a React frontend.","Une réponse sourcée":"A sourced answer","Une réponse sourcée, en direct":"A sourced answer, live","Chapitre 2 · question 4":"Chapter 2 · question 4","Chaque réponse du quiz renvoie au passage du cours qui la justifie. Pas de réponse sans source.":"Each quiz answer points to the course passage that justifies it. No answer without a source.","Chaque réponse du quiz renvoie à sa source dans le cours.":"Each quiz answer points to its source in the course.","Chaque segment est vectorisé et rangé dans FAISS, pour retrouver les bons passages au moment d'écrire une question.":"Each segment is embedded and stored in FAISS, to find the right passages when writing a question.","Côté technique":"On the technical side","Des embeddings indexés dans FAISS, et une sélection des segments les plus pertinents au moment de générer le quiz.":"Embeddings indexed in FAISS, and a selection of the most relevant segments when generating the quiz.","Découpe · Docling":"Splitting · Docling","Découper au bon endroit":"Splitting in the right place","Extraction légère avec PyMuPDF ou avancée avec Docling, en gardant titres, sections et sous-sections.":"Light extraction with PyMuPDF or advanced extraction with Docling, keeping titles, sections and subsections.","Heuristiques de titres, embeddings et détection de ruptures : le cours est découpé là où le sujet change. Un LLM prend le relais quand la structure est illisible.":"Title heuristics, embeddings and change detection: the course is split where the topic changes. An LLM takes over when the structure is unreadable.","Ici, un PDF de cours devient un quiz. C’est StudySpark.":"Here, a course PDF becomes a quiz. It’s StudySpark.","Index FAISS":"FAISS index","Indexer pour retrouver":"Indexing to retrieve","La génération passe par Gemini, et tout le workflow est exposé par un backend FastAPI, avec des sorties validées par Pydantic.":"Generation runs on Gemini, and the whole workflow is served by a FastAPI backend, with outputs validated by Pydantic.","Le PDF est lu avec PyMuPDF ou Docling, sans perdre sa structure : titres, sections, sous-sections.":"The PDF is read with PyMuPDF or Docling, keeping its structure: titles, sections, subsections.","Le Planner choisit la stratégie et la répartition des questions, l'Executor récupère les preuves et écrit questions et réponses, le Critic juge clarté, difficulté et diversité, le Verifier vérifie que chaque réponse est justifiée par une citation du PDF.":"The Planner picks the strategy and the spread of questions, the Executor retrieves the evidence and writes questions and answers, the Critic judges clarity, difficulty and diversity, the Verifier checks that each answer is backed by a quote from the PDF.","Le Planner décide quoi demander, l'Executor écrit la question à partir des preuves, le Critic juge sa clarté et sa difficulté, le Verifier contrôle la citation.":"The Planner decides what to ask, the Executor writes the question from the evidence, the Critic judges its clarity and difficulty, the Verifier checks the citation.","Le cours est découpé là où le sujet change, puis rangé dans FAISS.":"The course is split where the topic changes, then stored in FAISS.","Le pipeline":"The pipeline","Le pipeline fonctionne, et une bêta privée est ouverte à quelques personnes depuis que j'ai présenté le projet sur LinkedIn. Ce n'est pas mon projet prioritaire aujourd'hui.":"The pipeline works, and a private beta   tor: (r, t, rs = 12, ts = 32, arc = TAU) => new THREE.TorusGeometry(r, t, rs, ts, arc),
  cone: (r, h, s = 16) => new THREE.ConeGeometry(r, h, s),

// géométrie indexée : les sommets partagés ne sont transformés qu'une fois par le GPU
function ensureIndexed(g) {
  if (g.index) return g;
  const n = g.attributes.position.count;
  const idx = n < 65536 ? new Uint16Array(n) : new Uint32Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function flipWinding(g) {
  const ix = g.index;
  for (let i = 0; i + 2 < ix.count; i += 3) { const t = ix.getX(i + 1); ix.setX(i + 1, ix.getX(i + 2)); ix.setX(i + 2, t); }
}
// Fusionne les meshes statiques d'un groupe par matériau (réduit les draw calls).
function bake(group, { cast = true, receive = true, shallow = false } = {}) {
  group.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
  const buckets = new Map();
  const toRemove = [];
  const visit = (o) => {
    if (!o.isMesh || o.userData.keep || o.isInstancedMesh || Array.isArray(o.material)) return;
    if (o.material.transparent) return;
    const g = ensureIndexed(o.geometry.clone());
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    g.applyMatrix4(m);
    if (m.determinant() < 0) flipWinding(g);
    const key = o.material.uuid + (g.attributes.color ? 'c' : '');
    if (!buckets.has(key)) buckets.set(key, { material: o.material, geos: [], cast: o.castShadow, receive: o.receiveShadow });
    const b = buckets.get(key);
    b.geos.push(g);
    b.cast = b.cast || o.castShadow;
    toRemove.push(o);
  };
  if (shallow) group.children.slice().forEach(visit); else group.traverse(visit);
  for (const o of toRemove) o.parent.remove(o);
  for (const b of buckets.values()) {
    const hasColor = b.geos.some((g) => g.attributes.color);
    if (hasColor) b.geos.forEach((g) => { if (!g.attributes.color) { const n = g.attributes.position.count; const a = new Float32Array(n * 3).fill(1); g.setAttribute('color', new THREE.Float32BufferAttribute(a, 3)); } });
    const merged = mergeGeometries(b.geos, false);
    if (!merged) continue;
    const mm = new THREE.Mesh(merged, b.material);
    mm.castShadow = cast && b.cast;
    mm.receiveShadow = receive;
    group.add(mm);
  }
  // Nettoyage des groupes vides
  const empties = [];
  group.traverse((o) => { if (o !== group && o.type === 'Group' && o.children.length === 0) empties.push(o); });
  empties.forEach((o) => o.parent && o.parent.remove(o));
  return group;
}
