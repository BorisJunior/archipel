const keys = new Set();
const MOVE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

function goTo(point, onArrive = null) {
  const p = findPath(player.pos, point);
  if (!p || !p.length) { if (onArrive) onArrive(); return false; }
  player.path = p;
  player.onArrive = onArrive;
  return true;
}
function teleport(p, yaw = null) {
  player.pos.set(p.x, groundAt(p.x, p.z) ?? 0, p.z);
  player.vel.set(0, 0, 0);
  player.path = null;
  if (yaw !== null) player.yaw = yaw;
}

function updatePlayer(dt) {
  let ix = 0, iz = 0;
  if (!player.locked) {
    if (keys.has('KeyW') || keys.has('ArrowUp')) iz -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) iz += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  }
  const des = _v1.set(0, 0, 0);
  if (ix || iz) {
    const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    const rx = -fz, rz = fx;
    des.set(rx * ix + fx * -iz, 0, rz * ix + fz * -iz).normalize().multiplyScalar(MAX_SPEED);
    player.path = null;
    player.onArrive = null;
    player.moved = true;
  } else if (player.path && !player.locked) {
    const wp = player.path[0];
    const dx = wp.x - player.pos.x, dz = wp.z - player.pos.z;
    const d = Math.hypot(dx, dz);
    const last = player.path.length === 1;
    if (d < (last ? 0.12 : 0.4)) {
      player.path.shift();
      if (!player.path.length) {
        player.path = null;
        const cb = player.onArrive; player.onArrive = null;
        if (cb) cb();
      }
    } else {
      const sp = last ? MAX_SPEED * Math.min(1, d / 1.3) + 0.4 : MAX_SPEED;
      des.set((dx / d) * sp, 0, (dz / d) * sp);
    }
  }
  const k = des.lengthSq() > 0 ? 8 : 6;
  player.vel.x = damp(player.vel.x, des.x, k, dt);
  player.vel.z = damp(player.vel.z, des.z, k, dt);
  const nx = player.pos.x + player.vel.x * dt, nz = player.pos.z + player.vel.z * dt;
  let y = groundAt(nx, nz);
  if (y !== null) { player.pos.x = nx; player.pos.z = nz; }
  else {
    const yx = groundAt(nx, player.pos.z);
    if (yx !== null) { player.pos.x = nx; player.vel.z *= 0.6; y = yx; }
    else {
      const yz = groundAt(player.pos.x, nz);
      if (yz !== null) { player.pos.z = nz; player.vel.x *= 0.6; y = yz; }
      else player.vel.multiplyScalar(0.4);
    }
  }
  const gy = groundAt(player.pos.x, player.pos.z);
  if (gy !== null) player.pos.y = damp(player.pos.y, gy, 10, dt);
  const speed = Math.hypot(player.vel.x, player.vel.z);
  const prevYaw = player.yaw;
  if (speed > 0.35) { player.yaw = dampAngle(player.yaw, Math.atan2(player.vel.x, player.vel.z), 9, dt); player.idleT = 0; }
  else {
    player.idleT += dt;
    if (player.faceYaw !== null && player.faceYaw !== undefined) player.yaw = dampAngle(player.yaw, player.faceYaw, 8, dt);
    else if (player.idleT > 2.5) player.yaw = dampAngle(player.yaw, cam.yaw, 1.6, dt);

  NAO.root.rotation.y = player.yaw;
  NAO.speed = speed;
  NAO.lean = clamp(speed / MAX_SPEED, 0, 1) * 0.24;
  NAO.bank = clamp(-player.yawRate * 0.06, -0.25, 0.25);

/* ---------- caméra ---------- */
const cam = {
  mode: 'intro', yaw: 0.32, pitch: 0.66, dist: 23, target: V3(), fly: null,
  shiftX: 0, shiftY: 0, userYawV: 0, lookAhead: V3(), minDist: 11, maxDist: 50,

function camPoseTo(yaw, pitch, dist, target, outPos) {
  const cp = Math.cos(pitch);
  return outPos.set(target.x + Math.sin(yaw) * cp * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * cp * dist);
}
function flyTo(dest, duration = 2, ease = E.inOut, then = null) {
  if (cam.fly) cam.fly.kill();
  const from = { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist, target: cam.target.clone() };
  let dyaw = dest.yaw - from.yaw;
  dyaw = ((dyaw + Math.PI) % TAU + TAU) % TAU - Math.PI;
  cam.mode = 'fly';
  const d = REDUCED ? Math.min(duration, 0.35) : duration;
  cam.fly = tween({
    duration: d, ease,
    onUpdate: (e) => {
      cam.yaw = from.yaw + dyaw * e;
      cam.pitch = lerp(from.pitch, dest.pitch, e);
      // arc : on prend un peu de recul au milieu du trajet
      const bump = dest.arc ? Math.sin(e * Math.PI) * dest.arc : 0;
      cam.dist = lerp(from.dist, dest.dist, e) + bump;
      cam.target.lerpVectors(from.target, dest.target, e);

  });
}
function followPose() {
  return { yaw: cam.yaw, pitch: 0.66, dist: 23, target: V3(player.pos.x, player.pos.y + 0.9, player.pos.z), mode: 'follow' };
}
const _sunAim = new THREE.Vector3();
function updateCamera(dt) {
  if (cam.mode === 'follow') {
    const tx = player.pos.x + player.vel.x * 0.35, tz = player.pos.z + player.vel.z * 0.35;
    cam.target.x = damp(cam.target.x, tx, 3.2, dt);
    cam.target.y = damp(cam.target.y, player.pos.y + 0.9, 3.2, dt);
    cam.target.z = damp(cam.target.z, tz, 3.2, dt);
    cam.yaw += cam.userYawV * dt;

  camPoseTo(cam.yaw, cam.pitch, cam.dist, cam.target, camera.position);
  camera.lookAt(cam.target);

  { const nearV = clamp(cam.dist * 0.05, 0.3, 4); if (Math.abs(camera.near - nearV) > nearV * 0.08) { camera.near = nearV; camera.updateProjectionMatrix(); } }

    camera.setViewOffset(innerWidth, innerHeight, cam.shiftX, cam.shiftY, innerWidth, innerHeight);

  const tiltAmt = TILT.strength * (cam.mode === 'map' || cam.dist > 60 ? 0.5 : 1);
  tiltH.uniforms.strength.value = tiltV.uniforms.strength.value = tiltAmt;

  // cadre des ombres : plus serré sur téléphone, et avancé vers ce que la caméra regarde

  const ext = cam.dist > 60 ? 70 : DIRECT ? 17 : 26;
  _sunAim.set(cam.target.x - camera.position.x, 0, cam.target.z - camera.position.z);
  const la = _sunAim.length();

// repère fixe de la lumière (direction constante du soleil)
const SUN_BASIS = (() => {
  const f = SUN_OFFSET.clone().normalize().negate();

function buildDecor() {
  const keep = [];

  let seed = 1400;
  for (const id of ISLE_ORDER) {
    if (id === 'port') continue;
    const isl = ISLANDS[id];
    if (!isl) continue;
    const r = mulberry32(seed++);
    const free = (x, z, rad) => pointInPoly(x, z, isl.outline) && distToPolyEdge(x, z, isl.outline) > 0.6 + rad && !blocked(isl, x, z, rad + 0.25) && !(isl.paths || []).some(([ax, az, bx, bz, w]) => distToSeg(x, z, ax, az, bx, bz) < w / 2 + rad + 0.3) && !keep.some(([k, kx, kz, kr]) => k === id && Math.hypot(kx - x, kz - z) < kr + rad);

// petites remarques quand Nao reste immobile un moment
const IDLE = { next: 14, n: {} };
function updateIdleChat(dt) {
  if (player.idleT < 0.5) IDLE.next = 14;
  if (UI.mode !== 'explore' || speech.cur || speech.queue.length || UI.busy) return;
  if (player.idleT < IDLE.next) return;
  const id = currentIsle();
  const L = NAO_LINES[id];
  if (!L || !L.facts || !L.facts.length) return;
  const k = IDLE.n[id] || 0;
  IDLE.n[id] = k + 1;
  say(L.facts[k % L.facts.length], { expr: k % 2 ? 'wink' : 'happy' });
  IDLE.next = player.idleT + 26;
}
// l'horloge d'inactivité repart dès qu'on bouge
function idleReset() { IDLE.next = 14; }

function pokeFx(world, { sfx: name = 'pop', vol = 0.7, pop = null, cls = '', line = null, cols = [0xffd97a, 0xffffff, 0xa8e6cf], n = 10, f } = {}) {
  if (name) sfx(name, { vol, f });
  if (world) burst(world, cols, n, 1.6);
  if (pop && world) gamePop(pop, world, cls);
  if (line) say(line, { expr: 'happy', now: true });
}
// petit rebond (échelle) sans toucher aux animations de l'île
function pokeBounce(obj, amt = 0.18, dur = 0.55) {
  if (!obj) return;
  if (!obj.userData.baseScale) obj.userData.baseScale = obj.scale.clone();
  const b = obj.userData.baseScale;
  tween({ duration: dur, onUpdate: (e) => { const k = 1 + Math.sin(e * Math.PI) * amt * (1 - e * 0.5); obj.scale.set(b.x * (2 - k), b.y * k, b.z * (2 - k)); }, onComplete: () => obj.scale.copy(b) });
}

function hitbox(isleId, x, y, z, sx, sy, sz) {
  const isl = isleId === 'hub' ? ISLANDS.hub : ISLANDS[isleId];

  m.position.set(x, y, z);
  isl.group.add(m);
  return m;
}

}

/* =========================================================================
   FUSION AUTOMATIQUE : après la construction, on regroupe les meshes pour
   réduire les appels de dessin (et les ombres à calculer), surtout utile
   sur téléphone.
   1) ce qui ne bouge jamais est fusionné à l'échelle de l'île ;
   2) dans un groupe animé (train, grue, Nao…), les pièces qui suivent le
      groupe sans bouger elles-mêmes sont fusionnées dans ce groupe.
   Les matériaux unis partagés (mat()) passent en couleurs de sommets : des
   objets de couleurs différentes tiennent alors en un seul appel.
   On ne touche à rien de ce que le code manipule : objets et matériaux
   référencés par les registres (îles, jeux, Nao…), objets cliquables ou
   marqués, et tout ce qui a bougé ou changé pendant une courte simulation.
   ========================================================================= */

    if (v instanceof Map || v instanceof Set) { for (const x of v.values()) visit(x, depth + 1); return; }
    for (const k of Object.keys(v)) { const x = v[k]; if (x && typeof x === 'object') visit(x, depth + 1); }
  };

  pathTo(id) { const ch = CHAPTERS[id]; const sp = ch ? ch.spawn : [1.6, 2.1]; const w = id === 'hub' ? V3(sp[0], 0, sp[1]) : isleW(id, sp[0], sp[1]); const p = findPath(player.pos, w); return p ? p.length : null; },
  pos() { return [player.pos.x, player.pos.y, player.pos.z]; },
  stats() { return { ms: Math.round(window.__arch.frameMs || 0), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures, fps: Math.round(fpsAvg) }; },
};

(async () => {
  try {
    await build();
    last = performance.now();
    requestAnimationFrame(frame);
    startUI();
    window.__arch.ready = true;
  } catch (err) {
    console.error(err);
    window.__arch.error = String(err && err.stack || err);
    const ld = document.querySelector('.ld');
    const box = document.createElement('div');
    box.className = 'ld-err';
    box.textContent = _t("L'archipel n'a pas pu se charger sur cet appareil (WebGL indisponible ou erreur). La version texte reste disponible.");
    ld.appendChild(box);
    const b = document.getElementById('ld-go');
    b.disabled = false;
    b.textContent = _t('Lire la version texte');
    b.onclick = () => openTextMode();
  }
})();

</script>
